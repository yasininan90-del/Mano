/* =========================================================
   HELPERS
========================================================= */

function todayISO() {
  const d = new Date();

  const local = new Date(
    d.getTime() - d.getTimezoneOffset() * 60000
  );

  return local.toISOString().slice(0, 10);
}

function thisMonthISO() {
  return todayISO().slice(0, 7);
}

function formatTL(n) {
  return new Intl.NumberFormat("tr-TR", {
    style: "currency",
    currency: "TRY",
    maximumFractionDigits: 2
  }).format(Number(n) || 0);
}

function formatDateLabel(iso) {
  if (!iso) return "";

  return new Date(
    iso + "T00:00:00"
  ).toLocaleDateString("tr-TR", {
    day: "numeric",
    month: "long",
    year: "numeric",
    weekday: "long"
  });
}

function formatMonthLabel(iso) {
  if (!iso) return "";

  return new Date(
    iso + "-01T00:00:00"
  ).toLocaleDateString("tr-TR", {
    month: "long",
    year: "numeric"
  });
}

function uid() {
  return (
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 8)
  );
}


/* =========================================================

/* =========================================================

function Toast({ message, type = "success" }) {

  if (!message) return null;

  return (
    <div
      className={
        "fixed left-1/2 -translate-x-1/2 bottom-5 z-[100] " +
        "px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold " +
        "flex items-center gap-2 whitespace-nowrap " +
        (type === "error"
          ? "bg-[#B4432E] text-white"
          : "bg-[#1C6B4E] text-white")
      }
    >
      <i
        data-lucide={
          type === "error"
            ? "alert-circle"
            : "check-circle-2"
        }
        className="w-4 h-4"
      ></i>

      {message}

      {refreshIcons()}
    </div>
  );
}


/* =========================================================
   LOGIN
========================================================= */

function LoginScreen({ users, onSuccess }) {

  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  async function submit(e) {

    e.preventDefault();

    setError("");

    const u = username.trim();

    if (!u || !password) {
      setError("Kullanıcı adı ve şifre gerekli.");
      return;
    }

    setLoading(true);

    try {

      /*
       Yönetici eski kullanıcı sistemiyle de
       giriş yapabilsin.
      */

      if (
        u === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
      ) {

        await ensureAdmin();

        onSuccess({
          username: ADMIN_USERNAME,
          role: "admin"
        });

        return;
      }

      const user = users?.[u];

      if (
        user &&
        user.password === password
      ) {

        onSuccess({
          username: u,
          role: user.role || "user"
        });

      } else {

        setError(
          "Kullanıcı adı veya şifre hatalı."
        );

      }

    } catch (err) {

      console.error(err);

      setError(
        "Giriş sırasında bir hata oluştu."
      );

    } finally {

      setLoading(false);

    }
  }

  return (

    <div className="min-h-screen bg-[#1C1B19] flex items-center justify-center px-5">

      <div className="w-full max-w-[360px]">

              className="w-10 h-10"
            ></i>

            Mano Pizza

            İşletme Yönetim Paneli
          </p>

        </div>

        <form
          onSubmit={submit}
          className="
            bg-[#272623]
            rounded-3xl
            p-5
            border border-[#3A3934]
          "
        >

          <label className="block mb-4">

            <span className="text-[11px] text-[#AAA69E] block mb-2">
              Kullanıcı Adı
            </span>

            <div className="relative">

              <i
                data-lucide="user"
                className="
                  absolute left-3 top-1/2
                  -translate-y-1/2
                  w-4 h-4
                  text-[#77736C]
                "
              ></i>

              <input
                autoFocus
                autoCapitalize="none"
                value={username}
                onChange={e => setUsername(e.target.value)}
                className="
                  w-full
                  h-12
                  rounded-xl
                  bg-[#1E1D1A]
                  border border-[#3A3934]
                  text-white
                  pl-10 pr-3
                  outline-none
                  text-sm
                  focus:border-[#B4432E]
                "
              />

            </div>

          </label>


          <label className="block">

            <span className="text-[11px] text-[#AAA69E] block mb-2">
              Şifre
            </span>

            <div className="relative">

              <i
                data-lucide="lock"
                className="
                  absolute left-3 top-1/2
                  -translate-y-1/2
                  w-4 h-4
                  text-[#77736C]
                "
              ></i>

              <input

/* =========================================================
   DASHBOARD
========================================================= */

function Dashboard({
  purchases,
  sales,
  stores,
  costs
}) {

  const today = todayISO();

  const purchaseToday = useMemo(() => {

    const day = purchases[today] || {};

    return Object.values(day)
      .flat()
      .reduce(
        (sum, item) =>
          sum +
          Number(item.qty || 0) *
          Number(item.unitPrice || 0),
        0
      );

  }, [purchases]);


  const salesToday = useMemo(() => {

    const day = sales[today] || {};

    return Object.values(day)
      .reduce(
        (sum, row) =>
          sum +
          (Number(row.qty) || 0) *
          (Number(row.unitPrice) || 0),
        0
      );

  }, [sales]);


  const month = thisMonthISO();

  const monthSales = useMemo(() => {

    return Object.entries(sales)
      .filter(([d]) => d.startsWith(month))
      .reduce(
        (total, [, rows]) =>
          total +
          Object.values(rows || {})
            .reduce(
              (s, r) =>
                s +
                (Number(r.qty) || 0) *
                (Number(r.unitPrice) || 0),
              0
            ),
        0
      );

  }, [sales, month]);


  const monthPurchase = useMemo(() => {

    return Object.entries(purchases)
      .filter(([d]) => d.startsWith(month))
      .reduce(
        (total, [, day]) =>
          total +
          Object.values(day || {})
            .flat()
            .reduce(
              (s, item) =>
                s +
                Number(item.qty || 0) *
                Number(item.unitPrice || 0),
              0
            ),
        0
      );

  }, [purchases, month]);


  const cards = [

    {
      label: "Bugünkü Satış",
      value: formatTL(salesToday),
      icon: "trending-up",
      bg: "bg-[#EAF3EE]",
      color: "text-[#1C6B4E]"
    },

    {
      label: "Bugünkü Alış",
      value: formatTL(purchaseToday),
      icon: "shopping-bag",
      bg: "bg-[#F9EDEA]",
      color: "text-[#B4432E]"
    },

    {
      label: "Aylık Satış",
      value: formatTL(monthSales),
      icon: "bar-chart-3",
      bg: "bg-[#EFEDF7]",
      color: "text-[#635B95]"
    },

    {
      label: "Aylık Net",
      value: formatTL(monthSales - monthPurchase),
      icon: "wallet",
      bg: "bg-[#F5F0E5]",
      color: "text-[#8A6D2E]"
    }

  ];


  return (

    <div className="space-y-5">

      <div>

        <h2 className="text-xl font-black">
          Genel Bakış
        </h2>

        <p className="text-xs text-[#77736C] mt-1">
          İşletmenin güncel durumunu buradan takip edebilirsin.
        </p>

      </div>


      <div className="
        grid
        grid-cols-2
        lg:grid-cols-4
        gap-3
      ">

        {cards.map(card => (

          <div
            key={card.label}
            className="
              bg-white
              border border-[#E4E1D8]
              rounded-2xl
              p-4
              card-shadow
            "
          >

            <div
              className={`
                w-10 h-10
                rounded-xl
                ${card.bg}
                ${card.color}
                flex items-center justify-center
                mb-4
              `}
            >

              <i
                data-lucide={card.icon}
                className="w-5 h-5"
              ></i>

            </div>

            <div className="text-[11px] text-[#77736C] mb-1">
              {card.label}
            </div>

            <div className="text-base font-black">
              {card.value}
            </div>

          </div>

        ))}

      </div>


      <div className="
        bg-white
        border border-[#E4E1D8]
        rounded-2xl
        p-4
      ">

        <div className="flex items-center justify-between mb-4">

          <div>

            <div className="text-sm font-black">
              Mağazalar
            </div>

            <div className="text-[11px] text-[#77736C]">
              Aktif mağaza sayısı
            </div>

          </div>

          <div className="
            px-3 py-2

          ">

          </div>

        </div>


        <div className="grid sm:grid-cols-2 gap-2">

          {stores.map(store => (

  data,
  date,
  onSave,
  isAdmin
}) {

  const day = data.purchases[date] || {};

  const locks = data.purchaseLocks[date] || {};

  const [activeStore, setActiveStore] =
    useState(null);

  const [product, setProduct] =
    useState("");

  const [qty, setQty] =
    useState("1");

  const [price, setPrice] =
    useState("");

  const [newStore, setNewStore] =
    useState("");

  const [addingStore, setAddingStore] =
    useState(false);

  const [confirm, setConfirm] =
    useState(false);


  const totalForStore = useCallback(
    store => {

      return (day[store] || [])
        .reduce(
          (sum, item) =>
            sum +
            Number(item.qty || 0) *
            Number(item.unitPrice || 0),
          0
        );

    },
    [day]
  );


  const dayTotal = useMemo(
    () =>
      data.stores.reduce(
        (sum, store) =>
          sum + totalForStore(store),
        0
      ),
    [data.stores, totalForStore]
  );


  async function addItem(e) {

    e.preventDefault();

    if (!activeStore) return;

    const p = product.trim();
    const q = Number(qty);
    const pr = Number(price);

    if (!p || q <= 0 || pr < 0 || isNaN(pr)) {
      return;
    }

    const items = [
      ...(day[activeStore] || [])
    ];

    items.push({
      id: uid(),
      product: p,
      qty: q,
      unitPrice: pr,
      createdAt: Date.now()
    });

    await onSave(
      "purchase",
      date,
      {
        ...day,
        [activeStore]: items
      }
    );

    setProduct("");
    setQty("1");
    setPrice("");
  }


  async function removeItem(id) {

    const items =
      (day[activeStore] || [])
        .filter(item => item.id !== id);

    await onSave(
      "purchase",
      date,
      {
        ...day,
        [activeStore]: items
      }
    );

  }


  async function lockStore() {

    if (!activeStore) return;

    await onSave(
      "purchaseLock",
      date,
      {
        ...locks,
        [activeStore]: true
      }
    );

    setConfirm(false);
  }


  async function unlockStore() {

    await onSave(
      "purchaseLock",
      date,
      {
        ...locks,
        [activeStore]: false
      }
    );

  }


  async function createStore() {

    const name = newStore.trim();

    if (!name) return;

    if (data.stores.includes(name)) return;

    await onSave(
      "stores",
      null,
      [...data.stores, name]
    );

    setNewStore("");
    setAddingStore(false);

  }


  async function deleteStore(name) {

    if (!isAdmin) return;

    const yes = confirmDelete(
      `"${name}" mağazasını silmek istediğine emin misin?`
    );

    if (!yes) return;

    await onSave(
      "stores",
      null,
      data.stores.filter(s => s !== name)
    );

    if (activeStore === name) {
      setActiveStore(null);
    }

  }


  if (activeStore) {

    const items = day[activeStore] || [];

    const locked = !!locks[activeStore];

    return (

      <div className="space-y-4">

        <button
          onClick={() => setActiveStore(null)}
          className="
            flex items-center gap-1
            text-xs font-semibold
            text-[#6B6862]
          "
        >

          <i
            data-lucide="arrow-left"
            className="w-4 h-4"
          ></i>

          Mağazalara Dön

        </button>


        <div className="flex items-center justify-between">

          <div>

            <h2 className="text-xl font-black flex items-center gap-2">

              {activeStore}

              {locked && (

                <span className="
                  text-[10px]
                  px-2 py-1
                  rounded-full
                  bg-[#F1EFE9]
                  text-[#6B6862]
                ">
                  Kilitli
                </span>

              )}

            </h2>

            <p className="text-[11px] text-[#77736C]">
              {formatDateLabel(date)}
            </p>

          </div>


          {isAdmin && (

            <div className="flex gap-2">

              {locked && (

                <button
                  onClick={unlockStore}
                  className="
                    px-3 py-2
                    rounded-xl
                    bg-[#EAF3EE]
                    text-[#1C6B4E]
                    text-[11px]
                    font-bold
                  "
                >
                  Kilidi Aç
                </button>

              )}

              <button
                onClick={() => deleteStore(activeStore)}
                className="
                  w-10 h-10
                  rounded-xl
                  bg-[#F9EDEA]
                  text-[#B4432E]
                  flex items-center justify-center
                "
              >

                <i
                  data-lucide="trash-2"
                  className="w-4 h-4"
                ></i>

              </button>

            </div>

          )}

        </div>


        {(!locked || isAdmin) && (

          <form
            onSubmit={addItem}
            className="
              bg-white
              border border-[#E4E1D8]
              rounded-2xl
              p-4
              card-shadow
            "
          >

            <div className="
              grid
              grid-cols-2
              gap-3
              mb-3
            ">

              <label className="col-span-2">

                <span className="field-label">
                  Ürün
                </span>

                <input
                  value={product}
                  onChange={e => setProduct(e.target.value)}
                  placeholder="Örn. Un"
                  className="field"
                />

              </label>


              <label>

                <span className="field-label">
                  Miktar
                </span>

                <input
                  type="number"
                  min="0"
                  step="0.01"
                  value={qty}
                  onChange={e => setQty(e.target.value)}
                  className="field"
                />

              </label>


              <label>

                <span className="field-label">
                  Birim Fiyat
                </span>

                <input
                  type="number"
                  min="0"
                  step="0.01"
                  value={price}
                  onChange={e => setPrice(e.target.value)}
                  placeholder="0"
                  className="field"
                />

              </label>

            </div>


            <button
              className="
                w-full
                h-11
                rounded-xl
                bg-[#1C1B19]
                text-white
                font-bold
                text-xs
                flex items-center justify-center gap-2
              "
            >

              <i
                data-lucide="plus"
                className="w-4 h-4"
              ></i>

              Ürün Ekle

            </button>

          </form>

        )}


        {locked && !isAdmin && (

          <div className="
            bg-[#F1EFE9]
            border border-[#E4E1D8]
            rounded-2xl
            p-4
            text-xs
            text-[#6B6862]
            flex items-center gap-2
          ">

            <i
              data-lucide="lock"
              className="w-4 h-4"
            ></i>

            Bu kayıt onaylandı ve kilitlendi.

          </div>

        )}


        <div className="space-y-2">

          {items.length === 0 && (

            <div className="
              bg-white
              border border-[#E4E1D8]
              rounded-2xl
              py-10
              text-center
              text-xs
              text-[#77736C]
            ">
              Henüz alış kaydı yok.
            </div>

          )}


          {items.map(item => (

            <div
              key={item.id}
              className="
                bg-white
                border border-[#E4E1D8]
                rounded-2xl
                p-4
                flex items-center
                gap-3
              "
            >

              <div className="
                w-10 h-10
                rounded-xl
                bg-[#F3F1EB]
                flex items-center justify-center
                shrink-0
              ">

                <i
                  data-lucide="package"
                  className="w-4 h-4"
                ></i>

              </div>


              <div className="flex-1 min-w-0">

                <div className="font-bold text-xs truncate">
                  {item.product}
                </div>

                <div className="text-[11px] text-[#77736C] mt-1">
                  {item.qty} × {formatTL(item.unitPrice)}
                </div>

              </div>


              <div className="text-right">

                <div className="text-xs font-black">
                  {formatTL(
                    Number(item.qty) *
                    Number(item.unitPrice)
                  )}
                </div>

                {!locked && (

                  <button
                    onClick={() =>
                      removeItem(item.id)
                    }
                    className="
                      text-[#A8A49A]
                      mt-1
                      p-1
                    "
                  >

                    <i
                      data-lucide="trash-2"
                      className="w-4 h-4"
                    ></i>

                  </button>

                )}

              </div>

            </div>

          ))}

        </div>


        <div
          className="
            bg-[#1C1B19]
            text-white
            rounded-2xl
            p-4
            flex items-center justify-between
          "
        >

          <span className="text-xs text-[#B7B3AA]">
            Mağaza Toplamı
          </span>

          <span className="font-black">
            {formatTL(
              totalForStore(activeStore)
            )}
          </span>

        </div>


        {!locked &&
          !isAdmin &&
          items.length > 0 && (

          <div className="
            bg-[#FFF9EC]
            border border-[#E9DDB8]
            rounded-2xl
            p-4
          ">

            <label className="
              flex gap-3
              text-xs
              text-[#7A6A2E]
            ">

              <input
                type="checkbox"
                checked={confirm}
                onChange={e =>
                  setConfirm(e.target.checked)
                }
              />

              <span>
                Kayıtları kontrol ettim ve onaylıyorum.
                Onaydan sonra değiştirilemeyeceğini biliyorum.
              </span>

            </label>


            <button
              disabled={!confirm}
              onClick={lockStore}
              className={`
                w-full
                h-11
                rounded-xl
                mt-3
                font-bold
                text-xs
                ${
                  confirm
                    ? "bg-[#1C1B19] text-white"
                    : "bg-[#D8D4C8] text-[#99958C]"
                }
              `}
            >

              Kaydet ve Onayla

            </button>

          </div>

        )}

        {refreshIcons()}

      </div>

    );
  }


  return (

    <div className="space-y-4">

      <div className="
        bg-[#1C1B19]
        rounded-2xl
        p-5
        text-white
        flex items-center justify-between
      ">

        <div>

          <div className="text-xs text-[#B7B3AA]">
            Günün Alış Toplamı
          </div>

          <div className="text-xl font-black mt-1">
            {formatTL(dayTotal)}
          </div>

        </div>

        <div className="
          w-11 h-11
          rounded-xl
          bg-[#302E2A]
          flex items-center justify-center
        ">

          <i
            data-lucide="shopping-bag"
            className="w-5 h-5"
          ></i>

        </div>

      </div>


      <div className="grid gap-3">

        {data.stores.map(store => {

          const items = day[store] || [];

          const locked = !!locks[store];

          return (

            <button
              key={store}
              onClick={() => {
                setActiveStore(store);
                setConfirm(false);
              }}
              className="
                bg-white
                border border-[#E4E1D8]
                rounded-2xl
                p-4
                text-left
                flex items-center
                gap-3
                card-shadow
              "
            >

              <div className="
                w-11 h-11
                rounded-xl
                bg-[#EAF3EE]
                text-[#1C6B4E]
                flex items-center justify-center
                shrink-0
              ">

                <i
                  data-lucide="store"
                  className="w-5 h-5"
                ></i>

              </div>


              <div className="flex-1 min-w-0">

                <div className="font-bold text-sm flex items-center gap-2">

                  {store}

                  {locked && (

                    <i
                      data-lucide="lock"
                      className="w-3.5 h-3.5 text-[#A8A49A]"
                    ></i>

                  )}

                </div>

                <div className="text-[11px] text-[#77736C] mt-1">
                  {items.length
                    ? `${items.length} ürün`
                    : "Henüz ürün yok"}
                </div>

              </div>


              <div className="text-right">

                <div className="font-black text-xs">
                  {formatTL(
                    totalForStore(store)
                  )}
                </div>

                <i
                  data-lucide="chevron-right"
                  className="w-4 h-4 text-[#AAA69E] ml-auto mt-1"
                ></i>

              </div>

            </button>

          );

        })}

      </div>


      {isAdmin && (

        <>

          {!addingStore ? (

            <button
              onClick={() => setAddingStore(true)}
              className="
                w-full
                h-12
                rounded-xl
                border border-dashed
                border-[#CFCBC2]
                bg-transparent
                text-xs
                font-bold
                text-[#6B6862]
                flex items-center justify-center gap-2
              "
            >

              <i
                data-lucide="plus"
                className="w-4 h-4"
              ></i>

              Yeni Mağaza Ekle

            </button>

          ) : (

            <div className="
              bg-white
              border border-[#E4E1D8]
              rounded-2xl
              p-3
              flex gap-2
            ">

              <input
                autoFocus
                value={newStore}
                onChange={e =>
                  setNewStore(e.target.value)
                }
                placeholder="Mağaza adı"
                className="field flex-1"
              />

              <button
                onClick={createStore}
                className="
                  px-4
                  rounded-xl
                  bg-[#1C1B19]
                  text-white
                  text-xs
                  font-bold
                "
              >
                Ekle
              </button>

              <button
                onClick={() => setAddingStore(false)}
                className="
                  w-11
                  rounded-xl
                  border border-[#E4E1D8]
                "
              >

                <i
                  data-lucide="x"
                  className="w-4 h-4 mx-auto"
                ></i>

              </button>

            </div>

          )}

        </>

      )}

      {refreshIcons()}

    </div>

  );
}


/* =========================================================
   SATIŞ
========================================================= */

function SatisTab({
  data,
  date,
  onSave,
  isAdmin
}) {

  const day = data.sales[date] || {};

  const locked = !!data.salesLocks[date];

  const [confirm, setConfirm] =
    useState(false);


  const grandTotal = useMemo(() => {

    return SALE_PRODUCTS.reduce(
      (sum, product) => {

        const r = day[product] || {};

        return sum +
          (Number(r.qty) || 0) *
          (Number(r.unitPrice) || 0);

      },
      0
    );

  }, [day]);


  const hasEntries = SALE_PRODUCTS.some(
    p =>
      Number(day[p]?.qty || 0) > 0
  );


  async function updateProduct(
    product,
    field,
    value
  ) {

    const current =
      day[product] || {
        qty: "",
        unitPrice: ""
      };

    await onSave(
      "sales",
      date,
      {
        ...day,
        [product]: {
          ...current,
          [field]: value
        }
      }
    );

  }


  async function lockSales() {

    await onSave(
      "salesLock",
      date,
      true
    );

    setConfirm(false);

  }


  return (

    <div className="space-y-4">

      <div
        className="
          bg-[#1C1B19]
          text-white
          rounded-2xl
          p-5
          flex items-center justify-between
        "
      >

        <div>

          <div className="text-xs text-[#B7B3AA]">
            Günün Satış Toplamı
          </div>

          <div className="text-xl font-black mt-1">
            {formatTL(grandTotal)}
          </div>

        </div>

        <div className="
          w-11 h-11
          rounded-xl
          bg-[#302E2A]
          flex items-center justify-center
        ">

          <i
            data-lucide="trending-up"
            className="w-5 h-5"
          ></i>

        </div>

      </div>


      {locked && (

        <div className="
          rounded-2xl
          bg-[#F1EFE9]
          border border-[#E4E1D8]
          p-4
          text-xs
          text-[#6B6862]
          flex items-center justify-between
        ">

          <div className="flex items-center gap-2">

            <i
              data-lucide="lock"
              className="w-4 h-4"
            ></i>

            Bu günün satışları kilitlendi.

          </div>

          {isAdmin && (

            <button
              onClick={() =>
                onSave(
                  "salesLock",
                  date,
                  false
                )
              }
              className="
                text-[#1C6B4E]
                font-bold
              "
            >
              Kilidi Aç
            </button>

          )}

        </div>

      )}


      <div className="space-y-2">

        {SALE_PRODUCTS.map(
          (product, index) => {

            const r =
              day[product] || {
                qty: "",
                unitPrice: ""
              };

            const qty =
              Number(r.qty) || 0;

            const price =
              Number(r.unitPrice) || 0;

            const total =
              qty * price;

            return (

              <div
                key={product}
                className="
                  bg-white
                  border border-[#E4E1D8]
                  rounded-2xl
                  p-3
                  card-shadow
                "
              >

                <div className="
                  flex
                  items-center
                  justify-between
                  mb-3
                ">

                  <div className="
                    flex
                    items-center
                    gap-2
                    min-w-0
                  ">

                    <div className="
                      w-8 h-8
                      rounded-lg
                      bg-[#F3F1EB]
                      flex items-center justify-center
                      text-[10px]
                      font-black
                      shrink-0
                    ">
                      {index + 1}
                    </div>

                    <div className="
                      text-xs
                      font-bold
                      truncate
                    ">
                      {product}
                    </div>

                  </div>


                  <div className="
                    text-xs
                    font-black
                    ml-2
                  ">
                    {formatTL(total)}
                  </div>

                </div>


                <div className="
                  grid
                  grid-cols-2
                  gap-2
                ">

                  <label>

                    <span className="field-label">
                      Adet
                    </span>

                    <input
                      type="number"
                      min="0"
                      inputMode="decimal"
                      placeholder="0"
                      disabled={locked && !isAdmin}
                      value={r.qty ?? ""}
                      onChange={e =>
                        updateProduct(
                          product,
                          "qty",
                          e.target.value
                        )
                      }
                      className="field text-right"
                    />

                  </label>


                  <label>

                    <span className="field-label">
                      Birim Fiyat
                    </span>

                    <input
                      type="number"
                      min="0"
                      step="0.01"
                      inputMode="decimal"
                      placeholder="0"
                      disabled={locked && !isAdmin}
                      value={r.unitPrice ?? ""}
                      onChange={e =>
                        updateProduct(
                          product,
                          "unitPrice",
                          e.target.value
                        )
                      }
                      className="field text-right"
                    />

                  </label>

                </div>

              </div>

            );

          }
        )}

      </div>


      {!locked &&
        !isAdmin &&
        hasEntries && (

        <div className="
          bg-[#FFF9EC]
          border border-[#E9DDB8]
          rounded-2xl
          p-4
        ">

          <label className="
            flex gap-3
            text-xs
            text-[#7A6A2E]
          ">

            <input
              type="checkbox"
              checked={confirm}
              onChange={e =>
                setConfirm(e.target.checked)
              }
            />

            <span>
              Satış kayıtlarını kontrol ettim ve
              onaylıyorum.
            </span>

          </label>


          <button
            disabled={!confirm}
            onClick={lockSales}
            className={`
              w-full
              h-11
              mt-3
              rounded-xl
              text-xs
              font-bold
              ${
                confirm
                  ? "bg-[#1C1B19] text-white"
                  : "bg-[#D8D4C8] text-[#99958C]"
              }
            `}
          >
            Kaydet ve Onayla
          </button>

        </div>

      )}

      {refreshIcons()}

    </div>
  );
}


/* =========================================================
   MALİYETLER

  onCostChange
}) {

    <div className="space-y-4">

      <div>

        <h2 className="text-xl font-black">
          Maliyetler

          Pizza bazında maliyet, satış fiyatı ve kâr marjını yönet.
        </p>

      </div>


      <div className="space-y-2">

        {SALE_PRODUCTS.map(product => {

          const c =
            costs[product] || {
              cost: "",

          const cost =
            Number(c.cost) || 0;

          const price =

            price - cost;

                bg-white
                border border-[#E4E1D8]
                rounded-2xl
                p-4

                text-xs
                mb-3

                {product}

              <div className="
                grid
                grid-cols-2
                gap-2
              ">

                <label>

                  <span className="field-label">
                    Maliyet
                  </span>

                  <input
                    type="number"
                    min="0"
                    step="0.01"
                    value={c.cost ?? ""}
                    onChange={e =>
                      onCostChange(
                        product,
                        "cost",
                        e.target.value
                      )
                    }
                    className="field"
                  />

                </label>


                <label>

                  <span className="field-label">
                    Satış
                  </span>

                  <input
                    type="number"
                    min="0"
                    step="0.01"
                    value={c.price ?? ""}
                    onChange={e =>
                      onCostChange(
                        product,
                        "price",
                        e.target.value
                      )
                    }
                    className="field"
                  />

                </label>

              </div>


              <div className="
                mt-3
                pt-3
                border-t border-[#EFEDE6]
                flex items-center
                justify-between
              ">

                <div>

                  <div className="text-[10px] text-[#77736C]">
                    Ürün Kârı
                  </div>

                  <div className="
                    text-sm
                    font-black
                    text-[#1C6B4E]
                  ">
                    {formatTL(profit)}
                  </div>

                </div>


                <div className="
                  text-right
                ">

                  <div className="text-[10px] text-[#77736C]">
                    Marj
                  </div>

                  <div className="
                    text-sm
                    font-black
                    text-[#1C6B4E]
                  ">
                    {margin.toFixed(1)}%
                  </div>

                </div>

              </div>

            </div>

          );

        })}

      </div>

      {refreshIcons()}

    </div>
  );
}


/* =========================================================
   KAR ZARAR
========================================================= */

function KarZararTab({
  purchases,
  sales
}) {

  const [month, setMonth] =
    useState(thisMonthISO());


  const stats = useMemo(() => {

    let purchaseTotal = 0;

    Object.entries(purchases)
      .filter(([d]) =>
        d.startsWith(month)
      )
      .forEach(([, day]) => {

        Object.values(day || {})
          .flat()
          .forEach(item => {

            purchaseTotal +=
              Number(item.qty || 0) *
              Number(item.unitPrice || 0);

          });

      });


    let salesTotal = 0;

    Object.entries(sales)
      .filter(([d]) =>
        d.startsWith(month)
      )
      .forEach(([, day]) => {

        Object.values(day || {})
          .forEach(row => {

            salesTotal +=
              (Number(row.qty) || 0) *
              (Number(row.unitPrice) || 0);

          });

      });


    return {
      purchaseTotal,
      salesTotal,
      net: salesTotal - purchaseTotal
    };

  }, [purchases, sales, month]);


  return (

    <div className="space-y-4">

      <div>

        <h2 className="text-xl font-black">
          Kâr / Zarar
        </h2>

        <p className="text-xs text-[#77736C] mt-1">
          Aylık gelir ve alış hareketlerini takip et.
        </p>

      </div>


      <div className="
        bg-white
        border border-[#E4E1D8]
        rounded-2xl
        p-3
        flex items-center gap-3
      ">

        <div className="
          w-10 h-10
          rounded-xl
          bg-[#F3F1EB]
          flex items-center justify-center
        ">

          <i
            data-lucide="calendar"
            className="w-4 h-4"
          ></i>

        </div>

        <input
          type="month"
          value={month}
          onChange={e =>
            setMonth(e.target.value)
          }
          className="
            flex-1
            border-none
            outline-none
            bg-transparent
            text-sm
            font-bold
          "
        />

      </div>


      <div className="
        grid
        grid-cols-2
        gap-3
      ">

        <StatCard
          title="Toplam Satış"
          value={formatTL(stats.salesTotal)}
          icon="trending-up"
          positive
        />

        <StatCard
          title="Toplam Alış"
          value={formatTL(stats.purchaseTotal)}
          icon="shopping-bag"
        />

      </div>


      <div className="
        bg-[#1C1B19]
        rounded-2xl
        p-5
        text-white
      ">

        <div className="
          text-xs
          text-[#B7B3AA]
          mb-2
        ">
          Net Kâr / Nakit Akışı
        </div>

        <div className="text-2xl font-black">
          {formatTL(stats.net)}
        </div>

        <div className="
          text-[10px]
          text-[#817D75]
          mt-2
        ">
          Satışlar − alışlar
        </div>

      </div>

      {refreshIcons()}

    </div>
  );
}


function StatCard({

  value,
  icon,
  positive
}) {

  return (

    <div className="
      bg-white
      border border-[#E4E1D8]
      rounded-2xl
      p-4
    ">

      <div className="
        w-9 h-9
        rounded-xl
        bg-[#F3F1EB]
        flex items-center justify-center
        mb-3
      ">

        <i
          data-lucide={icon}
          className="w-4 h-4"
        ></i>

      </div>

      <div className="
        text-[10px]
        text-[#77736C]
      ">
        {title}
      </div>

      <div className={`
        text-sm
        font-black
        mt-1
        ${positive ? "text-[#1C6B4E]" : "text-[#B4432E]"}
      `}>
        {value}
      </div>

    </div>

  );
}


/* =========================================================
   YÖNETİCİ
========================================================= */

function YoneticiTab({
  users,
  onCreateUser,
  onDeleteUser
}) {

  const [username, setUsername] =
    useState("");

  const [password, setPassword] =
    useState("");

  const [busy, setBusy] =
    useState(false);


  async function submit(e) {

    e.preventDefault();

    const u = username.trim();
    const p = password.trim();

    if (!u || !p) return;

    setBusy(true);

    try {

      await onCreateUser(
        u,
        p
      );

      setUsername("");
      setPassword("");

    } finally {

      setBusy(false);

    }

  }


  return (

    <div className="space-y-4">

      <div>

        <h2 className="text-xl font-black">
          Yönetici
        </h2>

        <p className="text-xs text-[#77736C] mt-1">
          Kullanıcıları ve erişimleri yönet.
        </p>

      </div>


      <form
        onSubmit={submit}
        className="
          bg-white
          border border-[#E4E1D8]
          rounded-2xl
          p-4
        "
      >

        <div className="
          flex items-center
          gap-2
          mb-4
        ">

          <div className="
            w-9 h-9
            rounded-xl
            bg-[#F3F1EB]
            flex items-center justify-center
          ">

            <i
              data-lucide="user-plus"
              className="w-4 h-4"
            ></i>

          </div>

          <div className="text-sm font-black">
            Yeni Kullanıcı
          </div>

        </div>


        <div className="
          grid
          grid-cols-1
          sm:grid-cols-2
          gap-3
        ">

          <label>

            <span className="field-label">
              Kullanıcı Adı
            </span>

            <input
              autoCapitalize="none"
              value={username}
              onChange={e =>
                setUsername(e.target.value)
              }
              className="field"
            />

          </label>


          <label>

            <span className="field-label">
              Şifre
            </span>

            <input
              type="password"
              value={password}
              onChange={e =>
                setPassword(e.target.value)
              }
              className="field"
            />

          </label>

        </div>


        <button
          disabled={busy}
          className="
            w-full
            h-11
            rounded-xl
            bg-[#1C1B19]
            text-white
            font-bold
            text-xs
            mt-3
            disabled:opacity-50
          "
        >
          {busy
            ? "Oluşturuluyor..."
            : "Kullanıcı Oluştur"}
        </button>

      </form>


      <div className="space-y-2">

        {Object.entries(users || {}).map(
          ([name, user]) => (

            <div
              key={name}
              className="
                bg-white
                border border-[#E4E1D8]
                rounded-2xl
                p-4
                flex items-center
                gap-3
              "
            >

              <div className="
                w-10 h-10
                rounded-full
                bg-[#F3F1EB]
                flex items-center justify-center
                font-black
                text-xs
              ">
                {name
                  .substring(0, 1)
                  .toUpperCase()}
              </div>


              <div className="flex-1">

                <div className="text-xs font-black">
                  {name}
                </div>

                <div className="
                  text-[10px]
                  text-[#77736C]
                  mt-1
                ">
                  {user.role === "admin"
                    ? "Yönetici"
                    : "Kullanıcı"}
                </div>

              </div>


              {user.role !== "admin" && (

                <button
                  onClick={() =>
                    onDeleteUser(name)
                  }
                  className="
                    w-10 h-10
                    rounded-xl
                    bg-[#F9EDEA]
                    text-[#B4432E]
                    flex items-center justify-center
                  "
                >

                  <i
                    data-lucide="trash-2"
                    className="w-4 h-4"
                  ></i>

                </button>

              )}

            </div>

          )
        )}

      </div>

      {refreshIcons()}

    </div>
  );
}

   DELETE CONFIRM
========================================================= */

function confirmDelete(message) {
  return window.confirm(message);
}


/* =========================================================
   ANA UYGULAMA
========================================================= */

function ManoPizza() {

  const [loading, setLoading] =
    useState(true);

  const [firebaseError, setFirebaseError] =
    useState("");

  const [users, setUsers] =
    useState({});

  const [stores, setStores] =
    useState(DEFAULT_STORES);

  const [purchases, setPurchases] =
    useState({});

  const [purchaseLocks, setPurchaseLocks] =
    useState({});

  const [sales, setSales] =
    useState({});

  const [salesLocks, setSalesLocks] =
    useState({});

  const [costs, setCosts] =
    useState({});

  const [currentUser, setCurrentUser] =
    useState(null);

  const [sidebarOpen, setSidebarOpen] =
    useState(false);

  const [tab, setTab] =
    useState("dashboard");

  const [date, setDate] =
    useState(todayISO());

  const [toast, setToast] =
    useState("");

  const [toastType, setToastType] =
    useState("success");


  /* =======================================================
     FIREBASE LISTENERS
  ======================================================= */

  useEffect(() => {

    let loaded = 0;

    function done() {

      loaded++;

      if (loaded >= 5) {
        setLoading(false);
      }

    }


    const unsubSettings =
      SETTINGS_REF.onSnapshot(
        snap => {

          if (snap.exists) {

            const d = snap.data();

            setStores(
              Array.isArray(d.stores)
                ? d.stores
                : DEFAULT_STORES
            );

          } else {

            SETTINGS_REF.set(
              {
                stores: DEFAULT_STORES
              },
              { merge: true }
            );

            setStores(DEFAULT_STORES);

          }

          done();

        },
        err => {

          console.error(err);

          setFirebaseError(
            "Firebase bağlantısı kurulamadı."
          );

          done();

        }
      );


    const unsubUsers =
      USERS_REF.onSnapshot(
        snap => {

          if (snap.exists()) {

            setUsers(
              snap.data() || {}
            );

          } else {

            USERS_REF.set(
              {
                [ADMIN_USERNAME]: {
                  password: ADMIN_PASSWORD,
                  role: "admin"
                }
              },
              { merge: true }
            );

          }

          done();

        },
        err => {

          console.error(err);

          setFirebaseError(
            "Kullanıcı verileri alınamadı."
          );

          done();

        }
      );


    const unsubCosts =
      COSTS_REF.onSnapshot(
        snap => {

          setCosts(
            snap.exists()
              ? snap.data() || {}
              : {}
          );

          done();

        },
        err => {

          console.error(err);

          done();

        }
      );


    const unsubPurchases =
      PURCHASES_COLLECTION.onSnapshot(
        snap => {

          const result = {};

          snap.forEach(doc => {

            result[doc.id] =
              doc.data() || {};

          });

          setPurchases(result);

          const lockResult = {};

          snap.forEach(doc => {

            const d = doc.data() || {};

            lockResult[doc.id] =
              d.__locks || {};

          });

          setPurchaseLocks(lockResult);

          done();

        },
        err => {

          console.error(err);

          setFirebaseError(
            "Alış verileri alınamadı."
          );

          done();

        }
      );


    const unsubSales =
      SALES_COLLECTION.onSnapshot(
        snap => {

          const result = {};

          snap.forEach(doc => {

            const d = doc.data() || {};

            const {
              __locked,
              ...rows
            } = d;

            result[doc.id] = rows;

          });

          setSales(result);

          const lockResult = {};

          snap.forEach(doc => {

            lockResult[doc.id] =
              !!doc.data()?.__locked;

          });

          setSalesLocks(lockResult);

          done();

        },
        err => {

          console.error(err);

          setFirebaseError(
            "Satış verileri alınamadı."
          );

          done();

        }
      );


    return () => {

      unsubSettings();
      unsubUsers();
      unsubCosts();
      unsubPurchases();
      unsubSales();

    };

  }, []);


  /* =======================================================
     TOAST
  ======================================================= */

  function showToast(
    message,
    type = "success"
  ) {

    setToast(message);
    setToastType(type);

    setTimeout(() => {
      setToast("");
    }, 2200);

  }


  /* =======================================================
     VERİ KAYDET
  ======================================================= */

  async function save(
    type,
    id,
    value
  ) {

    try {

      /*
       Her veri kendi dokümanında.
       Başka verileri ezmez.
      */

      if (type === "purchase") {

        await PURCHASES_COLLECTION
          .doc(id)
          .set(
            {
              ...value,
              __locks:
                purchaseLocks[id] || {}
            },
            { merge: true }
          );

      }


      else if (type === "purchaseLock") {

        await PURCHASES_COLLECTION
          .doc(id)
          .set(
            {
              __locks: value
            },
            { merge: true }
          );

      }


      else if (type === "sales") {

        await SALES_COLLECTION
          .doc(id)
          .set(
            {
              ...value,
              __locked:
                !!salesLocks[id]
            },
            { merge: true }
          );

      }


      else if (type === "salesLock") {

        await SALES_COLLECTION
          .doc(id)
          .set(
            {
              __locked: !!value
            },
            { merge: true }
          );

      }


      else if (type === "stores") {

        await SETTINGS_REF.set(
          {
            stores: value
          },
          { merge: true }
        );

      }


      showToast(
        "Kaydedildi"
      );

    } catch (err) {

      console.error(err);

      showToast(
        "Kaydedilemedi. Firebase bağlantısını kontrol et.",
        "error"
      );

    }

  }


  /* =======================================================
     MALİYET
  ======================================================= */

  async function updateCost(
    product,
    field,
    value
  ) {

    try {

      await COSTS_REF.set(
        {
          [product]: {
            ...(costs[product] || {}),
            [field]: value
          }
        },
        { merge: true }
      );

      showToast("Maliyet kaydedildi");

    } catch (err) {

      console.error(err);

      showToast(
        "Maliyet kaydedilemedi.",
        "error"
      );

    }

  }


  /* =======================================================
     USER CREATE
  ======================================================= */

  async function createUser(
    username,
    password
  ) {

    if (
      username === ADMIN_USERNAME
    ) {

      showToast(
        "Bu kullanıcı adı yöneticiye ait.",
        "error"
      );

      return;

    }


    try {

      await db.runTransaction(
        async transaction => {

          const snap =
            await transaction.get(
              USERS_REF
            );

          const existing =
            snap.exists
              ? snap.data() || {}
              : {};

          if (existing[username]) {

            throw new Error(
              "USER_EXISTS"
            );

          }

          existing[username] = {
            password,
            role: "user",
            createdAt: Date.now()
          };

          transaction.set(
            USERS_REF,
            existing,
            { merge: true }
          );

        }
      );

      showToast(
        "Kullanıcı başarıyla oluşturuldu."
      );

    } catch (err) {

      console.error(err);

      if (
        err.message === "USER_EXISTS"
      ) {

        showToast(
          "Bu kullanıcı zaten mevcut.",
          "error"
        );

      } else {

        showToast(
          "Kullanıcı kaydedilemedi.",
          "error"
        );

      }

    }

  }


  /* =======================================================
     USER DELETE
  ======================================================= */

  async function deleteUser(username) {

    if (!isAdmin()) return;

    if (
      !confirmDelete(
        `${username} kullanıcısı silinsin mi?`
      )
    ) {
      return;
    }


    try {

      await db.runTransaction(
        async transaction => {

          const snap =
            await transaction.get(
              USERS_REF
            );

          const existing =
            snap.exists
              ? snap.data() || {}
              : {};

          delete existing[username];

          transaction.set(
            USERS_REF,
            existing
          );

        }
      );

      showToast(
        "Kullanıcı silindi."
      );

    } catch (err) {

      console.error(err);

      showToast(
        "Kullanıcı silinemedi.",
        "error"
      );

    }

  }


  function isAdmin() {

    return (
      currentUser?.role === "admin"
    );

  }


  /* =======================================================
     LOADING
  ======================================================= */

  if (loading) {

    return (

      <div className="
        min-h-screen
        bg-[#1C1B19]
        flex
        items-center
        justify-center
      ">

        <div className="text-center">

          <div className="
            w-14 h-14
            rounded-2xl
            bg-[#B4432E]
            text-white
            flex items-center justify-center
            mx-auto mb-4
          ">

            <i
              data-lucide="pizza"
              className="w-7 h-7"
            ></i>

          </div>

          <div className="
            text-white
            text-sm
            font-bold
          ">
            Mano Pizza
          </div>

          <div className="
            text-[#77736C]
            text-xs
            mt-1
          ">
            Veriler yükleniyor...
          </div>

        </div>

        {refreshIcons()}

      </div>

    );

  }


  /* =======================================================
     LOGIN
  ======================================================= */

  if (!currentUser) {

    return (

      <LoginScreen
        users={users}
        onSuccess={setCurrentUser}
      />

    );

  }


  /* =======================================================
     TAB BAŞLIKLARI
  ======================================================= */

  const titles = {

    dashboard: [
      "Genel Bakış",
      "Mano Pizza işletme özeti"
    ],

    alis: [
      "Alışlar",
      "Günlük tedarik ve alış kayıtları"
    ],

    satis: [
      "Satışlar",
      "Günlük pizza satışlarını gir"
    ],

    maliyet: [
      "Maliyetler",
      "Ürün maliyet ve satış fiyatları"
    ],

    karzarar: [
      "Kâr / Zarar",
      "Aylık finansal görünüm"
    ],

    yonetici: [
      "Yönetici",
      "Kullanıcı ve mağaza yönetimi"
    ]

  };


  /*
    Normal kullanıcı dashboard,
    maliyet vb. göremez.
  */

  const allowedTabs =
    isAdmin()
      ? [
          "dashboard",
          "alis",
          "satis",
          "maliyet",
          "karzarar",
          "yonetici"
        ]
      : [
          "alis",
          "satis"
        ];


  if (!allowedTabs.includes(tab)) {
    setTab(
      isAdmin()
        ? "dashboard"
        : "alis"
    );
  }


  return (

    <div className="min-h-screen bg-[#F7F6F2]">

      <Sidebar
        open={sidebarOpen}
        setOpen={setSidebarOpen}
        tab={tab}
        setTab={setTab}
        isAdmin={isAdmin()}
        currentUser={currentUser}
      />


      <div className="md:ml-[270px] min-h-screen">

        <Topbar
          title={titles[tab]?.[0]}
          subtitle={titles[tab]?.[1]}
          onMenu={() =>
            setSidebarOpen(true)
          }
          onLogout={() =>
            setCurrentUser(null)
          }
          isAdmin={isAdmin()}
        />


        <main className="
          desktop-content
          mx-auto
          px-4
          md:px-8
          py-5
          pb-12
        ">


          {(tab === "alis" ||
            tab === "satis") && (

            <div className="mb-4">

              <DatePicker
                date={date}
                setDate={setDate}
              />

            </div>

          )}


          {tab === "dashboard" && isAdmin() && (

            <Dashboard
              purchases={purchases}
              sales={sales}
              stores={stores}
              costs={costs}
            />

          )}


          {tab === "alis" && (

            <AlisTab
              data={{
                stores,
                purchases,
                purchaseLocks
              }}
              date={date}
              onSave={save}
              isAdmin={isAdmin()}
            />

          )}


          {tab === "satis" && (

            <SatisTab
              data={{
                sales,
                salesLocks
              }}
              date={date}
              onSave={save}
              isAdmin={isAdmin()}
            />

          )}


          {tab === "maliyet" &&
            isAdmin() && (

            <MaliyetlerTab
              costs={costs}
              onCostChange={updateCost}
            />

          )}


          {tab === "karzarar" &&
            isAdmin() && (

            <KarZararTab
              purchases={purchases}
              sales={sales}
            />

          )}


          {tab === "yonetici" &&
            isAdmin() && (

            <YoneticiTab
              users={users}
              onCreateUser={createUser}
              onDeleteUser={deleteUser}
            />

          )}

        </main>

      </div>


      {firebaseError && (

        <div className="
          fixed
          left-1/2
          -translate-x-1/2
          bottom-5
          z-[100]
          max-w-[90%]
          bg-[#B4432E]
          text-white
          rounded-2xl
          px-4 py-3
          text-xs
          font-semibold
          shadow-xl
        ">

          {firebaseError}

        </div>

      )}


      <Toast
        message={toast}
        type={toastType}
      />

    </div>

  );

}


/* =========================================================
   BAŞLAT
========================================================= */

ReactDOM.createRoot(
  document.getElementById("root")
).render(
  <ManoPizza />
);

</script>

<script>
const {
  useState,
  useEffect,
  useMemo,
  useRef
} = React;

/* ==========================================================
   SABİTLER
========================================================== */

const DOC_PATH = ["mano_pizza", "veri"];

const ADMIN_USERNAME = "mathrew";
const ADMIN_PASSWORD = "01102022";

const DEFAULT_STORES = [
  "Metro Market",
  "File Market"
];

const SALE_PRODUCTS = [
  "Margarita Pizza",
  ...Array.from(
    { length: 20 },
    (_, i) => `Pizza No:${i + 1}`
  )
];

const EMPTY_DATA = {
  stores: DEFAULT_STORES,
  purchaseEntries: {},
  purchaseLocks: {},
  salesEntries: {},
  salesLocks: {},
  costs: {},
  users: {
    [ADMIN_USERNAME]: {
      password: ADMIN_PASSWORD,
      role: "admin"
    }
  }
};

/* ==========================================================
   YARDIMCI FONKSİYONLAR
========================================================== */

function todayISO() {
  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");

  return `${y}-${m}-${day}`;
}

function monthISO() {
  return todayISO().slice(0, 7);
}

function formatTL(value) {
  return new Intl.NumberFormat("tr-TR", {
    style: "currency",
    currency: "TRY",
    maximumFractionDigits: 2
  }).format(Number(value) || 0);
}

function formatDate(iso) {
  if (!iso) return "";

  return new Date(
    iso + "T00:00:00"
  ).toLocaleDateString("tr-TR", {
    day: "numeric",
    month: "long",
    year: "numeric",
    weekday: "long"
  });
}

function formatMonth(iso) {
  if (!iso) return "";

  return new Date(
    iso + "-01T00:00:00"
  ).toLocaleDateString("tr-TR", {
    month: "long",
    year: "numeric"
  });
}

function cleanData(raw) {

  const source = raw || {};

  return {
    ...EMPTY_DATA,
    ...source,

    stores:
      Array.isArray(source.stores) && source.stores.length
        ? source.stores
        : DEFAULT_STORES,

    purchaseEntries:
      source.purchaseEntries || {},

    purchaseLocks:
      source.purchaseLocks || {},

    salesEntries:
      source.salesEntries || {},

    salesLocks:
      source.salesLocks || {},

    costs:
      source.costs || {},

    users: {
      ...EMPTY_DATA.users,
      ...(source.users || {})
    }
  };
}

/* ==========================================================
   FIREBASE READY
========================================================== */

function waitForFirebase() {

  return new Promise(resolve => {

    if (window.MANO_FIREBASE) {
      resolve();
      return;
    }

    window.addEventListener(
      "firebase-ready",
      resolve,
      { once: true }
    );
  });
}

/* ==========================================================
   FIREBASE DATA HOOK
========================================================== */

function useManoData() {

  const [data, setData] = useState(EMPTY_DATA);
  const [ready, setReady] = useState(false);
  const [saveState, setSaveState] = useState("idle");

  const latestData = useRef(EMPTY_DATA);

  useEffect(() => {

    let unsubscribe = null;
    let alive = true;

    async function start() {

      try {

        await waitForFirebase();

        if (!alive) return;

        const {
          db,
          doc,
          getDoc,
          onSnapshot
        } = window.MANO_FIREBASE;

        const ref = doc(
          db,
          DOC_PATH[0],
          DOC_PATH[1]
        );

        /*
          İlk açılış:
          Doküman yoksa oluştur.
        */

        const first = await getDoc(ref);

        if (!first.exists()) {

          await window.MANO_FIREBASE.setDoc(
            ref,
            EMPTY_DATA,
            { merge: false }
          );

          if (alive) {
            setData(EMPTY_DATA);
            latestData.current = EMPTY_DATA;
          }

        } else {

          const normalized =
            cleanData(first.data());

          if (alive) {
            setData(normalized);
            latestData.current = normalized;
          }
        }

        /*
          ANLIK SENKRONİZASYON
        */

        unsubscribe = onSnapshot(
          ref,
          snapshot => {

            if (!snapshot.exists()) return;

            const normalized =
              cleanData(snapshot.data());

            latestData.current = normalized;

            setData(normalized);

            setSaveState("saved");
          },
          error => {

            console.error(
              "Firestore snapshot error:",
              error
            );

            setSaveState("error");
          }
        );

        if (alive) {
          setReady(true);
        }

      } catch (error) {

        console.error(
          "Firebase başlatma hatası:",
          error
        );

        if (alive) {
          setReady(true);
          setSaveState("error");
        }
      }
    }

    start();

    return () => {

      alive = false;

      if (unsubscribe) {
        unsubscribe();
      }
    };

  }, []);

  /*
    KRİTİK KISIM:

    Her değişiklik Firestore'daki EN SON dokümanı
    transaction ile okur.

    Böylece iki farklı telefon aynı anda işlem yaptığında
    eski React state'i kullanıp yeni veriyi ezme ihtimali
    ciddi şekilde azaltılır.
  */

  async function updateData(mutator) {

    setSaveState("saving");

    try {

      await waitForFirebase();

      const {
        db,
        doc,
        runTransaction
      } = window.MANO_FIREBASE;

      const ref = doc(
        db,
        DOC_PATH[0],
        DOC_PATH[1]
      );

      await runTransaction(
        db,
        async transaction => {

          const snapshot =
            await transaction.get(ref);

          const current =
            cleanData(
              snapshot.exists()
                ? snapshot.data()
                : EMPTY_DATA
            );

          const next =
            cleanData(
              mutator(current)
            );

          transaction.set(
            ref,
            next,
            { merge: false }
          );

          latestData.current = next;
        }
      );

      setSaveState("saved");

    } catch (error) {

      console.error(
        "Kayıt hatası:",
        error
      );

      setSaveState("error");
    }
  }

  return {
    data,
    ready,
    saveState,
    updateData
  };
}

function Login({ users, onLogin }) {

  const [username, setUsername] =
    useState("");

  const [password, setPassword] =
    useState("");

  const [error, setError] =
    useState("");

  function submit(e) {

    e.preventDefault();

    const name =
      username.trim();

    const found =
      users[name];

    if (
      found &&
      found.password === password
    ) {

      onLogin({
        username:name,
        role:found.role
      });

      setError("");

    } else {

      setError(
        "Kullanıcı adı veya şifre hatalı."

      setPassword("");

  return (
    <div className="login-screen">

function Alis({
  data,
  updateData,
  isAdmin
}) {

  const [date, setDate] =
    useState(todayISO());

  const [activeStore, setActiveStore] =
    useState(null);

  const [product, setProduct] =
    useState("");

  const [qty, setQty] =
    useState("1");

  const [price, setPrice] =
    useState("");

  const [newStore, setNewStore] =
    useState("");

  const [confirm, setConfirm] =
    useState(false);

  const entries =
    data.purchaseEntries[date] || {};

  const locks =
    data.purchaseLocks[date] || {};

  function storeTotal(store) {

    return (
      entries[store] || []
    ).reduce(
      (sum, item) =>
        sum +
        Number(item.qty || 0) *
        Number(item.unitPrice || 0),
      0
    );
  }

  const total =
    data.stores.reduce(
      (sum, store) =>
        sum + storeTotal(store),
      0
    );

  function addItem(e) {

    e.preventDefault();

    const p =
      product.trim();

    const q =
      Number(qty);

    const pr =
      Number(price);

    if (
      !activeStore ||
      !p ||
      !q ||
      q <= 0 ||
      isNaN(pr) ||
      pr < 0
    ) return;

    updateData(current => {

      const day =
        current.purchaseEntries[date] || {};

      const storeItems =
        day[activeStore] || [];

      return {
        ...current,

        purchaseEntries: {
          ...current.purchaseEntries,

          [date]: {
            ...day,

            [activeStore]: [
              ...storeItems,

              {
                id:
                  Date.now() +
                  "-" +
                  Math.random()
                    .toString(36)
                    .slice(2),

                product:p,
                qty:q,
                unitPrice:pr
              }
            ]
          }
        }
      };
    });

    setProduct("");
    setQty("1");
    setPrice("");
  }

  function removeItem(id) {

    updateData(current => {

      const day =
        current.purchaseEntries[date] || {};

      const items =
        day[activeStore] || [];

      return {
        ...current,

        purchaseEntries: {
          ...current.purchaseEntries,

          [date]: {
            ...day,

            [activeStore]:
              items.filter(
                x => x.id !== id
              )
          }
        }
      };
    });
  }

  function lockStore() {

    if (!confirm) return;

    updateData(current => {

      const locks =
        current.purchaseLocks[date] || {};

      return {
        ...current,

        purchaseLocks: {
          ...current.purchaseLocks,

          [date]: {
            ...locks,
            [activeStore]:true
          }
        }
      };
    });

    setConfirm(false);
  }

  function unlockStore() {

    updateData(current => {

      const locks =
        current.purchaseLocks[date] || {};

      return {
        ...current,

        purchaseLocks: {
          ...current.purchaseLocks,

          [date]: {
            ...locks,
            [activeStore]:false
          }
        }
      };
    });
  }

  function addStore() {

    const name =
      newStore.trim();

    if (
      !name ||
      data.stores.includes(name)
    ) return;

    updateData(current => ({
      ...current,
      stores:[
        ...current.stores,
        name
      ]
    }));

    setNewStore("");
  }

  function deleteStore(name) {

    if (
      !confirm(
        `"${name}" mağazasını listeden kaldırmak istediğine emin misin?`
      )
    ) return;

    updateData(current => ({
      ...current,

      stores:
        current.stores.filter(
          s => s !== name
        )
    }));

    setActiveStore(null);
  }

  if (activeStore) {

    const items =
      entries[activeStore] || [];

    const locked =
      !!locks[activeStore];

    return (
      <>

        <button
          className="back-button"
          onClick={() =>
            setActiveStore(null)
          }
        >
          ← Mağazalara dön
        </button>

        <div className="section-head">

          <h2 className="section-title">
            {activeStore}
            {" "}
            {locked ? "🔒" : ""}
          </h2>

          {isAdmin && (
            <div className="admin-actions">

              {locked && (
                <button
                  className="link-button"
                  onClick={unlockStore}
                >
                  Kilidi Aç
                </button>
              )}

              <button
                className="link-button"
                style={{
                  color:"#b4432e"
                }}
                onClick={() =>
                  deleteStore(activeStore)
                }
              >
                Mağazayı Sil
              </button>

            </div>
          )}

        </div>

        {!locked && (
          <form
            className="form-card"
            onSubmit={addItem}
          >

            <div className="form-title">
              Yeni Alış Kaydı
            </div>

            <div className="form-grid">

              <div className="field">
                <label>Ürün</label>

                <input
                  value={product}
                  onChange={e =>
                    setProduct(e.target.value)
                  }
                  placeholder="Örn. Un"
                />
              </div>

              <div className="field">
                <label>Miktar</label>

                <input
                  type="number"
                  min="0"
                  step="0.01"
                  value={qty}
                  onChange={e =>
                    setQty(e.target.value)
                  }
                />
              </div>

              <div className="field">
                <label>Birim Fiyat</label>

                <input
                  type="number"
                  min="0"
                  step="0.01"
                  value={price}
                  onChange={e =>
                    setPrice(e.target.value)
                  }
                  placeholder="0"
                />
              </div>

            </div>

            <button
              className="primary-button"
              type="submit"
            >
              + Ürün Ekle
            </button>

          </form>
        )}

        {locked && !isAdmin && (
          <div className="locked">
            🔒 Bu alış kaydı onaylandı.
            <br/>
            Değişiklik yapılamaz.
          </div>
        )}

        <div className="item-list">

          {items.length === 0 && (
            <div className="empty">
              Henüz alış kaydı bulunmuyor.
            </div>
          )}

          {items.map(item => (

            <div
              className="item-card"
              key={item.id}
            >

              <div>
                <div className="item-product">
                  {item.product}
                </div>

                <div className="item-detail">
                  {item.qty}
                  {" × "}
                  {formatTL(item.unitPrice)}
                </div>
              </div>

              <div className="item-right">

                <div className="item-price">
                  {formatTL(
                    Number(item.qty) *
                    Number(item.unitPrice)
                  )}
                </div>

                {!locked && (
                  <button
                    className="delete-button"
                    onClick={() =>
                      removeItem(item.id)
                    }
                  >
                    ×
                  </button>
                )}

              </div>

            </div>

          ))}

        </div>

        <div className="dark-total">
          <span>
            {activeStore} Toplamı
          </span>

          <span>
            {formatTL(
              storeTotal(activeStore)
            )}
          </span>
        </div>

        {!locked &&
          !isAdmin &&
          items.length > 0 && (

          <div className="warning">

            <label className="check-line">

              <input
                type="checkbox"
                checked={confirm}
                onChange={e =>
                  setConfirm(
                    e.target.checked
                  )
                }
              />

              <span className="warning-text">
                Bu kaydı kontrol ettim.
                Onayladıktan sonra
                değişiklik yapamayacağımı
                kabul ediyorum.
              </span>

            </label>

            <button
              className="primary-button"
              disabled={!confirm}
              style={{
                opacity:confirm ? 1 : .4
              }}
              onClick={lockStore}
            >
              ✓ Kaydet ve Onayla
            </button>

          </div>
        )}

      </>
    );
  }

  return (
    <>

      <h1 className="page-title">
        Alış Yönetimi
      </h1>

      <p className="page-description">
        Mağazalara göre günlük alış kayıtlarını yönet.
      </p>

      <div className="date-bar">

        <span>📅</span>

        <input
          type="date"
          value={date}
          onChange={e =>
            setDate(e.target.value)
          }
        />

        <span className="date-text">
          {formatDate(date)}
        </span>

      </div>

      <div className="dark-total">

        <span>
          Günün Alış Toplamı
        </span>

        <span>
          {formatTL(total)}
        </span>

      </div>

      <div className="store-list">

        {data.stores.map(store => {

          const items =
            entries[store] || [];

          const locked =
            !!locks[store];

          return (
            <button
              key={store}
              className="store-card"
              onClick={() =>
                setActiveStore(store)
              }
            >

              <div className="store-top">

                <div className="store-icon">
                  🏪
                </div>

                {locked && (
                  <span>🔒</span>
                )}

              </div>

              <div className="store-name">
                {store}
              </div>

              <div className="store-info">
                {items.length
                  ? `${items.length} ürün`
                  : "Ürün yok"}
              </div>

              <div className="store-total">
                {formatTL(
                  storeTotal(store)
                )}
              </div>

            </button>
          );
        })}

      </div>

      {isAdmin && (
        <div
          className="form-card"
          style={{
            marginTop:14
          }}
        >

          <div className="form-title">
            Yeni Mağaza
          </div>

          <div
            style={{
              display:"flex",
              gap:8
            }}
          >

            <input
              style={{
                flex:1,
                height:40,
                border:"1px solid #e2dfd7",
                borderRadius:10,
                padding:"0 10px",
                outline:"none",
                fontSize:12
              }}
              value={newStore}
              onChange={e =>
                setNewStore(e.target.value)
              }
              placeholder="Mağaza adı"
            />

            <button
              className="secondary-button"
              onClick={addStore}
            >
              Ekle
            </button>

          </div>

        </div>
      )}

    </>
  );
}

      <div className="dark-total">

        <span>
          Günün Satış Toplamı
        </span>

        <span>
          {formatTL(grandTotal)}
        </span>

      </div>

      {isAdmin && locked && (

        <button
          className="link-button"
          onClick={unlockSales}
          style={{
            marginBottom:12
          }}
        >
          🔓 Kilidi Kaldır
        </button>

      )}

      {readOnly && (

        <div className="locked">
          🔒 Bu günün satışları onaylandı.
          <br/>
          Değişiklik yapılamaz.
        </div>

      )}

      <div className="sales-grid">

        {rows.map(row => (

          <div
            className="sales-card"
            key={row.product}
          >

            <div className="sales-name">
              {row.product}
            </div>

            <div className="sales-fields">

              <div>
                <label>Adet</label>

                <input
                  type="number"
                  min="0"
                  value={row.qty}
                  disabled={readOnly}
                  placeholder="0"
                  onChange={e =>
                    updateProduct(
                      row.product,
                      "qty",
                      e.target.value
                    )
                  }
                />
              </div>

              <div>
                <label>Birim Fiyat</label>

                <input
                  type="number"
                  min="0"
                  step="0.01"
                  value={row.unitPrice}
                  disabled={readOnly}
                  placeholder="0"
                  onChange={e =>
                    updateProduct(
                      row.product,
                      "unitPrice",
                      e.target.value
                    )
                  }
                />
              </div>

            </div>

            <div className="sales-result">

              <span>
                Toplam
              </span>

              <strong>
                {formatTL(row.total)}
              </strong>

            </div>

          </div>

        ))}

      </div>

      {!readOnly &&
        !isAdmin &&
        hasEntry && (

        <div className="warning">

          <label className="check-line">

            <input
              type="checkbox"
              checked={confirm}
              onChange={e =>
                setConfirm(
                  e.target.checked
                )
              }
            />

            <span className="warning-text">
              Günlük satış kayıtlarını
              kontrol ettim ve
              onaylıyorum.
            </span>

          </label>

          <button
            className="primary-button"
            disabled={!confirm}
            style={{
              opacity:confirm ? 1 : .4
            }}
            onClick={lockSales}
          >
            ✓ Satışları Onayla
          </button>

        </div>

      )}

    </>
  );
}

/* ==========================================================
   MALİYET
========================================================== */

function Maliyet({
  data,
  updateData
}) {

  function updateCost(
    product,
    field,
    value
  ) {

    updateData(current => {

      const costs =
        current.costs || {};

      const old =
        costs[product] || {
          cost:"",
          price:""
        };

      return {
        ...current,

        costs:{
          ...costs,

          [product]:{
            ...old,
            [field]:value
          }
        }
      };
    });
  }

  return (
    <>

      <h1 className="page-title">
        Maliyet Yönetimi
      </h1>

      <p className="page-description">
        Ürün maliyetlerini ve satış fiyatlarını takip et.
      </p>

      <div className="cost-list">

        {SALE_PRODUCTS.map(product => {

          const c =
            data.costs[product] || {
              cost:"",
              price:""
            };

          const cost =
            Number(c.cost) || 0;

          const price =
            Number(c.price) || 0;

          const profit =
            price - cost;

          const margin =
            price > 0
              ? profit / price * 100
              : 0;

          return (
            <div
              className="cost-card"
              key={product}
            >

              <div className="cost-name">
                {product}
              </div>

              <div className="cost-fields">

                <div>
                  <label>
                    Maliyet
                  </label>

                  <input
                    type="number"
                    min="0"
                    step="0.01"
                    value={c.cost}
                    placeholder="0"
                    onChange={e =>
                      updateCost(
                        product,
                        "cost",
                        e.target.value
                      )
                    }
                  />
                </div>

                <div>
                  <label>
                    Satış Fiyatı
                  </label>

                  <input
                    type="number"
                    min="0"
                    step="0.01"
                    value={c.price}
                    placeholder="0"
                    onChange={e =>
                      updateCost(
                        product,
                        "price",
                        e.target.value
                      )
                    }
                  />
                </div>

              </div>

              <div className="cost-bottom">

                <span>
                  Kâr:{" "}
                  <strong className="margin">
                    {formatTL(profit)}
                  </strong>
                </span>

                <span className="margin">
                  %{margin.toFixed(0)}
                </span>

              </div>

            </div>
          );

        })}

      </div>

    </>
  );
}

/* ==========================================================
   KAR ZARAR
========================================================== */

function KarZarar({
  data
}) {

  const [month, setMonth] =
    useState(monthISO());

  const stats =
    useMemo(() => {

      let purchase = 0;
      let sales = 0;

      Object.entries(
        data.purchaseEntries || {}
      ).forEach(
        ([date, stores]) => {

          if (
            !date.startsWith(month)
          ) return;

          Object.values(
            stores || {}
          ).forEach(items => {

            (items || []).forEach(item => {

              purchase +=
                Number(item.qty || 0) *
                Number(item.unitPrice || 0);

            });

          });
        }
      );

      Object.entries(
        data.salesEntries || {}
      ).forEach(
        ([date, products]) => {

          if (
            !date.startsWith(month)
          ) return;

          Object.values(
            products || {}
          ).forEach(row => {

            sales +=
              Number(row.qty || 0) *
              Number(row.unitPrice || 0);

          });
        }
      );

      return {
        purchase,
        sales,
        net:sales-purchase
      };

    }, [data, month]);

  return (
    <>

      <h1 className="page-title">
        Kâr / Zarar
      </h1>

      <p className="page-description">
        Aylık satış ve alış hareketlerini karşılaştır.
      </p>

      <div className="date-bar">

        <span>📅</span>

        <input
          type="month"
          value={month}
          onChange={e =>
            setMonth(e.target.value)
          }
        />

        <span className="date-text">
          {formatMonth(month)}
        </span>

      </div>

      <div className="stats-grid">

        <div className="stat-card">

          <div className="stat-label">
            Toplam Satış
          </div>

          <div className="stat-value green">
            {formatTL(stats.sales)}
          </div>

        </div>

        <div className="stat-card">

          <div className="stat-label">
            Toplam Alış
          </div>

          <div className="stat-value red">
            {formatTL(stats.purchase)}
          </div>

        </div>

        <div className="stat-card">

          <div className="stat-label">
            Net Kâr / Nakit Akışı
          </div>

          <div
            className={
              "stat-value " +
              (
                stats.net >= 0
                  ? "green"
                  : "red"
              )
            }
          >
            {formatTL(stats.net)}
          </div>

        </div>

      </div>

      <div className="card">

        <div style={{
          fontSize:12,
          fontWeight:800,
          marginBottom:12
        }}>
          Finansal Özet
        </div>

        <div style={{
          display:"flex",
          justifyContent:"space-between",
          fontSize:11,
          padding:"9px 0",
          borderBottom:"1px solid #eeeae1"
        }}>
          <span>
            Satış
          </span>

          <strong className="green">
            {formatTL(stats.sales)}
          </strong>
        </div>

        <div style={{
          display:"flex",
          justifyContent:"space-between",
          fontSize:11,
          padding:"9px 0",
          borderBottom:"1px solid #eeeae1"
        }}>
          <span>
            Alış
          </span>

          <strong className="red">
            - {formatTL(stats.purchase)}
          </strong>
        </div>

        <div style={{
          display:"flex",
          justifyContent:"space-between",
          fontSize:12,
          paddingTop:12
        }}>
          <strong>
            Net
          </strong>

          <strong
            className={
              stats.net >= 0
                ? "green"
                : "red"
            }
          >
            {formatTL(stats.net)}
          </strong>
        </div>

      </div>

    </>
  );
}

/* ==========================================================
   YÖNETİCİ
========================================================== */

function Yonetici({
  data,
  updateData
}) {

  const [username, setUsername] =
    useState("");

  const [password, setPassword] =
    useState("");

  function addUser(e) {

    e.preventDefault();

    const u =
      username.trim();

    const p =
      password.trim();

    if (!u || !p) return;

    updateData(current => {

      if (
        current.users &&
        current.users[u]
      ) {
        return current;
      }

      return {
        ...current,

        users:{
          ...(current.users || {}),

          [u]:{
            password:p,
            role:"user"
          }
        }
      };
    });

    setUsername("");
    setPassword("");
  }

  function deleteUser(name) {

    if (
      !confirm(
        `"${name}" kullanıcısı silinsin mi?`
      )
    ) return;

    updateData(current => {

      const users = {
        ...(current.users || {})
      };

      delete users[name];

      return {
        ...current,
        users
      };
    });
  }

  return (
    <>

      <h1 className="page-title">
        Yönetici
      </h1>

      <p className="page-description">
        Kullanıcıları ve erişimleri yönet.
      </p>

      <form
        className="form-card"
        onSubmit={addUser}
      >

        <div className="form-title">
          Yeni Kullanıcı Oluştur
        </div>

        <div className="form-grid">

          <div className="field">
            <label>
              Kullanıcı Adı
            </label>

            <input
              value={username}
              autoCapitalize="none"
              onChange={e =>
                setUsername(e.target.value)
              }
              placeholder="Örn. personel"
            />
          </div>

          <div
            className="field"
            style={{
              gridColumn:"span 2"
            }}
          >
            <label>
              Şifre
            </label>

            <input
              type="password"
              value={password}
              onChange={e =>
                setPassword(e.target.value)
              }
              placeholder="Şifre"
            />
          </div>

        </div>

        <button
          className="primary-button"
          type="submit"
        >
          + Kullanıcı Oluştur
        </button>

      </form>

      <div className="user-list">

        {Object.entries(
          data.users || {}
        ).map(
          ([name, info]) => (

          <div
            className="user-card"
            key={name}
          >

            <div>

              <div className="user-name">
                {name}
              </div>

              <div className="user-role">
                {info.role === "admin"
                  ? "Yönetici"
                  : "Kullanıcı"}
              </div>

            </div>

            {info.role !== "admin" && (

              <button
                className="delete-button"
                onClick={() =>
                  deleteUser(name)
                }
              >
                ×
              </button>

            )}

          </div>

        ))}

      </div>

      <div
        className="card"
        style={{
          marginTop:14,
          background:"#fff9eb",
          borderColor:"#e8ddb9"
        }}
      >

        <div style={{
          fontSize:11,
          color:"#75662e",
          lineHeight:1.6
        }}>
          <strong>Veri güvenliği:</strong>
          <br/>
          Kullanıcı ve işletme kayıtları
          Firestore üzerinde tutulur.
          Sayfayı yenilediğinde veriler
          tekrar Firebase'den yüklenir.
        </div>

      </div>

    </>
  );
}

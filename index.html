<body>

<div id="root"></div>

<script type="text/babel">

const {
  useState,
  useEffect,
  useMemo
} = React;


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyBLXwi0r4QrMlpA7PxYEFwy5ADr_Q9nPqk",
  authDomain: "mano-pizza.firebaseapp.com",
  projectId: "mano-pizza",
  storageBucket: "mano-pizza.firebasestorage.app",
  messagingSenderId: "558530166779",
  appId: "1:558530166779:web:fe990140b59ad5dd1e155e"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


/* =========================================================
   FIRESTORE COLLECTIONS
========================================================= */

const CONFIG_REF = db.collection("mano_pizza").doc("config");

const PURCHASES = db.collection("mano_pizza_purchases");
const SALES = db.collection("mano_pizza_sales");
const COSTS = db.collection("mano_pizza_costs");


/* =========================================================
   SABİTLER
========================================================= */

const ADMIN_USERNAME = "mathrew";
const ADMIN_PASSWORD = "01102022";

const DEFAULT_STORES = [
  "Metro Market",
  "File Market"
];

const SALE_PRODUCTS = [
  "Margarita Pizza",
  ...Array.from(
    {length:20},
    (_,i)=>`Pizza No:${i+1}`
  )
];


/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function monthISO(){
  return todayISO().slice(0,7);
}

function formatTL(n){
  return new Intl.NumberFormat(
    "tr-TR",
    {
      style:"currency",
      currency:"TRY",
      maximumFractionDigits:2
    }
  ).format(Number(n)||0);
}

function formatDateLabel(iso){
  if(!iso) return "";
  try{
    return new Date(
      iso+"T00:00:00"
    ).toLocaleDateString(
      "tr-TR",
      {
        day:"numeric",
        month:"long",
        year:"numeric",
        weekday:"long"
      }
    );
  }catch(e){
    return iso;
  }
}

function formatMonthLabel(iso){
  if(!iso) return "";
  try{
    return new Date(
      iso+"-01T00:00:00"
    ).toLocaleDateString(
      "tr-TR",
      {
        month:"long",
        year:"numeric"
      }
    );
  }catch(e){
    return iso;
  }
}


/* =========================================================
   ICON
========================================================= */

function Icon({name,size=18}){
  useEffect(()=>{
    try{
      lucide.createIcons();
    }catch(e){}
  });

  return (
    <i
      data-lucide={name}
      style={{
        width:size,
        height:size
      }}
    />
  );
}


/* =========================================================
   ANA UYGULAMA
========================================================= */

function App(){

  const [loading,setLoading] = useState(true);
  const [error,setError] = useState("");

  const [config,setConfig] = useState({
    stores:DEFAULT_STORES,
    users:{
      [ADMIN_USERNAME]:{
        password:ADMIN_PASSWORD,
        role:"admin"
      }
    }
  });

  const [currentUser,setCurrentUser] = useState(null);

  const [purchases,setPurchases] = useState({});
  const [sales,setSales] = useState({});
  const [costs,setCosts] = useState({});

  const [menu,setMenu] = useState(false);
  const [tab,setTab] = useState("alis");
  const [date,setDate] = useState(todayISO());

  const [saveState,setSaveState] = useState("");


  /* =======================================================
     FIREBASE ANLIK DİNLEME
  ======================================================= */

  useEffect(()=>{

    let active = true;

    const unsubConfig = CONFIG_REF.onSnapshot(
      async snap => {

        try{

          if(!snap.exists){

            const initial = {
              stores:DEFAULT_STORES,
              users:{
                [ADMIN_USERNAME]:{
                  password:ADMIN_PASSWORD,
                  role:"admin"
                }
              }
            };

            await CONFIG_REF.set(initial,{merge:true});

            if(active){
              setConfig(initial);
            }

          }else{

            const d = snap.data() || {};

            const safeUsers =
              d.users &&
              typeof d.users === "object"
                ? d.users
                : {};

            const safeStores =
              Array.isArray(d.stores)
                ? d.stores
                : DEFAULT_STORES;

            if(active){

              setConfig({
                stores:safeStores,
                users:{
                  [ADMIN_USERNAME]:{
                    password:ADMIN_PASSWORD,
                    role:"admin"
                  },
                  ...safeUsers
                }
              });

            }

          }

        }catch(err){

          console.error(err);

          if(active){
            setError(
              "Firebase bağlantısı kurulamadı."
            );
          }

        }

        if(active){
          setLoading(false);
        }

      },
      err => {

        console.error(err);

        if(active){

          setError(
            "Firebase bağlantı hatası."
          );

          setLoading(false);

        }

      }
    );


    return ()=>{
      active=false;
      unsubConfig();
    };

  },[]);


  /* =======================================================
     TARİHE GÖRE ALIŞ DİNLE
  ======================================================= */

  useEffect(()=>{

    if(!date) return;

    const unsub = PURCHASES
      .doc(date)
      .onSnapshot(
        snap=>{

          if(snap.exists){

            setPurchases(
              snap.data() || {}
            );

          }else{

            setPurchases({});

          }

        },
        err=>{
          console.error(err);
          setError("Alış verileri alınamadı.");
        }
      );

    return ()=>unsub();

  },[date]);


  /* =======================================================
     TARİHE GÖRE SATIŞ DİNLE
  ======================================================= */

  useEffect(()=>{

    if(!date) return;

    const unsub = SALES
      .doc(date)
      .onSnapshot(
        snap=>{

          if(snap.exists){

            setSales(
              snap.data() || {}
            );

          }else{

            setSales({});

          }

        },
        err=>{
          console.error(err);
          setError("Satış verileri alınamadı.");
        }
      );

    return ()=>unsub();

  },[date]);


  /* =======================================================
     MALİYET DİNLE
  ======================================================= */

  useEffect(()=>{

    const unsub = COSTS
      .doc("main")
      .onSnapshot(
        snap=>{

          if(snap.exists){

            setCosts(
              snap.data() || {}
            );

          }else{

            setCosts({});

          }

        },
        err=>{
          console.error(err);
        }
      );

    return ()=>unsub();

  },[]);


  /* =======================================================
     KAYDETME DURUMU
  ======================================================= */

  function saved(){

    setSaveState("Kaydedildi");

    setTimeout(()=>{
      setSaveState("");
    },1500);

  }


  /* =======================================================
     LOGIN
  ======================================================= */

  function login(user){

    setCurrentUser(user);

  }


  if(loading){

    return(
      <div className="loading">

        <div className="spinner"></div>

        <div>
          Mano Pizza hazırlanıyor...
        </div>

        <div
          style={{
            color:"#77736b",
            fontSize:10,
            marginTop:6
          }}
        >
          Veriler güvenli şekilde yükleniyor
        </div>

      </div>
    );

  }


  if(!currentUser){

    return(
      <Login
        users={config.users}
        onLogin={login}
      />
    );

  }


  const isAdmin =
    currentUser.role === "admin";


  return(

    <div className="app">

      <TopBar
        user={currentUser}
        onMenu={()=>setMenu(true)}
        onLogout={()=>setCurrentUser(null)}
      />


      {menu && (

        <>
          <div
            className="drawer-overlay"
            onClick={()=>setMenu(false)}
          />

          <Drawer
            tab={tab}

            <input
              type="date"
              value={date}
              onChange={e=>setDate(e.target.value)}
            />

              {formatDateLabel(date)}
            </span>

          </div>

        )}


        {tab==="alis" && (

          <Alis
            config={config}
            purchases={purchases}
            date={date}
            isAdmin={isAdmin}
            save={saved}
            setError={setError}
          />

        )}


        {tab==="satis" && (

          <Satis
            sales={sales}
            date={date}
            isAdmin={isAdmin}
            save={saved}
            setError={setError}
          />

        )}


        {tab==="maliyet" && isAdmin && (

          />

        </div>

      )}

        </div>

function Login({
  users,
  onLogin
}){

  const [username,setUsername] = useState("");
  const [password,setPassword] = useState("");
  const [error,setError] = useState("");

  function submit(e){

    e.preventDefault();

    const name = username.trim();

    const user =
      users &&
      users[name];

    if(
      user &&
      user.password === password
    ){

      onLogin({
        username:name,
        role:user.role
      });

      return;

    }

    setError(
      "Kullanıcı adı veya şifre hatalı."
    );

    setPassword("");

  }


  return(

    <div className="login">

      <div className="login-box">

        <div className="login-logo">
          <Icon name="pizza" size={34}/>
        </div>

        <h1>
          Mano Pizza
        </h1>

        <div className="login-sub">
          Gelir · Gider · Satış Yönetimi
        </div>


        <form onSubmit={submit}>

          <div className="login-field">

            <span>
              Kullanıcı Adı
            </span>

            <input
              autoFocus
              type="text"
              autoCapitalize="none"
              value={username}
              onChange={
                e=>setUsername(e.target.value)
              }
            />

          </div>


          <div className="login-field">

            <span>
              Şifre
            </span>

            <input
              type="password"
              value={password}
              onChange={
                e=>setPassword(e.target.value)
              }
            />

          </div>


          {error && (

            <div className="login-error">
              {error}
            </div>

          )}


          <button
            className="login-btn"
            type="submit"
          >
            Giriş Yap
          </button>

        </form>

      </div>

    </div>

  );

}


/* =========================================================
   ALIŞ
========================================================= */

function Alis({
  config,
  purchases,
  date,
  isAdmin,
  save,
  setError
}){

  const [activeStore,setActiveStore] =
    useState(null);

  const [product,setProduct] =
    useState("");

  const [qty,setQty] =
    useState("1");

  const [price,setPrice] =
    useState("");

  const [newStore,setNewStore] =
    useState("");

  const [showAdd,setShowAdd] =
    useState(false);

  const [checked,setChecked] =
    useState(false);


  const stores =
    Array.isArray(config.stores)
      ? config.stores
      : DEFAULT_STORES;


  const dayStores =
    purchases.stores || {};


  function storeItems(store){

    return Array.isArray(dayStores[store])
      ? dayStores[store]
      : [];

  }


  function storeTotal(store){

    return storeItems(store)
      .reduce(
        (sum,item)=>
          sum+
          (Number(item.qty)||0)*
          (Number(item.unitPrice)||0),
        0
      );

  }


  const dayTotal =
    stores.reduce(
      (sum,store)=>
        sum+storeTotal(store),
      0
    );


  async function addItem(e){

    e.preventDefault();

    if(!activeStore) return;

    const p = product.trim();
    const q = Number(qty);
    const pr = Number(price);

    if(
      !p ||
      !q ||
      q<=0 ||
      isNaN(pr) ||
      pr<0
    ){

      setError("Ürün bilgilerini kontrol et.");
      return;

    }


    const item = {

      id:
        Date.now()+
        "-" +
        Math.random()
          .toString(36)
          .slice(2,8),

      product:p,
      qty:q,
      unitPrice:pr,

      createdAt:
        new Date().toISOString()

    };


    const current =
      storeItems(activeStore);

    const next = {

      ...purchases,

      stores:{
        ...dayStores,

        [activeStore]:[
          ...current,
          item
        ]
      }

    };


    try{

      await PURCHASES
        .doc(date)
        .set(next,{merge:true});

      save();

      setProduct("");
      setQty("1");
      setPrice("");

    }catch(err){

      console.error(err);

      setError(
        "Alış kaydedilemedi."
      );

    }

  }


  async function removeItem(id){

    if(!activeStore) return;

    const nextItems =
      storeItems(activeStore)
        .filter(x=>x.id!==id);

    const next = {

      ...purchases,

      stores:{
        ...dayStores,

        [activeStore]:nextItems

      }

    };


    try{

      await PURCHASES
        .doc(date)
        .set(next,{merge:true});

      save();

    }catch(err){

      setError(
        "Ürün silinemedi."
      );

    }

  }


  async function addStore(){

    const name =
      newStore.trim();

    if(
      !name ||
      stores.includes(name)
    ){

      setError(
        "Mağaza adı geçersiz veya zaten mevcut."
      );

      return;

    }


    try{

      await CONFIG_REF.set({

        stores:[
          ...stores,
          name
        ]

      },{merge:true});

      setNewStore("");
      setShowAdd(false);
      save();

    }catch(err){

      setError(
        "Mağaza kaydedilemedi."
      );

    }

  }


  async function deleteStore(store){

    if(
      !confirm(
        `"${store}" mağazasını silmek istediğinize emin misiniz?`
      )
    ) return;


    try{

      await CONFIG_REF.set({

        stores:
          stores.filter(x=>x!==store)

      },{merge:true});

      save();

      setActiveStore(null);

    }catch(err){

      setError(
        "Mağaza silinemedi."
      );

    }

  }


  if(activeStore){

    const items =
      storeItems(activeStore);


    return(

      <div>

        <button
          className="back-btn"
          onClick={()=>{

            setActiveStore(null);
            setChecked(false);

          }}
        >

          <Icon
            name="chevron-left"
            size={16}
          />

          Mağazalara Dön

        </button>


        <div
          style={{
            display:"flex",
            justifyContent:"space-between",
            alignItems:"center",
            marginBottom:12
          }}
        >

          <h2 className="section-title">
            {activeStore}
          </h2>

          {isAdmin && (

            <button
              className="danger-btn"
              onClick={()=>
                deleteStore(activeStore)
              }
            >
              <Icon
                name="trash-2"
                size={16}
              />
            </button>

          )}

        </div>


        <div className="card">

          <div className="form-grid">

            <div className="field">

              <label>
                Ürün
              </label>

              <input
                placeholder="Örn. Un"
                value={product}
                onChange={
                  e=>setProduct(e.target.value)
                }
              />

            </div>


            <div className="field">

              <label>
                Miktar
              </label>

              <input
                type="number"
                min="0"
                step="0.01"
                value={qty}
                onChange={
                  e=>setQty(e.target.value)
                }
              />

            </div>


            <div className="field">

              <label>
                Birim Fiyat
              </label>

              <input
                type="number"
                min="0"
                step="0.01"
                placeholder="0"
                value={price}
                onChange={
                  e=>setPrice(e.target.value)
                }
              />

            </div>

          </div>


          <button
            className="primary-btn"
            onClick={addItem}
          >

            <Icon
              name="plus"
              size={15}
            />

            Ürün Ekle

          </button>

        </div>


        <div className="entry-list">

          {items.length===0 && (

            <div className="empty">
              Henüz ürün girilmedi.
            </div>

          )}


          {items.map(item=>(

            <div
              className="entry"
              key={item.id}
            >

              <div>

                <div className="entry-product">
                  {item.product}
                </div>

                <div className="entry-meta">
                  {item.qty} × {formatTL(item.unitPrice)}
                </div>

              </div>


              <div
                style={{
                  display:"flex",
                  alignItems:"center",
                  gap:7
                }}
              >

                <div className="entry-price">
                  {formatTL(
                    item.qty*item.unitPrice
                  )}
                </div>


                <button
                  className="danger-btn"
                  onClick={()=>
                    removeItem(item.id)
                  }
                >

                  <Icon
                    name="trash-2"
                    size={15}
                  />

                </button>

              </div>

            </div>

          ))}

        </div>


        <div className="total-card">

          <span className="total-label">
            {activeStore} Toplamı
          </span>

          <span className="total-value">
            {formatTL(
              storeTotal(activeStore)
            )}
          </span>

        </div>

      </div>

    );

  }


  return(

    <div>

      <div className="total-card">

        <span className="total-label">
          Günün Alış Toplamı
        </span>

        <span className="total-value">
          {formatTL(dayTotal)}
        </span>

      </div>


      <div className="store-list">

        {stores.map(store=>{

          const items =
            storeItems(store);

          return(

            <button
              className="store-button"
              key={store}
              onClick={()=>
                setActiveStore(store)
              }
            >

              <div className="store-left">

                <div className="store-icon">
                  <Icon
                    name="store"
                    size={18}
                  />
                </div>

                <div>

                  <div className="store-name">
                    {store}
                  </div>

                  <div className="store-meta">
                    {items.length
                      ? `${items.length} ürün`
                      : "Ürün yok"}
                  </div>

                </div>

              </div>


              <div className="store-total">
                {formatTL(
                  storeTotal(store)
                )}
              </div>

            </button>

          );

        })}

      </div>


      {isAdmin && (

        <div
          className="card"
          style={{
            marginTop:10
          }}
        >

          {!showAdd ? (

            <button
              className="secondary-btn"
              style={{
                width:"100%"
              }}
              onClick={()=>
                setShowAdd(true)
              }
            >

              <Icon
                name="plus"
                size={15}
              />

              Yeni Mağaza Ekle

            </button>

          ): (

            <div className="add-store-row">

              <input
                autoFocus
                placeholder="Mağaza adı"
                value={newStore}
                onChange={
                  e=>setNewStore(e.target.value)
                }
              />

              <button
                className="secondary-btn"
                onClick={addStore}
              >
                Ekle
              </button>

              <button
                className="secondary-btn"
                onClick={()=>{
                  setShowAdd(false);
                  setNewStore("");
                }}
              >
                <Icon name="x" size={15}/>
              </button>

            </div>

          )}

        </div>

      )}

    </div>

  );

}


/* =========================================================
   SATIŞ
========================================================= */

function Satis({
  sales,
  date,
  isAdmin,
  save,
  setError
}){

  const rows =
    SALE_PRODUCTS.map(product=>{

      const r =
        sales[product] || {
          qty:"",
          unitPrice:""
        };

      const q =
        Number(r.qty)||0;

      const p =
        Number(r.unitPrice)||0;

      return{
        product,
        qty:r.qty ?? "",
        unitPrice:r.unitPrice ?? "",
        total:q*p
      };

    });


  const total =
    rows.reduce(
      (sum,row)=>
        sum+row.total,
      0
    );


  async function update(
    product,
    field,
    value
  ){

    const current =
      sales[product] || {
        qty:"",
        unitPrice:""
      };

    const next = {

      ...sales,

      [product]:{
        ...current,
        [field]:value
      }

    };


    try{

      await SALES
        .doc(date)
        .set(next,{merge:true});

      save();

    }catch(err){

      console.error(err);

      setError(
        "Satış kaydedilemedi."
      );

    }

  }


  return(

    <div>

      <div className="total-card">

        <span className="total-label">
          Günün Satış Toplamı
        </span>

        <span className="total-value">
          {formatTL(total)}
        </span>

      </div>


      <div className="sale-list">

        {rows.map(row=>(

          <div
            className="sale-card"
            key={row.product}
          >

            <div className="sale-name">
              {row.product}
            </div>


            <div className="sale-fields">

              <div className="sale-field">

                <label>
                  Adet
                </label>

                <input
                  type="number"
                  min="0"
                  placeholder="0"
                  value={row.qty}
                  onChange={
                    e=>
                      update(
                        row.product,
                        "qty",
                        e.target.value
                      )
                  }
                />

              </div>


              <div className="sale-field">

                <label>
                  Birim Fiyat
                </label>

                <input
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="0"
                  value={row.unitPrice}
                  onChange={
                    e=>
                      update(
                        row.product,
                        "unitPrice",
                        e.target.value
                      )
                  }
                />

              </div>

            </div>


            <div className="sale-total">

              {formatTL(row.total)}

            </div>

          </div>

        ))}

      </div>

    </div>

  );

}


/* =========================================================
   MALİYET
========================================================= */

function Maliyet({
  costs,
  save,
  setError
}){


  async function update(
    product,
    field,
    value
  ){

    const current =
      costs[product] || {
        cost:"",
        price:""
      };


    const next = {

      ...costs,

      [product]:{
        ...current,
        [field]:value
      }

    };


    try{

      await COSTS
        .doc("main")
        .set(next,{merge:true});

      save();

    }catch(err){

      console.error(err);

      setError(
        "Maliyet kaydedilemedi."
      );

    }

  }


  return(

    <div>

      <h2 className="section-title">
        Maliyet Yönetimi
      </h2>


      <div className="cost-list">

        {SALE_PRODUCTS.map(product=>{

          const c =
            costs[product] || {
              cost:"",
              price:""
            };

          const cost =
            Number(c.cost)||0;

          const price =
            Number(c.price)||0;

          const profit =
            price-cost;

          const pct =
            price>0
              ? (profit/price)*100
              : 0;


          return(

            <div
              className="cost-card"
              key={product}
            >

              <div className="cost-name">
                {product}
              </div>


              <div className="cost-grid">

                <div>

                  <label>
                    Maliyet
                  </label>

                  <input
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="0"
                    value={c.cost}
                    onChange={
                      e=>
                        update(
                          product,
                          "cost",
                          e.target.value
                        )
                    }
                  />

                </div>


                <div>

                  <label>
                    Satış
                  </label>

                  <input
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="0"
                    value={c.price}
                    onChange={
                      e=>
                        update(
                          product,
                          "price",
                          e.target.value
                        )
                    }
                  />

                </div>

              </div>


              <div className="cost-result">

                <span>
                  Kâr:{" "}
                  <span className="green">
                    {formatTL(profit)}
                  </span>
                </span>

                <span className="green">
                  %{pct.toFixed(0)}
                </span>

              </div>

            </div>

          );

        })}

      </div>

    </div>

  );

}


/* =========================================================
   KAR ZARAR
========================================================= */

function KarZarar({
  purchases,
  sales,
  date,
  setDate
}){

  const month =
    date.slice(0,7);


  const purchaseTotal =
    Object.values(
      purchases.stores || {}
    )
    .flat()
    .reduce(
      (sum,item)=>
        sum+
        (Number(item.qty)||0)*
        (Number(item.unitPrice)||0),
      0
    );


  const salesTotal =
    Object.values(sales)
      .reduce(
        (sum,row)=>
          sum+
          (Number(row.qty)||0)*
          (Number(row.unitPrice)||0),
        0
      );


  return(

    <div>

      <div className="date-card">

        <Icon
          name="calendar"
          size={17}
        />

        <input
          type="month"
          value={month}
          onChange={e=>
            setDate(
              e.target.value+
              "-01"
            )
          }
        />

        <span className="date-label">
          {formatMonthLabel(month)}
        </span>

      </div>


      <div className="stat-grid">

        <div className="stat">

          <div className="stat-label">
            Günlük Satış
          </div>

          <div className="stat-value green">
            {formatTL(salesTotal)}
          </div>

        </div>


        <div className="stat">

          <div className="stat-label">
            Günlük Alış
          </div>

          <div className="stat-value red">
            {formatTL(purchaseTotal)}
          </div>

        </div>

      </div>


      <div className="total-card">

        <span className="total-label">
          Net Kâr / Nakit Farkı
        </span>

        <span className="total-value">
          {formatTL(
            salesTotal-purchaseTotal
          )}
        </span>

      </div>


      <div className="card">

        <div
          style={{
            color:"#77736b",
            fontSize:11,
            lineHeight:1.5
          }}
        >
          Bu ekran seçilen günün satış ve alış
          kayıtlarını karşılaştırır. Aylık tam
          raporlama için kayıtlar ayrı tarih
          belgelerinde tutulduğu için geçmiş
          günlerin verileri kaybolmaz.
        </div>

      </div>

    </div>

  );

}


/* =========================================================
   YÖNETİCİ
========================================================= */

function Yonetici({
  config,
  save,
  setError
}){

  const [username,setUsername] =
    useState("");

  const [password,setPassword] =
    useState("");


  const users =
    config.users || {};


  async function create(){

    const u =
      username.trim();

    const p =
      password.trim();


    if(!u || !p){

      setError(
        "Kullanıcı adı ve şifre girin."
      );

      return;

    }


    if(users[u]){

      setError(
        "Bu kullanıcı zaten mevcut."
      );

      return;

    }


    try{

      await CONFIG_REF.set({

        users:{
          ...users,

          [u]:{
            password:p,
            role:"user"
          }

        }

      },{merge:true});


      setUsername("");
      setPassword("");

      save();

    }catch(err){

      console.error(err);

      setError(
        "Kullanıcı oluşturulamadı."
      );

    }

  }


  async function deleteUser(name){

    if(
      !confirm(
        `"${name}" kullanıcısı silinsin mi?`
      )
    ) return;


    const next = {
      ...users
    };

    delete next[name];


    try{

      await CONFIG_REF.set({

        users:next

      },{merge:true});

      save();

    }catch(err){

      setError(
        "Kullanıcı silinemedi."
      );

    }

  }


  return(

    <div>

      <h2 className="section-title">
        Kullanıcı Yönetimi
      </h2>


      <div className="card">

        <div className="form-grid">

          <div className="field">

            <label>
              Kullanıcı Adı
            </label>

            <input
              autoCapitalize="none"
              placeholder="Yeni kullanıcı"
              value={username}
              onChange={
                e=>setUsername(e.target.value)
              }
            />

          </div>


          <div className="field">

            <label>
              Şifre
            </label>

            <input
              placeholder="Şifre"
              value={password}
              onChange={
                e=>setPassword(e.target.value)
              }
            />

          </div>

        </div>


        <button
          className="primary-btn"
          onClick={create}
        >

          <Icon
            name="user-plus"
            size={15}
          />

          Kullanıcı Oluştur

        </button>

      </div>


      <div>

        {Object.entries(users).map(
          ([name,user])=>(

            <div
              className="user-row"
              key={name}
            >

              <div>

                <div className="user-name">
                  {name}
                </div>

                <div className="user-role">
                  {user.role==="admin"
                    ? "Yönetici"
                    : "Kullanıcı"}
                </div>

              </div>


              {user.role!=="admin" && (

                <button
                  className="danger-btn"
                  onClick={()=>
                    deleteUser(name)
                  }
                >

                  <Icon
                    name="trash-2"
                    size={16}
                  />

                </button>

              )}

            </div>

          )
        )}

      </div>


      <div
        className="card"
        style={{
          marginTop:12,
          background:"#f1efe9"
        }}
      >

        <div
          style={{
            fontSize:11,
            fontWeight:800,
            marginBottom:5
          }}
        >
          Veri sistemi
        </div>

        <div
          style={{
            fontSize:10,
            color:"#6b6862",
            lineHeight:1.5
          }}
        >
          Kullanıcılar artık alış veya satış
          kaydıyla aynı belgeye yazılmıyor.
          Bu nedenle bir kayıt yapılırken
          kullanıcı listesinin üzerine yazılması
          engellenmiş oluyor.
        </div>

      </div>

    </div>

  );

}


/* =========================================================
   BAŞLAT
========================================================= */

ReactDOM.createRoot(
  document.getElementById("root")
).render(
  <App/>
);

</script>

</body>
</html>

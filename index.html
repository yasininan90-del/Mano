<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body, #root {
  margin: 0;
  min-height: 100%;
  width: 100%;
}

body {
  background: #f7f6f2;
  color: #1c1b19;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

button,
input {
  font-family: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

input {
  min-width: 0;
}

::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}

::-webkit-scrollbar-thumb {
  background: #c9c6bd;
  border-radius: 10px;
}

/* SIDEBAR */

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 245px;
  background: #1c1b19;
  color: white;
  z-index: 100;
  display: flex;
  flex-direction: column;
  transition: transform .25s ease;
}

.sidebar-logo {
  padding: 25px 20px;
  border-bottom: 1px solid #36342f;
}

.sidebar-nav {
  padding: 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.sidebar-btn {
  width: 100%;
  border: 0;
  background: transparent;
  color: #aaa69d;
  padding: 13px 14px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  font-weight: 600;

  text-align: left;
}

.sidebar-btn:hover {

  color: white;
}

.sidebar-btn.active {
  background: #b4432e;
  color: white;
}

.sidebar-bottom {
  margin-top: auto;
  padding: 15px;
  border-top: 1px solid #36342f;
}

.main-area {
  margin-left: 245px;
  min-height: 100vh;
}

.mobile-header {
  display: none;
}

.mobile-overlay {
  display: none;
}

/* CARDS */

.card {
  background: white;
  border: 1px solid #e4e1d8;
  border-radius: 15px;
}

.dark-card {
  background: #1c1b19;
  color: white;
  border-radius: 15px;
}

/* TABLE */

.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.sales-table {
  width: 100%;
  min-width: 580px;
  border-collapse: collapse;
}

.sales-table th {
  background: #f1efe9;
  color: #6b6862;
  font-size: 11px;
  padding: 11px 8px;
  text-align: left;
}

.sales-table td {
  border-top: 1px solid #efede6;
  padding: 8px;
  font-size: 12px;
}

.sales-table input {
  width: 100%;
  border: 1px solid #e4e1d8;
  border-radius: 7px;
  padding: 8px;
  background: #fcfcfa;
  outline: none;
  font-size: 12px;
}

.sales-table input:focus {
  border-color: #b4432e;
}

/* MOBILE */

@media (max-width: 760px) {

  .sidebar {
    transform: translateX(-100%);
    width: 270px;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .mobile-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 90;
  }

  .mobile-overlay.show {
    display: block;
  }

  .main-area {
    margin-left: 0;
  }

  .mobile-header {
    position: sticky;
    top: 0;
    z-index: 50;
    height: 62px;
    background: #fff;
    border-bottom: 1px solid #e4e1d8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
  }

  .content {
    padding: 14px !important;
  }

  .desktop-only {
    display: none !important;
  }

  .mobile-grid-1 {
    grid-template-columns: 1fr !important;
  }

  .mobile-grid-2 {
    grid-template-columns: 1fr 1fr !important;
  }

  .form-grid {
    grid-template-columns: 1fr !important;
  }

  .sales-table {
    min-width: 520px;
  }

  .stat-number {
    font-size: 18px !important;
  }

  .page-title {
    font-size: 18px !important;
  }
}

/* LOGIN */

.login-screen {
  min-height: 100vh;
  background: #1c1b19;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 360px;
}

.login-input {
  width: 100%;
  background: #292824;
  color: white;
  border: 1px solid #3b3934;
  padding: 13px;
  border-radius: 10px;
  outline: none;
}

.login-input:focus {
  border-color: #b4432e;
}

/* STATUS */

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
}

.status-saving {
  background: #d6a11e;
}

.status-saved {
  background: #1c6b4e;
}

.status-offline {
  background: #b4432e;
}
</style>

<body>

<div id="root"></div>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getFirestore,
  doc,
  onSnapshot,
  setDoc,
  getDoc,
  enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLXwi0r4QrMlpA7PxYEFwy5ADr_Q9nPqk",
  authDomain: "mano-pizza.firebaseapp.com",
  projectId: "mano-pizza",
  storageBucket: "mano-pizza.firebasestorage.app",
  messagingSenderId: "558530166779",
  appId: "1:558530166779:web:fe990140b59ad5dd1e155e"
};

try {

  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const ref = doc(db, "mano_pizza", "veri");

  try {
    await enableIndexedDbPersistence(db);
  } catch(e) {
    console.log("Offline persistence:", e.message);
  }

  window.MANO_FIREBASE = {
    db,
    ref,
    onSnapshot,
    setDoc,
    getDoc
  };

  window.dispatchEvent(new Event("firebase-ready"));

} catch(error) {

  console.error(error);

  window.MANO_FIREBASE_ERROR = error.message;

  window.dispatchEvent(new Event("firebase-ready"));
}
</script>

<script type="text/babel">

const {
  useState,
  useEffect,
  useMemo
} = React;


/* =========================
   AYARLAR
========================= */

const ADMIN_USERNAME = "mathrew";
const ADMIN_PASSWORD = "01102022";

const DEFAULT_STORES = [
  "Metro Market",
  "File Market"
];

const SALE_PRODUCTS = [
  "Margarita Pizza",
  ...Array.from(
    {length:20},
    (_,i) => `Pizza No:${i+1}`
  )
];


/* =========================
   DEFAULT DATA
========================= */

const EMPTY_DATA = {

  version: 3,

  stores: DEFAULT_STORES,

  purchaseEntries: {},

  purchaseLocks: {},

  salesEntries: {},

  salesLocks: {},

  costs: {},

  users: {
    [ADMIN_USERNAME]: {
      password: ADMIN_PASSWORD,
      role: "admin"
    }
  }
};


/* =========================
   HELPERS
========================= */

function todayISO() {

  const d = new Date();

  return d.toLocaleDateString("en-CA");

}

function monthISO() {

  return todayISO().slice(0,7);

}

function money(value) {

  return new Intl.NumberFormat(
    "tr-TR",
    {
      style:"currency",
      currency:"TRY",
      maximumFractionDigits:2
    }
  ).format(Number(value) || 0);

}

function dateLabel(value) {

  if(!value) return "";

  return new Date(
    value + "T00:00:00"
  ).toLocaleDateString(
    "tr-TR",
    {
      day:"numeric",
      month:"long",
      year:"numeric",
      weekday:"long"
    }
  );

}

function monthLabel(value) {

  return new Date(
    value + "-01T00:00:00"
  ).toLocaleDateString(
    "tr-TR",
    {
      month:"long",
      year:"numeric"
    }
  );

}

function cloneData(data) {

  return JSON.parse(
    JSON.stringify(data)
  );

}


/* =========================
   ICON
========================= */

function Icon({
  name,
  size=17
}) {

  useEffect(() => {

    try {
      lucide.createIcons();
    } catch(e){}

  });

  return (
    <i
      data-lucide={name}
      style={{
        width:size,
        height:size,
        flexShrink:0
      }}
    />
  );

}


/* =========================
   APP
========================= */

function App() {

  const [data,setData] =
    useState(EMPTY_DATA);

  const [loading,setLoading] =
    useState(true);

  const [user,setUser] =
    useState(null);

  const [menuOpen,setMenuOpen] =
    useState(false);

  const [tab,setTab] =
    useState("alis");

  const [syncStatus,setSyncStatus] =
    useState("connecting");


  /* FIREBASE LISTENER */

  useEffect(() => {

    let unsubscribe;

    function start() {

      if(!window.MANO_FIREBASE) {

        setTimeout(start,100);

        return;
      }

      const firebase =
        window.MANO_FIREBASE;

      if(!firebase.ref) {

        setLoading(false);

        return;
      }

      unsubscribe =
        firebase.onSnapshot(
          firebase.ref,
          snapshot => {

            if(snapshot.exists()) {

              const remote =
                snapshot.data();

              const merged = {

                ...cloneData(EMPTY_DATA),

                ...remote,

                stores:
                  Array.isArray(remote.stores)
                    ? remote.stores
                    : DEFAULT_STORES,

                users: {
                  ...EMPTY_DATA.users,
                  ...(remote.users || {})
                }

              };

              setData(merged);

              localStorage.setItem(
                "mano_pizza_backup",
                JSON.stringify(merged)
              );

            } else {

              const initial =
                cloneData(EMPTY_DATA);

              setDoc(
                firebase.ref,
                initial,
                {merge:false}
              ).catch(console.error);

              setData(initial);

            }

            setSyncStatus("saved");

            setLoading(false);

          },
          error => {

            console.error(
              "Firebase:",
              error
            );

            const backup =
              localStorage.getItem(
                "mano_pizza_backup"
              );

            if(backup) {

              try {

                setData(
                  JSON.parse(backup)
                );

              } catch(e){}

            }

            setSyncStatus("offline");

            setLoading(false);

          }
        );

    }

    window.addEventListener(
      "firebase-ready",
      start
    );

    start();

    return () => {

      window.removeEventListener(
        "firebase-ready",
        start
      );

      if(unsubscribe)
        unsubscribe();

    };

  },[]);


  /* =========================
     SAVE
  ========================= */

  async function save(next) {

    const safe =
      cloneData(next);

    setData(safe);

    localStorage.setItem(
      "mano_pizza_backup",
      JSON.stringify(safe)
    );

    setSyncStatus("saving");

    try {

      if(
        !window.MANO_FIREBASE ||
        !window.MANO_FIREBASE.ref
      ) {

        throw new Error(
          "Firebase hazır değil"
        );

      }

      await window.MANO_FIREBASE.setDoc(
        window.MANO_FIREBASE.ref,
        safe,
        {merge:false}
      );

      setSyncStatus("saved");

    } catch(error) {

      console.error(error);

      setSyncStatus("offline");

    }

  }


  if(loading) {

    return (
      <div className="login-screen">

        <div
          style={{
            color:"#aaa69d",
            textAlign:"center"
          }}
        >

          <div
            style={{
              width:55,
              height:55,
              borderRadius:15,
              background:"#b4432e",
              display:"flex",
              alignItems:"center",
              justifyContent:"center",
              margin:"0 auto 15px"
            }}
          >

            <Icon
              name="pizza"
              size={27}
            />

          </div>

          <b
            style={{
              color:"white",
              fontSize:20
            }}
          >
            Mano Pizza
          </b>

          <div
            style={{
              marginTop:8,
              fontSize:12
            }}
          >
            Veriler yükleniyor...
          </div>

        </div>

      </div>
    );

  }


  if(!user) {

    return (
      <Login
        users={data.users}
        onLogin={setUser}
      />
    );

  }


  const isAdmin =
    user.role === "admin";


  const menu = [

    {
      id:"alis",
      label:"Alış",
      icon:"shopping-bag"
    },

    {
      id:"satis",
      label:"Satış",
      icon:"trending-up"
    },

    ...(isAdmin ? [

      {
        id:"maliyet",
        label:"Maliyetler",
        icon:"percent"
      },

      {
        id:"karzarar",
        label:"Kâr / Zarar",
        icon:"bar-chart-3"
      },

      {
        id:"yonetici",
        label:"Yönetici",
        icon:"shield-check"
      }

    ] : [])

  ];


  function selectTab(id) {

    setTab(id);

    setMenuOpen(false);

  }


  return (

    <div>

      {/* SIDEBAR */}

      <aside
        className={
          "sidebar " +
          (menuOpen ? "open" : "")
        }
      >

        <div className="sidebar-logo">

          <div
            style={{
              display:"flex",
              alignItems:"center",
              gap:11
            }}
          >

            <div
              style={{
                width:39,
                height:39,
                borderRadius:11,
                background:"#b4432e",
                display:"flex",
                alignItems:"center",
                justifyContent:"center"
              }}
            >

              <Icon
                name="pizza"
                size={21}
              />

            </div>

            <div>

              <div
                style={{
                  fontWeight:800,
                  fontSize:17
                }}
              >
                Mano Pizza
              </div>

              <div
                style={{
                  fontSize:11,
                  color:"#8e8a82",
                  marginTop:2
                }}
              >
                İşletme Yönetimi
              </div>

            </div>

          </div>

        </div>


        <nav className="sidebar-nav">

          {menu.map(item => (

            <button
              key={item.id}
              onClick={() =>
                selectTab(item.id)
              }
              className={
                "sidebar-btn " +
                (tab === item.id
                  ? "active"
                  : "")
              }
            >

              <Icon
                name={item.icon}
              />

              {item.label}

            </button>

          ))}

        </nav>


        <div className="sidebar-bottom">

          <div
            style={{
              fontSize:11,
              color:"#8e8a82",
              marginBottom:10
            }}
          >

            {user.username}
            {" · "}
            {isAdmin
              ? "Yönetici"
              : "Kullanıcı"}

          </div>

          <button
            onClick={() => {
              setUser(null);
              setMenuOpen(false);
            }}
            className="sidebar-btn"
            style={{
              padding:"10px 12px"
            }}
          >

            <Icon
              name="log-out"
            />

            Çıkış Yap

          </button>

        </div>

      </aside>


      {/* OVERLAY */}

      <div
        className={
          "mobile-overlay " +
          (menuOpen ? "show" : "")
        }
        onClick={() =>
          setMenuOpen(false)
        }
      />


      {/* MAIN */}

      <main className="main-area">

        <header className="mobile-header">

          <button
            onClick={() =>
              setMenuOpen(true)
            }
            style={{
              border:0,
              background:"transparent",
              padding:5
            }}
          >

            <Icon
              name="menu"
              size={23}
            />

          </button>


          <div
            style={{
              fontWeight:800,
              fontSize:16
            }}
          >
            {menu.find(
              x => x.id === tab
            )?.label}
          </div>


          <div
            title={
              syncStatus === "saved"
                ? "Veriler kaydedildi"
                : syncStatus === "saving"
                ? "Kaydediliyor"
                : "Çevrimdışı"
            }
            style={{
              display:"flex",
              alignItems:"center"
            }}
          >

            <span
              className={
                "status-dot " +
                (
                  syncStatus === "saved"
                  ? "status-saved"
                  : syncStatus === "saving"
                  ? "status-saving"
                  : "status-offline"
                )
              }
            />

          </div>

        </header>


        <div
          className="content"
          style={{
            maxWidth:1000,
            margin:"0 auto",
            padding:"25px"
          }}
        >

          {/* DESKTOP HEADER */}

          <div
            className="desktop-only"
            style={{
              display:"flex",
              alignItems:"center",
              justifyContent:"space-between",
              marginBottom:20
            }}
          >

            <div>

              <h1
                className="page-title"
                style={{
                  margin:0,
                  fontSize:23,
                  fontWeight:800
                }}
              >
                {menu.find(
                  x => x.id === tab
                )?.label}
              </h1>

              <div
                style={{
                  marginTop:4,
                  fontSize:12,
                  color:"#77736b"
                }}
              >
                Mano Pizza işletme paneli
              </div>

            </div>


            <div
              style={{
                display:"flex",
                alignItems:"center",
                gap:7,
                fontSize:11,
                color:"#77736b"
              }}
            >

              <span
                className={
                  "status-dot " +
                  (
                    syncStatus === "saved"
                      ? "status-saved"
                      : syncStatus === "saving"
                      ? "status-saving"
                      : "status-offline"
                  )
                }
              />

              {
                syncStatus === "saved"
                  ? "Kaydedildi"
                  : syncStatus === "saving"
                  ? "Kaydediliyor..."
                  : "Çevrimdışı"
              }

            </div>

          </div>


          {tab === "alis" && (

            <Alis
              data={data}
              save={save}
              isAdmin={isAdmin}
            />

          )}


          {tab === "satis" && (

            <Satis
              data={data}
              save={save}
              isAdmin={isAdmin}
            />

          )}


          {tab === "maliyet" &&
            isAdmin && (

            <Maliyet
              data={data}
              save={save}
            />

          )}


          {tab === "karzarar" &&
            isAdmin && (

            <KarZarar
              data={data}
            />

          )}


          {tab === "yonetici" &&
            isAdmin && (

            <Yonetici
              data={data}
              save={save}
            />

          )}

        </div>

      </main>

    </div>

  );

}


/* =========================
   LOGIN
========================= */

function Login({
  users,
  onLogin
}) {

  const [username,setUsername] =
    useState("");

  const [password,setPassword] =
    useState("");

  const [error,setError] =
    useState("");

  const [show,setShow] =
    useState(false);


  function submit(e) {

    e.preventDefault();

    const name =
      username.trim();

    const u =
      users[name];

    if(
      u &&
      u.password === password
    ) {

      onLogin({
        username:name,
        role:u.role
      });

    } else {

      setError(
        "Kullanıcı adı veya şifre hatalı."
      );

      setPassword("");

    }

  }


  return (

    <div className="login-screen">

      <div className="login-box">

        <div
          style={{
            textAlign:"center",
            marginBottom:30
          }}
        >

          <div
            style={{
              width:72,
              height:72,
              borderRadius:20,
              background:"#b4432e",
              display:"flex",
              alignItems:"center",
              justifyContent:"center",
              margin:"0 auto 15px"
            }}
          >

            <Icon
              name="pizza"
              size={34}
            />

          </div>

          <div
            style={{
              color:"white",
              fontWeight:800,
              fontSize:25
            }}
          >
            Mano Pizza
          </div>

          <div
            style={{
              color:"#8f8b83",
              fontSize:12,
              marginTop:5
            }}
          >
            İşletme Yönetim Paneli
          </div>

        </div>


        <form onSubmit={submit}>

          <label
            style={{
              color:"#9c9890",
              fontSize:11
            }}
          >
            Kullanıcı Adı
          </label>

          <input
            className="login-input"
            value={username}
            autoCapitalize="none"
            autoCorrect="off"
            onChange={e =>
              setUsername(
                e.target.value
              )
            }
            style={{
              marginTop:5,
              marginBottom:13
            }}
          />


          <label
            style={{
              color:"#9c9890",
              fontSize:11
            }}
          >
            Şifre
          </label>

          <div
            style={{
              position:"relative",
              marginTop:5
            }}
          >

            <input
              className="login-input"
              type={
                show
                  ? "text"
                  : "password"
              }
              value={password}
              onChange={e =>
                setPassword(
                  e.target.value
                )
              }
              style={{
                paddingRight:45
              }}
            />

            <button
              type="button"
              onClick={() =>
                setShow(!show)
              }
              style={{
                position:"absolute",
                right:10,
                top:10,
                border:0,
                background:"transparent",
                color:"#999",
                padding:4
              }}
            >

              <Icon
                name={
                  show
                    ? "eye-off"
                    : "eye"
                }
                size={18}
              />

            </button>

          </div>


          {error && (

            <div
              style={{
                color:"#e08a75",
                fontSize:12,
                marginTop:10
              }}
            >
              {error}
            </div>

          )}


          <button
            type="submit"
            style={{
              width:"100%",
              marginTop:20,
              padding:14,
              border:0,
              borderRadius:11,
              background:"#f7f6f2",
              color:"#1c1b19",
              fontWeight:800,
              cursor:"pointer"
            }}
          >
            Giriş Yap
          </button>

        </form>

      </div>

    </div>

  );

}


/* =========================
   ALIŞ
========================= */

function Alis({
  data,
  save,
  isAdmin
}) {

  const [date,setDate] =
    useState(todayISO());

  const [store,setStore] =
    useState(null);

  const [product,setProduct] =
    useState("");

  const [qty,setQty] =
    useState("1");

  const [price,setPrice] =
    useState("");

  const [newStore,setNewStore] =
    useState("");


  const entries =
    data.purchaseEntries[date] || {};

  const locks =
    data.purchaseLocks[date] || {};


  function storeTotal(name) {

    return (
      entries[name] || []
    ).reduce(
      (sum,item) =>
        sum +
        Number(item.qty || 0) *
        Number(item.unitPrice || 0),
      0
    );

  }


  const dayTotal =
    data.stores.reduce(
      (sum,s) =>
        sum + storeTotal(s),
      0
    );


  function addItem(e) {

    e.preventDefault();

    if(!store) return;

    if(!product.trim()) return;

    const q =
      Number(qty);

    const p =
      Number(price);

    if(!q || q <= 0) return;

    if(
      isNaN(p) ||
      p < 0
    ) return;


    const item = {

      id:
        Date.now().toString() +
        Math.random()
          .toString(36)
          .slice(2),

      product:
        product.trim(),

      qty:q,

      unitPrice:p

    };


    const next =
      cloneData(data);

    if(!next.purchaseEntries[date])
      next.purchaseEntries[date] = {};

    if(!next.purchaseEntries[date][store])
      next.purchaseEntries[date][store] = [];


    next.purchaseEntries[date][store]
      .push(item);


    save(next);

    setProduct("");

    setQty("1");

    setPrice("");

  }


  function removeItem(id) {

    if(!store) return;

    const next =
      cloneData(data);

    next.purchaseEntries[date][store] =
      (
        next.purchaseEntries[date][store]
        || []
      ).filter(
        x => x.id !== id
      );

    save(next);

  }


  function lockStore() {

    const next =
      cloneData(data);

    if(!next.purchaseLocks[date])
      next.purchaseLocks[date] = {};

    next.purchaseLocks[date][store] =
      true;

    save(next);

  }


  function unlockStore() {

    const next =
      cloneData(data);

    if(!next.purchaseLocks[date])
      next.purchaseLocks[date] = {};

    next.purchaseLocks[date][store] =
      false;

    save(next);

  }


  function addStore() {

    const name =
      newStore.trim();

    if(!name) return;

    if(
      data.stores
        .some(
          x =>
            x.toLowerCase() ===
            name.toLowerCase()
        )
    ) return;


    const next =
      cloneData(data);

    next.stores.push(name);

    save(next);

    setNewStore("");

  }


  function deleteStore(name) {

    if(!confirm(
      `"${name}" mağazasını silmek istediğinize emin misiniz?`
    )) return;

    const next =
      cloneData(data);

    next.stores =
      next.stores.filter(
        x => x !== name
      );

    delete next.purchaseEntries[date]?.[name];

    delete next.purchaseLocks[date]?.[name];

    save(next);

    setStore(null);

  }


  if(store) {

    const locked =
      !!locks[store];

    const items =
      entries[store] || [];


    return (

      <div>

        <button
          onClick={() =>
            setStore(null)
          }
          style={{
            border:0,
            background:"transparent",
            color:"#6b6862",
            display:"flex",
            alignItems:"center",
            gap:4,
            marginBottom:14,
            fontSize:12
          }}
        >

          <Icon
            name="chevron-left"
            size={16}
          />

          Mağazalara Dön

        </button>


        <div
          style={{
            display:"flex",
            justifyContent:"space-between",
            alignItems:"center",
            marginBottom:14
          }}
        >

          <h2
            style={{
              margin:0,
              fontSize:17,
              fontWeight:800
            }}
          >
            {store}

            {locked && (
              <Icon
                name="lock"
                size={14}
              />
            )}

          </h2>


          {isAdmin && (

            <div
              style={{
                display:"flex",
                gap:12
              }}
            >

              {locked && (

                <button
                  onClick={unlockStore}
                  style={{
                    border:0,
                    background:"transparent",
                    color:"#1c6b4e",
                    fontSize:11,
                    fontWeight:700
                  }}
                >

                  Kilidi Aç

                </button>

              )}


              <button
                onClick={() =>
                  deleteStore(store)
                }
                style={{
                  border:0,
                  background:"transparent",
                  color:"#a8a49a",
                  fontSize:11
                }}
              >
                Sil
              </button>

            </div>

          )}

        </div>


        {!locked && (

          <form
            onSubmit={addItem}
            className="card"
            style={{
              padding:15,
              marginBottom:14
            }}
          >

            <div
              className="form-grid"
              style={{
                display:"grid",
                gridTemplateColumns:
                  "2fr 1fr 1fr",
                gap:9,
                marginBottom:10
              }}
            >

              <Field
                label="Ürün"
                value={product}
                onChange={setProduct}
                placeholder="Örn. Un"
              />

              <Field
                label="Miktar"
                type="number"
                value={qty}
                onChange={setQty}
              />

              <Field
                label="Birim Fiyat"
                type="number"
                value={price}
                onChange={setPrice}
                placeholder="0"
              />

            </div>


            <button
              type="submit"
              style={{
                width:"100%",
                padding:11,
                border:0,
                borderRadius:9,
                background:"#1c1b19",
                color:"white",
                fontWeight:700,
                fontSize:12
              }}
            >

              <Icon
                name="plus"
                size={15}
              />

              Ürün Ekle

            </button>

          </form>

        )}


        {locked && !isAdmin && (

          <div
            style={{
              padding:12,
              background:"#f1efe9",
              borderRadius:11,
              marginBottom:13,
              fontSize:12,
              color:"#6b6862",
              display:"flex",
              gap:8
            }}
          >

            <Icon
              name="lock"
              size={16}
            />

            Bu kayıt onaylandı ve
            değiştirilemez.

          </div>

        )}


        <div
          style={{
            display:"flex",
            flexDirection:"column",
            gap:8
          }}
        >

          {items.map(item => (

            <div
              key={item.id}
              className="card"
              style={{
                padding:12,
                display:"flex",
                justifyContent:"space-between",
                alignItems:"center"
              }}
            >

              <div>

                <div
                  style={{
                    fontWeight:700,
                    fontSize:12
                  }}
                >
                  {item.product}
                </div>

                <div
                  style={{
                    color:"#6b6862",
                    fontSize:11,
                    marginTop:3
                  }}
                >
                  {item.qty}
                  {" × "}
                  {money(item.unitPrice)}
                </div>

              </div>


              <div
                style={{
                  display:"flex",
                  alignItems:"center",
                  gap:10
                }}
              >

                <b
                  style={{
                    fontSize:12
                  }}
                >
                  {money(
                    item.qty *
                    item.unitPrice
                  )}
                </b>


                {!locked && (

                  <button
                    onClick={() =>
                      removeItem(item.id)
                    }
                    style={{
                      border:0,
                      background:"transparent",
                      color:"#aaa69d"
                    }}
                  >

                    <Icon
                      name="trash-2"
                      size={16}
                    />

                  </button>

                )}

              </div>

            </div>

          ))}

        </div>


        <div
          className="dark-card"
          style={{
            marginTop:12,
            padding:14,
            display:"flex",
            justifyContent:"space-between"
          }}
        >

          <span
            style={{
              color:"#c7c4bb",
              fontSize:11
            }}
          >
            {store} Toplamı
          </span>

          <b>
            {money(
              storeTotal(store)
            )}
          </b>

        </div>


        {!locked &&
          !isAdmin &&
          items.length > 0 && (

          <button
            onClick={lockStore}
            style={{
              width:"100%",
              marginTop:12,
              padding:12,
              border:0,
              borderRadius:10,
              background:"#b4432e",
              color:"white",
              fontWeight:800,
              fontSize:12
            }}
          >

            <Icon
              name="check-circle"
              size={15}
            />

            Kaydet ve Onayla

          </button>

        )}

      </div>

    );

  }


  return (

    <div>

      <DateSelector
        value={date}
        onChange={setDate}
      />


      <div
        className="dark-card"
        style={{
          padding:16,
          marginBottom:13,
          display:"flex",
          justifyContent:"space-between",
          alignItems:"center"
        }}
      >

        <span
          style={{
            fontSize:12,
            color:"#c7c4bb"
          }}
        >
          Günün Alış Toplamı
        </span>

        <b>
          {money(dayTotal)}
        </b>

      </div>


      <div
        style={{
          display:"flex",
          flexDirection:"column",
          gap:8
        }}
      >

        {data.stores.map(s => {

          const items =
            entries[s] || [];

          const total =
            storeTotal(s);

          const locked =
            !!locks[s];


          return (

            <button
              key={s}
              onClick={() =>
                setStore(s)
              }
              className="card"
              style={{
                width:"100%",
                border:"1px solid #e4e1d8",
                padding:14,
                display:"flex",
                alignItems:"center",
                justifyContent:"space-between",
                textAlign:"left"
              }}
            >

              <div
                style={{
                  display:"flex",
                  alignItems:"center",
                  gap:11
                }}
              >

                <div
                  style={{
                    width:37,
                    height:37,
                    borderRadius:10,
                    background:"#eaf3ee",
                    color:"#1c6b4e",
                    display:"flex",
                    alignItems:"center",
                    justifyContent:"center"
                  }}
                >

                  <Icon
                    name="store"
                    size={18}
                  />

                </div>


                <div>

                  <div
                    style={{
                      fontWeight:700,
                      fontSize:12,
                      display:"flex",
                      alignItems:"center",
                      gap:5
                    }}
                  >

                    {s}

                    {locked && (
                      <Icon
                        name="lock"
                        size={12}
                      />
                    )}

                  </div>

                  <div
                    style={{
                      fontSize:11,
                      color:"#6b6862",
                      marginTop:3
                    }}
                  >
                    {
                      items.length
                        ? `${items.length} ürün`
                        : "Ürün yok"
                    }
                  </div>

                </div>

              </div>


              <b
                style={{
                  fontSize:12
                }}
              >
                {money(total)}
              </b>

            </button>

          );

        })}

      </div>


      {isAdmin && (

        <div
          className="card"
          style={{
            marginTop:12,
            padding:13,
            display:"flex",
            gap:8
          }}
        >

          <input
            value={newStore}
            onChange={e =>
              setNewStore(e.target.value)
            }
            placeholder="Yeni mağaza adı"
            style={{
              flex:1,
              minWidth:0,
              border:"1px solid #e4e1d8",
              borderRadius:9,
              padding:10,
              fontSize:12,
              outline:"none"
            }}
          />

          <button
            onClick={addStore}
            style={{
              border:0,
              borderRadius:9,
              background:"#1c1b19",
              color:"white",
              padding:"0 15px",
              fontWeight:700,
              fontSize:11
            }}
          >
            Ekle
          </button>

        </div>

      )}

    </div>

  );

}


/* =========================
   SATIŞ
========================= */

function Satis({
  data,
  save,
  isAdmin
}) {

  const [date,setDate] =
    useState(todayISO());

  const [confirm,setConfirm] =
    useState(false);


  const rows =
    SALE_PRODUCTS.map(product => {

      const r =
        data.salesEntries[date]?.[product]
        || {
          qty:"",
          unitPrice:""
        };

      const qty =
        Number(r.qty) || 0;

      const price =
        Number(r.unitPrice) || 0;

      return {
        product,
        qty:r.qty ?? "",
        unitPrice:r.unitPrice ?? "",
        total:qty * price
      };

    });


  const total =
    rows.reduce(
      (sum,r) =>
        sum + r.total,
      0
    );


  const locked =
    !!data.salesLocks[date];


  function update(
    product,
    field,
    value
  ) {

    if(
      locked &&
      !isAdmin
    ) return;


    const next =
      cloneData(data);

    if(!next.salesEntries[date])
      next.salesEntries[date] = {};

    if(!next.salesEntries[date][product])
      next.salesEntries[date][product] = {
        qty:"",
        unitPrice:""
      };


    next.salesEntries[date][product][field] =
      value;


    save(next);

  }


  function lock() {

    const next =
      cloneData(data);

    next.salesLocks[date] =
      true;

    save(next);

  }


  function unlock() {

    const next =
      cloneData(data);

    next.salesLocks[date] =
      false;

    save(next);

  }


  const hasEntry =
    rows.some(
      r => Number(r.qty) > 0
    );


  return (

    <div>

      <DateSelector
        value={date}
        onChange={setDate}
      />


      <div
        className="dark-card"
        style={{
          padding:15,
          marginBottom:13,
          display:"flex",
          justifyContent:"space-between"
        }}
      >

        <span
          style={{
            color:"#c7c4bb",
            fontSize:12
          }}
        >
          Günün Satış Toplamı
        </span>

        <b>
          {money(total)}
        </b>

      </div>


      {locked && !isAdmin && (

        <div
          style={{
            padding:12,
            background:"#f1efe9",
            border:"1px solid #e4e1d8",
            borderRadius:11,
            marginBottom:12,
            fontSize:12,
            color:"#6b6862"
          }}
        >

          <Icon
            name="lock"
            size={15}
          />

          Bu günün satışları
          onaylandı.

        </div>

      )}


      {isAdmin && locked && (

        <button
          onClick={unlock}
          style={{
            border:0,
            background:"transparent",
            color:"#1c6b4e",
            fontWeight:700,
            fontSize:11,
            marginBottom:10
          }}
        >
          Kilidi Kaldır
        </button>

      )}


      <div className="card table-wrap">

        <table className="sales-table">

          <thead>

            <tr>

              <th>Ürün</th>

              <th style={{textAlign:"right"}}>
                Adet
              </th>

              <th style={{textAlign:"right"}}>
                Birim F.
              </th>

              <th style={{textAlign:"right"}}>
                Toplam
              </th>

            </tr>

          </thead>


          <tbody>

            {rows.map((r,i) => (

              <tr key={r.product}>

                <td
                  style={{
                    fontWeight:600
                  }}
                >
                  {r.product}
                </td>


                <td>

                  <input
                    type="number"
                    min="0"
                    value={r.qty}
                    placeholder="0"
                    disabled={
                      locked &&
                      !isAdmin
                    }
                    onChange={e =>
                      update(
                        r.product,
                        "qty",
                        e.target.value
                      )
                    }
                    style={{
                      textAlign:"right"
                    }}
                  />

                </td>


                <td>

                  <input
                    type="number"
                    min="0"
                    step="0.01"
                    value={r.unitPrice}
                    placeholder="0"
                    disabled={
                      locked &&
                      !isAdmin
                    }
                    onChange={e =>
                      update(
                        r.product,
                        "unitPrice",
                        e.target.value
                      )
                    }
                    style={{
                      textAlign:"right"
                    }}
                  />

                </td>


                <td
                  style={{
                    textAlign:"right",
                    fontWeight:800
                  }}
                >
                  {money(r.total)}
                </td>

              </tr>

            ))}

          </tbody>

        </table>

      </div>


      {!locked &&
        !isAdmin &&
        hasEntry && (

        <div
          style={{
            marginTop:13,
            padding:14,
            background:"#fff9ec",
            border:"1px solid #e9ddb8",
            borderRadius:12
          }}
        >

          <label
            style={{
              display:"flex",
              gap:8,
              fontSize:12,
              color:"#7a6a2e"
            }}
          >

            <input
              type="checkbox"
              checked={confirm}
              onChange={e =>
                setConfirm(
                  e.target.checked
                )
              }
            />

            Bu kayıt onaylandıktan sonra
            değiştirilemeyecek. Onaylıyor
            musunuz?

          </label>


          <button
            disabled={!confirm}
            onClick={lock}
            style={{
              width:"100%",
              marginTop:11,
              padding:11,
              border:0,
              borderRadius:9,
              background:
                confirm
                  ? "#1c1b19"
                  : "#d8d4c8",
              color:"white",
              fontWeight:800,
              fontSize:12
            }}
          >

            Kaydet ve Onayla

          </button>

        </div>

      )}

    </div>

  );

}


/* =========================
   MALİYET
========================= */

function Maliyet({
  data,
  save
}) {

  function update(
    product,
    field,
    value
  ) {

    const next =
      cloneData(data);

    if(!next.costs[product])
      next.costs[product] = {
        cost:"",
        price:""
      };


    next.costs[product][field] =
      value;

    save(next);

  }


  return (

    <div>

      <div
        className="card table-wrap"
      >

        <table className="sales-table">

          <thead>

            <tr>

              <th>Ürün</th>

              <th>Maliyet</th>

              <th>Satış</th>

              <th>Kâr</th>

              <th>%</th>

            </tr>

          </thead>


          <tbody>

            {SALE_PRODUCTS.map(p => {

              const c =
                data.costs[p]
                || {
                  cost:"",
                  price:""
                };

              const cost =
                Number(c.cost) || 0;

              const price =
                Number(c.price) || 0;

              const profit =
                price - cost;

              const pct =
                price > 0
                  ? profit / price * 100
                  : 0;


              return (

                <tr key={p}>

                  <td
                    style={{
                      fontWeight:700
                    }}
                  >
                    {p}
                  </td>

                  <td>

                    <input
                      type="number"
                      min="0"
                      step="0.01"
                      value={c.cost}
                      onChange={e =>
                        update(
                          p,
                          "cost",
                          e.target.value
                        )
                      }
                    />

                  </td>

                  <td>

                    <input
                      type="number"
                      min="0"
                      step="0.01"
                      value={c.price}
                      onChange={e =>
                        update(
                          p,
                          "price",
                          e.target.value
                        )
                      }
                    />

                  </td>

                  <td
                    style={{
                      fontWeight:800,
                      color:"#1c6b4e"
                    }}
                  >
                    {money(profit)}
                  </td>

                  <td
                    style={{
                      fontWeight:800,
                      color:"#1c6b4e"
                    }}
                  >
                    {pct.toFixed(0)}%
                  </td>

                </tr>

              );

            })}

          </tbody>

        </table>

      </div>

    </div>

  );

}


/* =========================
   KAR ZARAR
========================= */

function KarZarar({
  data
}) {

  const [month,setMonth] =
    useState(monthISO());


  const stats =
    useMemo(() => {

      let purchases = 0;

      Object.entries(
        data.purchaseEntries || {}
      ).forEach(
        ([date,stores]) => {

          if(
            !date.startsWith(month)
          ) return;

          Object.values(
            stores || {}
          ).forEach(items => {

            (items || [])
              .forEach(item => {

                purchases +=
                  Number(item.qty || 0) *
                  Number(item.unitPrice || 0);

              });

          });

        }
      );


      let sales = 0;

      Object.entries(
        data.salesEntries || {}
      ).forEach(
        ([date,products]) => {

          if(
            !date.startsWith(month)
          ) return;

          Object.values(
            products || {}
          ).forEach(row => {

            sales +=
              Number(row.qty || 0) *
              Number(row.unitPrice || 0);

          });

        }
      );


      return {
        purchases,
        sales,
        net:sales-purchases
      };

    },[
      data,
      month
    ]);


  return (

    <div>

      <div
        className="card"
        style={{
          padding:13,
          marginBottom:13,
          display:"flex",
          alignItems:"center",
          gap:9
        }}
      >

        <Icon
          name="calendar"
          size={17}
        />

        <input
          type="month"
          value={month}
          onChange={e =>
            setMonth(
              e.target.value
            )
          }
          style={{
            border:0,
            outline:0,
            background:"transparent",
            flex:1,
            fontSize:12
          }}
        />

        <span
          style={{
            color:"#77736b",
            fontSize:11
          }}
        >
          {monthLabel(month)}
        </span>

      </div>


      <div
        className="mobile-grid-2"
        style={{
          display:"grid",
          gridTemplateColumns:
            "1fr 1fr",
          gap:10
        }}
      >

        <Stat
          title="Toplam Satış"
          value={money(stats.sales)}
          icon="trending-up"
        />

        <Stat
          title="Toplam Alış"
          value={money(stats.purchases)}
          icon="shopping-bag"
        />

      </div>


      <div
        className="dark-card"
        style={{
          marginTop:10,
          padding:18
        }}
      >

        <div
          style={{
            color:"#aaa69d",
            fontSize:11,
            marginBottom:5
          }}
        >
          Net Kâr / Nakit Akışı
        </div>

        <div
          style={{
            fontSize:24,
            fontWeight:900
          }}
        >
          {money(stats.net)}
        </div>

      </div>

    </div>

  );

}

    if(data.users[u]) {

      alert(
        "Bu kullanıcı zaten var."
      );

      return;
    }


    const next =
      cloneData(data);

    next.users[u] = {
      password:p,
      role:"user"
    };

    save(next);

    setUsername("");

    setPassword("");

  }


  function deleteUser(name) {

    if(!confirm(
      `"${name}" kullanıcısı silinsin mi?`
    )) return;

    const next =
      cloneData(data);

    delete next.users[name];

    save(next);

  }


  return (

    <div>

      <form
        onSubmit={createUser}
        className="card"
        style={{
          padding:15,
          marginBottom:13
        }}
      >

        <div
          style={{
            fontWeight:800,
            fontSize:13,
            marginBottom:11
          }}
        >

          <Icon
            name="user-plus"
            size={16}
          />

          Yeni Kullanıcı

        </div>


        <div
          className="mobile-grid-1"
          style={{
            display:"grid",
            gridTemplateColumns:
              "1fr 1fr",
            gap:9
          }}
        >

          <input
            value={username}
            autoCapitalize="none"
            placeholder="Kullanıcı adı"
            onChange={e =>
              setUsername(
                e.target.value
              )
            }
            style={{
              border:"1px solid #e4e1d8",
              borderRadius:9,
              padding:11,
              outline:"none",
              fontSize:12
            }}
          />

          <input
            value={password}
            placeholder="Şifre"
            onChange={e =>
              setPassword(
                e.target.value
              )
            }
            style={{
              border:"1px solid #e4e1d8",
              borderRadius:9,
              padding:11,
              outline:"none",
              fontSize:12
            }}
          />

        </div>


        <button
          type="submit"
          style={{
            width:"100%",
            marginTop:10,
            padding:11,
            border:0,
            borderRadius:9,
            background:"#1c1b19",
            color:"white",
            fontWeight:800,
            fontSize:12
          }}
        >
          Kullanıcı Oluştur
        </button>

      </form>


      <div
        style={{
          display:"flex",
          flexDirection:"column",
          gap:8
        }}
      >

        {Object.entries(
          data.users || {}
        ).map(
          ([name,u]) => (

          <div
            key={name}
            className="card"
            style={{
              padding:13,
              display:"flex",
              justifyContent:"space-between",
              alignItems:"center"
            }}
          >

            <div>

              <div
                style={{
                  fontSize:12,
                  fontWeight:800
                }}
              >
                {name}
              </div>

              <div
                style={{
                  marginTop:3,
                  fontSize:10,
                  color:"#6b6862"
                }}
              >
                {u.role === "admin"
                  ? "Yönetici"
                  : "Kullanıcı"}
              </div>

            </div>


            {u.role !== "admin" && (

              <button
                onClick={() =>
                  deleteUser(name)
                }
                style={{
                  border:0,
                  background:"transparent",
                  color:"#a8a49a"
                }}
              >

                <Icon
                  name="trash-2"
                  size={17}
                />

              </button>

            )}

          </div>

        ))}

      </div>

    </div>

  );

}


/* =========================
   COMPONENTS
========================= */

function Field({
  label,
  value,
  onChange,
  type="text",
  placeholder=""
}) {

  return (

    <label>

      <span
        style={{
          display:"block",
          color:"#6b6862",
          fontSize:10,
          marginBottom:4
        }}
      >
        {label}
      </span>

      <input
        type={type}
        value={value}
        placeholder={placeholder}
        min={
          type === "number"
            ? "0"
            : undefined
        }
        step={
          type === "number"
            ? "0.01"
            : undefined
        }
        onChange={e =>
          onChange(
            e.target.value
          )
        }
        style={{
          width:"100%",
          border:"1px solid #e4e1d8",
          background:"#fcfcfa",
          borderRadius:8,
          padding:9,
          outline:"none",
          fontSize:12
        }}
      />

    </label>

  );

}


function DateSelector({
  value,
  onChange
}) {

  return (

    <div
      className="card"
      style={{
        padding:11,
        marginBottom:13,
        display:"flex",
        alignItems:"center",
        gap:8
      }}
    >

      <Icon
        name="calendar"
        size={16}
      />

      <input
        type="date"
        value={value}
        onChange={e =>
          onChange(
            e.target.value
          )
        }
        style={{
          border:0,
          outline:0,
          background:"transparent",
          fontSize:12,
          flex:1,
          minWidth:0
        }}
      />

      <span
        className="desktop-only"
        style={{
          color:"#aaa69d",
          fontSize:11
        }}
      >
        {dateLabel(value)}
      </span>

    </div>

  );

}


function Stat({
  title,
  value,
  icon
}) {

  return (

    <div
      className="card"
      style={{
        padding:14
      }}
    >

      <div
        style={{
          display:"flex",
          alignItems:"center",
          gap:6,
          color:"#6b6862",
          fontSize:10,
          marginBottom:7
        }}
      >

        <Icon
          name={icon}
          size={14}
        />

        {title}

      </div>

      <div
        className="stat-number"
        style={{
          fontWeight:900,
          fontSize:17
        }}
      >
        {value}
      </div>

    </div>

  );

}

      display:flex;
      align-items:center;
      justify-content:center;
      background:#1c1b19;
      color:white;
      padding:30px;
      text-align:center;
      font-family:Arial;
    ">

      <div>

        <h2>Mano Pizza</h2>

        <p style="color:#aaa">
          Uygulama başlatılamadı.
        </p>

        <small style="color:#b4432e">
          ${error.message}
        </small>

      </div>

    </div>

  `;

}

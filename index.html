/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function todayISO() {
  return new Date().toISOString().slice(0,10);
}

function monthISO() {
  return new Date().toISOString().slice(0,7);
}

function formatTL(value) {

  return new Intl.NumberFormat("tr-TR", {
    style: "currency",
    currency: "TRY",
    maximumFractionDigits: 2
  }).format(Number(value) || 0);

}

function formatDate(date) {

  if (!date) return "";

  return new Date(
    date + "T00:00:00"
  ).toLocaleDateString(
    "tr-TR",
    {
      day: "numeric",
      month: "long",
      year: "numeric",
      weekday: "long"
    }
  );

}

function formatMonth(month) {

  if (!month) return "";

  return new Date(
    month + "-01T00:00:00"
  ).toLocaleDateString(
    "tr-TR",
    {
      month: "long",
      year: "numeric"
    }
  );

}

     FIREBASE ANLIK DİNLEME
  ------------------------------------------- */

  useEffect(() => {

    const unsubscribe = DATA_REF.onSnapshot(

      snapshot => {

        if (snapshot.exists) {

          const serverData = snapshot.data();

          const merged = {
            ...EMPTY_DATA,
            ...serverData,

            stores:
              Array.isArray(serverData.stores)
                ? serverData.stores
                : DEFAULT_STORES,

            purchaseEntries:
              serverData.purchaseEntries || {},

            purchaseLocks:
              serverData.purchaseLocks || {},

            salesEntries:
              serverData.salesEntries || {},

            salesLocks:
              serverData.salesLocks || {},

            costs:
              serverData.costs || {},

            users: {
              ...EMPTY_DATA.users,
              ...(serverData.users || {})
            }
          };

          setData(merged);

        } else {

          DATA_REF
            .set(EMPTY_DATA)
            .then(() => {
              setData(EMPTY_DATA);
            })
            .catch(err => {
              console.error(err);
              setError(
                "Firebase ilk kayıt oluşturulamadı."
              );
            });

        }

        setLoading(false);

      },

      error => {

        console.error(error);

        setError(
          "Firebase bağlantısı kurulamadı. Firestore kurallarını kontrol edin."
        );

        setLoading(false);

      }

    );

    return () => unsubscribe();

  }, []);


  /* -------------------------------------------
     İKONLARI YENİLE
  ------------------------------------------- */

  useEffect(() => {

    /*
      React her render sonrası ikonları tekrar oluşturur.
    */

  }, [tab,menuOpen,user]);


  /* -------------------------------------------
     GÜVENLİ KAYDETME
  ------------------------------------------- */

  async function persist(updater) {

    setError("");

    setSaved(false);

    try {

      /*
        Önce Firebase'deki en güncel belgeyi alıyoruz.
        Böylece iki cihaz aynı anda işlem yaptığında
        eski state'in yeni veriyi ezme ihtimali azalıyor.
      */

      const snap = await DATA_REF.get();

      const current = snap.exists
        ? {
            ...EMPTY_DATA,
            ...snap.data()
          }
        : EMPTY_DATA;

      const next =
        typeof updater === "function"
          ? updater(current)
          : updater;

      await DATA_REF.set(
        next,
        {
          merge: true
        }
      );

      setData(next);

      setSaved(true);

      setTimeout(() => {
        setSaved(false);
      }, 1800);

    } catch (err) {

      console.error(err);

      setError(
        "Kaydedilemedi. Firebase bağlantısını veya Firestore kurallarını kontrol edin."
      );

    }

      >

        <div

          <div

        {error && (

        {/* SAYFALAR */}

        {tab==="dashboard" && (
          <Dashboard
            data={data}
            setTab={setTab}
          />
        )}

        {tab==="alis" && (
          <Alis

        {tab==="satis" && (

          />
        )}

        {tab==="maliyet" && isAdmin && (

        {tab==="karzarar" && isAdmin && (

        {tab==="yonetici" && isAdmin && (

}


/* =========================================================
   LOGIN
========================================================= */

function Login({users,onLogin}) {

  const [username,setUsername] = useState("");

  const [password,setPassword] = useState("");

  const [error,setError] = useState("");

  function submit(e) {

    e.preventDefault();

    const name = username.trim();

    const account = users[name];

    if (
      account &&
      account.password === password
    ) {

      onLogin({
        username:name,
        role:account.role
      });

    } else {

      setError(
        "Kullanıcı adı veya şifre hatalı."
      );

    }

  }


  return (

    <div
      style={{
        minHeight:"100vh",
        background:"#1c1b19",
        display:"flex",
        alignItems:"center",
        justifyContent:"center",
        padding:20
      }}
    >

      <div
        style={{
          width:"100%",
          maxWidth:360,
          textAlign:"center"
        }}
      >

        <div
          style={{
            width:75,
            height:75,
            borderRadius:20,
            background:"#b4432e",
            margin:"0 auto 18px",
            display:"flex",
            alignItems:"center",
            justifyContent:"center",
            fontSize:38
          }}
        >
          🍕
        </div>

        <h1
          style={{
            color:"#fff",
            margin:"0 0 5px",
            fontSize:26
          }}
        >
          Mano Pizza
        </h1>

        <p
          style={{
            color:"#aaa69c",
            margin:"0 0 30px",
            fontSize:13
          }}
        >
          İşletme Yönetim Paneli
        </p>


        <form onSubmit={submit}>

          <input
            value={username}
            onChange={e => setUsername(e.target.value)}
            placeholder="Kullanıcı adı"
            autoCapitalize="none"
            style={loginInput}
          />

          <input
            type="password"
            value={password}
            onChange={e => setPassword(e.target.value)}

          />

          {error && (

            <div

                marginBottom:12

          )}

          <button
            type="submit"

              width:"100%",

/* =========================================================
   DASHBOARD
========================================================= */

function Dashboard({data,setTab}) {

  const today = todayISO();

  const todayPurchases =
    data.purchaseEntries[today] || {};

  const todaySales =
    data.salesEntries[today] || {};


  let purchaseTotal = 0;

  Object.values(todayPurchases).forEach(items => {

    (items || []).forEach(item => {

      purchaseTotal +=
        Number(item.qty || 0) *
        Number(item.unitPrice || 0);

    });

  });


  let salesTotal = 0;

  Object.values(todaySales).forEach(row => {

/* =========================================================
   ALIŞLAR
========================================================= */

function Alis({data,persist,isAdmin}) {

  const [date,setDate] =
    useState(todayISO());

  const [activeStore,setActiveStore] =
    useState(null);

  const [form,setForm] =
    useState({
      product:"",
      qty:"1",
      unitPrice:""
    });

  const [newStore,setNewStore] =
    useState("");

  const [addStore,setAddStore] =
    useState(false);


  const entries =
    data.purchaseEntries[date] || {};

  const locks =
    data.purchaseLocks[date] || {};


  function total(store) {

    return (entries[store] || [])
      .reduce(
        (sum,item) =>
          sum +
          Number(item.qty || 0) *
          Number(item.unitPrice || 0),
        0
      );

  }


  function addItem(e) {

    e.preventDefault();

    if (!activeStore) return;

    const product =
      form.product.trim();

    const qty =
      Number(form.qty);

    const price =
      Number(form.unitPrice);

    if (
      !product ||
      qty <= 0 ||
      price < 0 ||
      isNaN(price)
    ) return;


    const item = {
      id:
        Date.now().toString() +
        Math.random().toString(36).slice(2),

      product,
      qty,
      unitPrice:price
    };


    persist(current => {

      const currentEntries =
        current.purchaseEntries[date] || {};

      const storeItems =
        currentEntries[activeStore] || [];

      return {
        ...current,

        purchaseEntries:{
          ...current.purchaseEntries,

          [date]:{
            ...currentEntries,

            [activeStore]:[
              ...storeItems,
              item
            ]
          }
        }
      };

    });


    setForm({
      product:"",
      qty:"1",
      unitPrice:""
    });

  }


  function deleteItem(id) {

    persist(current => {

      const currentEntries =
        current.purchaseEntries[date] || {};

      const items =
        currentEntries[activeStore] || [];

      return {

        ...current,

        purchaseEntries:{
          ...current.purchaseEntries,

          [date]:{
            ...currentEntries,

            [activeStore]:
              items.filter(
                item => item.id !== id
              )
          }
        }

      };

    });

  }


  function lockStore() {

    persist(current => {

      const currentLocks =
        current.purchaseLocks[date] || {};

      return {

        ...current,

        purchaseLocks:{
          ...current.purchaseLocks,

          [date]:{
            ...currentLocks,
            [activeStore]:true
          }
        }

      };

    });

  }


  function unlockStore() {

    persist(current => {

      const currentLocks =
        current.purchaseLocks[date] || {};

      return {

        ...current,

        purchaseLocks:{
          ...current.purchaseLocks,

          [date]:{
            ...currentLocks,
            [activeStore]:false
          }
        }

      };

    });

  }


  function createStore() {

    const name =
      newStore.trim();

    if (
      !name ||
      data.stores.includes(name)
    ) return;


    persist(current => ({

      ...current,

      stores:[
        ...current.stores,
        name
      ]

    }));


    setNewStore("");
    setAddStore(false);

  }


  function deleteStore(store) {

    if (
      !confirm(
        `"${store}" mağazasını silmek istediğinize emin misiniz?`
      )
    ) return;


    persist(current => {

      const stores =
        current.stores.filter(
          s => s !== store
        );

      const day =
        current.purchaseEntries[date] || {};

      const {
        [store]:removed,
        ...remaining
      } = day;


      return {

        ...current,

        stores,

        purchaseEntries:{
          ...current.purchaseEntries,
          [date]:remaining
        }

      };

    });


    setActiveStore(null);

  }


  /* MAĞAZA DETAY */

  if (activeStore) {

    const locked =
      !!locks[activeStore];

    const items =
      entries[activeStore] || [];


    return (

      <div>

        <DateBar
          date={date}
          setDate={setDate}
        />

        <button
          onClick={() => setActiveStore(null)}
          style={backButton}
        >
          ‹ Mağazalara Dön
        </button>


        <div
          style={{
            display:"flex",
            justifyContent:"space-between",
            alignItems:"center",
            marginBottom:12
          }}
        >

          <div
            style={{
              fontSize:18,
              fontWeight:800
            }}
          >
            🏪 {activeStore}
          </div>

          {locked && (
            <span
              style={{
                fontSize:11,
                background:"#f1efe9",
                padding:"6px 9px",
                borderRadius:8
              }}
            >
              🔒 Onaylı
            </span>
          )}

        </div>


        {locked && !isAdmin ? (

          <div style={noticeBox}>
            🔒 Bu kayıt onaylandı ve değiştirilemez.
          </div>

        ) : (

          <form
            onSubmit={addItem}
            style={card}
          >

            <div
              className="mobile-grid-1"
              style={{
                display:"grid",
                gridTemplateColumns:"2fr 1fr 1fr",
                gap:8
              }}
            >

              <Input
                label="Ürün"
                placeholder="Örn. Un"
                value={form.product}
                onChange={v =>
                  setForm({
                    ...form,
                    product:v
                  })
                }
              />

              <Input
                label="Miktar"
                type="number"
                value={form.qty}
                onChange={v =>
                  setForm({
                    ...form,
                    qty:v
                  })
                }
              />

              <Input
                label="Birim Fiyat"
                type="number"
                value={form.unitPrice}
                onChange={v =>
                  setForm({
                    ...form,
                    unitPrice:v
                  })
                }
              />

            </div>


            <button
              type="submit"
              style={primaryButton}
            >
              + Ürün Ekle
            </button>

          </form>

        )}


        <div
          style={{
            display:"flex",
            flexDirection:"column",
            gap:8
          }}
        >

          {items.map(item => (

            <div
              key={item.id}
              style={card}
            >

              <div>

                <div
                  style={{
                    fontWeight:700,
                    fontSize:13
                  }}
                >
                  {item.product}
                </div>

                <div
                  style={{
                    color:"#77736b",
                    fontSize:11,
                    marginTop:3
                  }}
                >
                  {item.qty} × {formatTL(item.unitPrice)}
                </div>

              </div>


              <div
                style={{
                  display:"flex",
                  alignItems:"center",
                  gap:10
                }}
              >

                <strong>
                  {formatTL(
                    item.qty *
                    item.unitPrice
                  )}
                </strong>

                {!locked && (

                  <button
                    onClick={() =>
                      deleteItem(item.id)
                    }
                    style={deleteButton}
                  >
                    🗑
                  </button>

                )}

              </div>

            </div>

          ))}

        </div>


        <TotalBox
          title="Mağaza Toplamı"
          value={total(activeStore)}
        />


        {!locked && !isAdmin && items.length > 0 && (

          <button
            onClick={lockStore}
            style={{
              ...primaryButton,
              marginTop:10
            }}
          >
            ✓ Kaydet ve Onayla
          </button>

        )}


        {locked && isAdmin && (

          <button
            onClick={unlockStore}
            style={{
              ...secondaryButton,
              marginTop:10
            }}
          >
            🔓 Kilidi Kaldır
          </button>

        )}


        {isAdmin && (

          <button
            onClick={() => deleteStore(activeStore)}
            style={{
              ...secondaryButton,
              color:"#b4432e",
              marginTop:10
            }}
          >
            🗑 Mağazayı Sil
          </button>

        )}

      </div>

    );

  }


  /* MAĞAZALAR */

  const dayTotal =
    data.stores.reduce(
      (sum,store) =>
        sum + total(store),
      0
    );


  return (

    <div>

      <DateBar
        date={date}
        setDate={setDate}
      />


      <TotalBox
        title="Günün Alış Toplamı"
        value={dayTotal}
      />


      <div
        style={{
          display:"flex",
          flexDirection:"column",
          gap:9,
          marginTop:12
        }}
      >

        {data.stores.map(store => (

          <button
            key={store}
            onClick={() =>
              setActiveStore(store)
            }
            style={{
              ...storeButton,
              cursor:"pointer"
            }}
          >

            <div
              style={{
                display:"flex",
                alignItems:"center",
                gap:12
              }}
            >

              <div
                style={storeIcon}
              >
                🏪
              </div>

              <div
                style={{
                  textAlign:"left"
                }}
              >

                <div
                  style={{
                    fontWeight:800,
                    fontSize:13
                  }}
                >
                  {store}
                </div>

                <div
                  style={{
                    color:"#77736b",
                    fontSize:10,
                    marginTop:2
                  }}
                >
                  {(entries[store] || []).length}
                  {" "}ürün
                  {locks[store] ? " · 🔒 Onaylı" : ""}
                </div>

              </div>

            </div>


            <strong>
              {formatTL(total(store))}
            </strong>

          </button>

        ))}

      </div>


      {isAdmin && (

        <div style={{marginTop:12}}>

          {!addStore ? (

            <button
              onClick={() =>
                setAddStore(true)
              }
              style={secondaryButton}
            >
              + Yeni Mağaza Ekle
            </button>

          ) : (

            <div
              style={{
                display:"flex",
                gap:7
              }}
            >

              <input
                autoFocus
                value={newStore}
                onChange={e =>
                  setNewStore(e.target.value)
                }
                placeholder="Mağaza adı"
                style={inputStyle}
              />

              <button
                onClick={createStore}
                style={primarySmall}
              >
                Ekle
              </button>

            </div>

          )}

        </div>

      )}

    </div>

  );

}

function CostRow({product,data,persist}) {

  const current =
    data.costs[product] || {
      cost:"",
      price:""
    };


  const cost =
    Number(current.cost || 0);

  const price =
    Number(current.price || 0);

  const profit =
    price - cost;

  const percent =
    price > 0
      ? (profit / price) * 100
      : 0;


  function update(field,value) {

    persist(currentData => {

      const old =
        currentData.costs[product] || {
          cost:"",
          price:""
        };

      return {

        ...currentData,

        costs:{
          ...currentData.costs,

          [product]:{
            ...old,
            [field]:value
          }

        }

      };

    });

  }


  return (

    <div
      style={{
        background:"#fff",
        border:"1px solid #e4e1d8",
        borderRadius:13,
        padding:12
      }}
    >

      <div
        style={{
          fontSize:12,
          fontWeight:800,
          marginBottom:9
        }}
      >
        {product}
      </div>


      <div
        className="mobile-grid-2"
        style={{
          display:"grid",
          gridTemplateColumns:"1fr 1fr",
          gap:7
        }}
      >

        <Input
          label="Maliyet"
          type="number"
          value={current.cost}
          onChange={v =>
            update("cost",v)
          }
        />

        <Input
          label="Satış"
          type="number"
          value={current.price}
          onChange={v =>
            update("price",v)
          }
        />

      </div>


      <div
        style={{
          display:"flex",
          justifyContent:"space-between",
          marginTop:9,
          paddingTop:9,
          borderTop:"1px solid #eeeae2",
          fontSize:11
        }}
      >

        <span>
          Kâr
        </span>

        <strong
          style={{
            color:"#1c6b4e"
          }}
        >
          {formatTL(profit)}
          {" "}
          ({percent.toFixed(0)}%)
        </strong>

      </div>

    </div>

  );

}


/* =========================================================
   KAR ZARAR
========================================================= */

function KarZarar({data}) {

  const [month,setMonth] =
    useState(monthISO());


  let purchases = 0;
  let sales = 0;


  Object.entries(
    data.purchaseEntries || {}
  ).forEach(([date,stores]) => {

    if (!date.startsWith(month)) return;

    Object.values(stores || {})
      .forEach(items => {

        (items || []).forEach(item => {

          purchases +=
            Number(item.qty || 0) *
            Number(item.unitPrice || 0);

        });

      });

  });


  Object.entries(
    data.salesEntries || {}
  ).forEach(([date,rows]) => {

    if (!date.startsWith(month)) return;

    Object.values(rows || {})
      .forEach(row => {

        sales +=
          Number(row.qty || 0) *
          Number(row.unitPrice || 0);

      });

  });


  const net =
    sales - purchases;


  return (

    <div>

      <div style={card}>

        <label
          style={{
            fontSize:10,
            color:"#77736b",
            display:"block",
            marginBottom:5
          }}
        >
          Ay Seç
        </label>

        <input
          type="month"
          value={month}
          onChange={e =>
            setMonth(e.target.value)
          }
          style={inputStyle}
        />

      </div>


      <div
        className="mobile-grid-2"
        style={{
          display:"grid",
          gridTemplateColumns:"1fr 1fr",
          gap:9,
          marginTop:10
        }}
      >

        <StatCard
          title="Toplam Satış"
          value={formatTL(sales)}
          icon="📈"
          positive
        />

        <StatCard
          title="Toplam Alış"
          value={formatTL(purchases)}
          icon="🛒"
        />

      </div>


      <div
        style={{
          background:"#1c1b19",
          color:"#fff",
          borderRadius:15,
          padding:18,
          marginTop:10
        }}
      >

        <div
          style={{
            color:"#aaa69c",
            fontSize:11
          }}
        >
          Net Kâr / Nakit Akışı
        </div>

        <div
          style={{
            fontSize:26,
            fontWeight:800,
            marginTop:5
          }}
        >
          {formatTL(net)}
        </div>

        <div
          style={{
            color:"#aaa69c",
            fontSize:10,
            marginTop:4
          }}
        >
          {formatMonth(month)}
        </div>

      </div>

    </div>

  );

}

    useState("");

    useState("");


  const users =
    data.users || {};

    e.preventDefault();

    const name =
      username.trim();

    const pass =
      password.trim();

    if (
      !name ||
      !pass ||
      users[name]
    ) return;


    persist(current => ({

      ...current,

      users:{
        ...(current.users || {}),

        [name]:{
          password:pass,
          role:"user"
        }

      }

    }));


    setUsername("");
    setPassword("");

    if (
      !confirm(
        `"${name}" kullanıcısını silmek istediğinize emin misiniz?`

      const {

            label="Kullanıcı adı"
            value={username}
            onChange={setUsername}
          />

            label="Şifre"
            type="password"
            value={password}
            onChange={setPassword}
          />

        </div>

          type="submit"
          style={{
            ...primaryButton,
            marginTop:10
          }}
        >
          + Kullanıcı Oluştur

          display:"flex",
          flexDirection:"column",
          gap:8
        }}

                  }}
                >
                  {u.role === "admin"
                    ? "Yönetici"
                    : "Kullanıcı"}
                </div>

              </div>


              {u.role !== "admin" && (

                <button
                  onClick={() =>
                    deleteUser(name)
                  }
                  style={deleteButton}
                >
                  🗑
                </button>

              )}

            </div>

          )
        )}

      </div>

    </div>

  );

}

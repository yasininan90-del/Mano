const ADMIN_USERNAME = "mathrew";

/* =========================================================

let FB = null;

async function initFirebase() {

  FB = await window.firebaseReady;

  const app = FB.initializeApp(firebaseConfig);

  db = FB.getFirestore(app);
}


/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function formatTL(value) {

  return new Intl.NumberFormat("tr-TR", {
    style: "currency",
    currency: "TRY",
    maximumFractionDigits: 2
  }).format(Number(value) || 0);
}


function todayISO() {

  const d = new Date();

  const offset =
    d.getTimezoneOffset() * 60000;

  return new Date(
    d.getTime() - offset
  ).toISOString().slice(0, 10);
}


function thisMonthISO() {

  return todayISO().slice(0, 7);
}


function formatDateLabel(iso) {

  return new Date(
    iso + "T00:00:00"
  ).toLocaleDateString(
    "tr-TR",
    {
      day: "numeric",
      month: "long",
      year: "numeric",
      weekday: "long"
    }
  );
}


function formatMonthLabel(iso) {

  return new Date(
    iso + "-01T00:00:00"
  ).toLocaleDateString(
    "tr-TR",
    {
      month: "long",
      year: "numeric"
    }
  );
}


/* =========================================================
   FIRESTORE PATH YAPISI

   mano_pizza/
      config/main
      users/{username}
      stores/{store}
      purchases/{date_store}
      sales/{date}
      costs/{product}
========================================================= */

const refs = {

  config: () =>
    FB.doc(db, "mano_pizza", "config"),

  user: username =>
    FB.doc(
      db,
      "mano_pizza",
      "users",
      username
    ),

  users: () =>
    FB.collection(
      db,
      "mano_pizza",
      "users"
    ),

  store: name =>
    FB.doc(
      db,
      "mano_pizza",
      "stores",
      encodeURIComponent(name)
    ),

  stores: () =>
    FB.collection(
      db,
      "mano_pizza",
      "stores"
    ),

  purchase: (date, store) =>
    FB.doc(
      db,
      "mano_pizza",
      "purchases",
      `${date}_${encodeURIComponent(store)}`
    ),

  purchases: () =>
    FB.collection(
      db,
      "mano_pizza",
      "purchases"
    ),

  sale: date =>
    FB.doc(
      db,
      "mano_pizza",
      "sales",

    ),

  sales: () =>
    FB.collection(
      db,
      "mano_pizza",
      "sales"
    ),

  cost: product =>
    FB.doc(
      db,
      "mano_pizza",
      "costs",
      encodeURIComponent(product)
    ),

  costs: () =>
    FB.collection(
      db,
      "mano_pizza",
      "costs"
    )
};


/* =========================================================
   LOGIN
========================================================= */

function LoginScreen({ onSuccess }) {

  const [stage, setStage] =
    useState("splash");

  const [username, setUsername] =
    useState("");

  const [password, setPassword] =
    useState("");

  const [error, setError] =
    useState("");

  const [checking, setChecking] =
    useState(false);


  async function login(e) {

    e.preventDefault();

    const u =
      username.trim().toLowerCase();

    const p =
      password;

    if (!u || !p) {

      setError(
        "Kullanıcı adı ve şifre gerekli."
      );

      return;
    }

    setChecking(true);
    setError("");

    try {

      const snap =
        await FB.getDoc(
          refs.user(u)
        );

      if (
        snap.exists() &&
        snap.data().password === p
      ) {

        onSuccess({
          username: u,
          role: snap.data().role
        });

        return;
      }

      /* İlk admin kullanıcısı */

      if (
        u === ADMIN_USERNAME &&
        p === ADMIN_PASSWORD
      ) {

        await FB.setDoc(
          refs.user(u),
          {
            username: u,
            password: p,
            role: "admin",
            createdAt: Date.now()
          },
          { merge: true }
        );

        onSuccess({
          username: u,
          role: "admin"
        });

        return;
      }

      setError(
        "Kullanıcı adı veya şifre hatalı."
      );

      setPassword("");

    } catch (err) {

      console.error(err);

      setError(
        "Bağlantı kurulamadı. İnternet bağlantını kontrol et."
      );

    } finally {

      setChecking(false);

    }
  }


  return (
    <div className="
      min-h-screen
      bg-[#1C1B19]
      flex
      items-center
      justify-center
      px-5
    ">

      <div className="w-full max-w-[360px]">

        <div className="
          w-20 h-20
          rounded-[24px]
          bg-[#B4432E]
          flex
          items-center
          justify-center
          mx-auto
          mb-5
          shadow-2xl
        ">

          <i
            data-lucide="pizza"
            className="w-10 h-10 text-white"
          />

        </div>

        <h1 className="
          text-white
          text-3xl
          font-black
          text-center
          tracking-tight
        ">
          Mano Pizza
        </h1>

        <p className="
          text-[#9C9890]
          text-sm
          text-center
          mt-1
          mb-10
        ">
          İşletme Yönetim Paneli
        </p>


        {stage === "splash" ? (

          <button
            onClick={() => setStage("login")}
            className="
              press
              w-full
              py-4
              rounded-2xl
              bg-[#F7F6F2]
              text-[#1C1B19]
              font-bold
              text-sm
            "
          >
            Panele Giriş Yap
          </button>

        ) : (

          <form
            onSubmit={login}
            className="space-y-4"
          >

            <div>

              <label className="
                block
                text-[11px]
                text-[#9C9890]
                mb-1.5
              ">
                Kullanıcı Adı
              </label>

              <input
                autoFocus
                type="text"
                autoCapitalize="none"
                autoCorrect="off"
                value={username}
                onChange={e =>
                  setUsername(e.target.value)
                }
                className="
                  w-full
                  h-12
                  px-4
                  rounded-xl
                  border
                  border-[#3A3934]
                  bg-[#2A2926]
                  text-white
                  outline-none
                "
              />

            </div>


            <div>

              <label className="
                block
                text-[11px]
                text-[#9C9890]
                mb-1.5
              ">
                Şifre
              </label>

              <input
                type="password"
                value={password}
                onChange={e =>
                  setPassword(e.target.value)
                }
                className="
                  w-full
                  h-12
                  px-4
                  rounded-xl
                  border
                  border-[#3A3934]
                  bg-[#2A2926]
                  text-white
                  outline-none
                "
              />

            </div>


            {error && (

              <div className="
                rounded-xl
                bg-[#42241F]
                border
                border-[#6D352A]
                p-3
                text-xs
                text-[#F0A696]
              ">
                {error}
              </div>

            )}


            <button
              disabled={checking}
              className="
                press
                w-full
                h-12
                rounded-xl
                bg-[#B4432E]
                text-white
                font-bold
                disabled:opacity-50
              "
            >
              {checking
                ? "Kontrol ediliyor..."
                : "Giriş Yap"}
            </button>


            <button
              type="button"
              onClick={() => setStage("splash")}
              className="
                w-full
                text-[#9C9890]
                text-xs
                py-2
              "
            >
              Geri dön
            </button>

          </form>

        )}

      </div>

    </div>
  );
}


/* =========================================================
   KAYIT DURUMU
========================================================= */

function SaveStatus({ status }) {

  if (status === "saving") {

    return (
      <span className="
        inline-flex
        items-center
        gap-1.5
        text-[10px]
        text-[#A16C22]
      ">
        <span className="
          w-1.5 h-1.5
          rounded-full
          bg-[#D29B3D]
          animate-pulse
        />
        Kaydediliyor
      </span>
    );

  }

  if (status === "error") {

    return (
      <span className="
        inline-flex
        items-center
        gap-1.5
        text-[10px]
        text-[#B4432E]
      ">
        <i data-lucide="cloud-off" className="w-3 h-3" />
        Kaydedilemedi
      </span>
    );

  }

  return (
    <span className="
      inline-flex
      items-center
      gap-1.5
      text-[10px]
      text-[#1C6B4E]
    ">
      <i data-lucide="cloud-check" className="w-3 h-3" />
      Buluta kaydedildi
    </span>
  );
}


/* =========================================================
   ANA UYGULAMA
========================================================= */

function ManoPizza() {

  const [currentUser, setCurrentUser] =
    useState(null);

  const [stores, setStores] =
    useState(DEFAULT_STORES);

  const [purchases, setPurchases] =
    useState({});

  const [sales, setSales] =
    useState({});

  const [costs, setCosts] =
    useState({});

  const [loading, setLoading] =
    useState(true);

  const [firebaseError, setFirebaseError] =
    useState("");

  const [saveStatus, setSaveStatus] =
    useState("saved");

  const [date, setDate] =
    useState(todayISO());

  const [tab, setTab] =
    useState("alis");


  /* -------------------------------------------------------
     GERÇEK ZAMANLI FIRESTORE DİNLEYİCİLERİ
  ------------------------------------------------------- */

  useEffect(() => {

    if (!db) return;

    let loaded = {
      stores: false,
      purchases: false,
      sales: false,
      costs: false
    };

    function checkLoaded() {

      if (
        loaded.stores &&
        loaded.purchases &&
        loaded.sales &&
        loaded.costs
      ) {

        setLoading(false);

      }
    }


    /* MAĞAZALAR */

    const unsubStores =
      FB.onSnapshot(
        refs.stores(),
        snap => {

          if (snap.empty) {

            DEFAULT_STORES.forEach(async name => {

              try {

                await FB.setDoc(
                  refs.store(name),
                  {
                    name,
                    createdAt: Date.now()
                  },
                  { merge: true }
                );

              } catch (e) {

                console.error(e);

              }

            });

          } else {

            const list =
              snap.docs
                .map(d => d.data().name)
                .filter(Boolean)
                .sort();

            setStores(
              list.length
                ? list
                : DEFAULT_STORES
            );

          }

          loaded.stores = true;
          checkLoaded();

        },
        err => {

          console.error(err);

          setFirebaseError(
            "Mağazalar okunamadı."
          );

          loaded.stores = true;
          checkLoaded();

        }
      );


    /* ALIŞLAR */

    const unsubPurchases =
      FB.onSnapshot(
        refs.purchases(),
        snap => {

          const obj = {};

          snap.docs.forEach(d => {

            const x = d.data();

            if (!x.date || !x.store)
              return;

            if (!obj[x.date])
              obj[x.date] = {};

            obj[x.date][x.store] =
              x.items || [];

          });

          setPurchases(obj);

          loaded.purchases = true;
          checkLoaded();

        },
        err => {

          console.error(err);

          loaded.purchases = true;
          checkLoaded();

        }
      );


    /* SATIŞLAR */

    const unsubSales =
      FB.onSnapshot(
        refs.sales(),
        snap => {

          const obj = {};

          snap.docs.forEach(d => {

            const x = d.data();

            if (x.date)
              obj[x.date] =
                x.rows || {};

          });

          setSales(obj);

          loaded.sales = true;
          checkLoaded();

        },
        err => {

          console.error(err);

          loaded.sales = true;
          checkLoaded();

        }
      );


    /* MALİYETLER */

    const unsubCosts =
      FB.onSnapshot(
        refs.costs(),
        snap => {

          const obj = {};

          snap.docs.forEach(d => {

            const x = d.data();

            if (x.product)
              obj[x.product] = {
                cost: x.cost ?? "",
                price: x.price ?? ""
              };

          });

          setCosts(obj);

          loaded.costs = true;
          checkLoaded();

        },
        err => {

          console.error(err);

          loaded.costs = true;
          checkLoaded();

        }
      );


    return () => {

      unsubStores();
      unsubPurchases();
      unsubSales();
      unsubCosts();

    };

  }, []);


  /* -------------------------------------------------------
     MAĞAZA EKLE
  ------------------------------------------------------- */

  async function addStore(name) {

    const clean =
      name.trim();

    if (
      !clean ||
      stores.includes(clean)
    ) return false;

    setSaveStatus("saving");

    try {

      await FB.setDoc(
        refs.store(clean),
        {
          name: clean,
          createdAt: Date.now()
        },
        { merge: true }
      );

      setSaveStatus("saved");

      return true;

    } catch (e) {

      console.error(e);

      setSaveStatus("error");

      return false;
    }
  }


  /* -------------------------------------------------------
     MAĞAZA SİL
  ------------------------------------------------------- */

  async function deleteStore(name) {

    if (
      !confirm(
        `"${name}" mağazasını silmek istediğine emin misin?`
      )
    ) return;

    setSaveStatus("saving");

    try {

      await FB.deleteDoc(
        refs.store(name)
      );

      setSaveStatus("saved");

    } catch (e) {

      console.error(e);

      setSaveStatus("error");

    }
  }


  /* -------------------------------------------------------
     ALIŞ KAYDET
  ------------------------------------------------------- */

  async function savePurchase(
    selectedDate,
    store,
    items,
    locked = false
  ) {

    setSaveStatus("saving");

    try {

      await FB.setDoc(
        refs.purchase(
          selectedDate,
          store
        ),
        {
          date: selectedDate,
          store,
          items,
          locked,
          updatedAt: Date.now(),
          updatedBy: currentUser?.username || ""
        },
        { merge: true }
      );

      setSaveStatus("saved");

    } catch (e) {

      console.error(e);

      setSaveStatus("error");

      throw e;
    }
  }


  /* -------------------------------------------------------
     SATIŞ KAYDET
  ------------------------------------------------------- */

  async function saveSales(
    selectedDate,
    rows,
    locked = false
  ) {

    setSaveStatus("saving");

    try {

      await FB.setDoc(
        refs.sale(selectedDate),
        {
          date: selectedDate,
          rows,
          locked,
          updatedAt: Date.now(),
          updatedBy: currentUser?.username || ""
        },
        { merge: true }
      );

      setSaveStatus("saved");

    } catch (e) {

      console.error(e);

      setSaveStatus("error");

      throw e;
    }
  }


  /* -------------------------------------------------------
     MALİYET KAYDET
  ------------------------------------------------------- */

  async function saveCost(
    product,
    cost,
    price
  ) {

    setSaveStatus("saving");

    try {

      await FB.setDoc(
        refs.cost(product),
        {
          product,
          cost,
          price,
          updatedAt: Date.now(),
          updatedBy: currentUser?.username || ""
        },
        { merge: true }
      );

      setSaveStatus("saved");

    } catch (e) {

      console.error(e);

      setSaveStatus("error");

    }
  }


  if (loading) {

    return (
      <div className="
        min-h-screen
        bg-[#1C1B19]
        flex
        items-center
        justify-center
        text-white
      ">

        <div className="text-center">

          <div className="
            w-14 h-14
            rounded-2xl
            bg-[#B4432E]
            flex
            items-center
            justify-center
            mx-auto
            mb-4
          ">

            <i
              data-lucide="pizza"
              className="w-7 h-7"
            />

          </div>

          <div className="
            text-sm
            text-[#C7C4BB]
          ">
            Mano Pizza yükleniyor...
          </div>

          <div className="
            text-[11px]
            text-[#77736C]
            mt-2
          ">
            Veriler Firebase'den alınıyor
          </div>

        </div>

      </div>
    );
  }


  if (!currentUser) {

    return (
      <LoginScreen
        onSuccess={setCurrentUser}
      />
    );
  }


  const isAdmin =
    currentUser.role === "admin";


  const tabs = isAdmin
    ? [
        {
          id: "alis",
          label: "Alış",
          icon: "shopping-bag"
        },
        {
          id: "satis",
          label: "Satış",
          icon: "trending-up"
        },
        {
          id: "maliyet",
          label: "Maliyet",
          icon: "percent"
        },
        {
          id: "karzarar",
          label: "Kâr / Zarar",
          icon: "chart-no-axes-combined"
        },
        {
          id: "yonetici",
          label: "Yönetici",
          icon: "shield-check"
        }
      ]
    : [
        {
          id: "alis",
          label: "Alış",
          icon: "shopping-bag"
        },
        {
          id: "satis",
          label: "Satış",
          icon: "trending-up"
        }
      ];


  return (
    <div className="
      min-h-screen
      bg-[#F7F6F2]
      text-[#1C1B19]
      safe-bottom
    ">

      <div className="
        max-w-[900px]
        mx-auto
        px-4
        sm:px-6
        py-4
      ">

        {/* HEADER */}

        <header className="
          flex
          items-center
          justify-between
          mb-4
        ">

          <div className="
            flex
            items-center
            gap-3
          ">

            <div className="
              w-10 h-10
              rounded-xl
              bg-[#B4432E]
              flex
              items-center
              justify-center
              text-white
              shadow-sm
            ">

              <i
                data-lucide="pizza"
                className="w-5 h-5"
              />

            </div>

            <div>

              <h1 className="
                text-lg
                font-black
                tracking-tight
                m-0
              ">
                Mano Pizza
              </h1>

              <div className="
                flex
                items-center
                gap-2
                mt-0.5
              ">

                <span className="
                  text-[11px]
                  text-[#6B6862]
                ">
                  {currentUser.username}
                </span>

                <span className="
                  w-1
                  h-1
                  rounded-full
                  bg-[#C9C5BB]
                />

                <span className="
                  text-[11px]
                  text-[#6B6862]
                ">
                  {isAdmin
                    ? "Yönetici"
                    : "Kullanıcı"}
                </span>

              </div>

            </div>

          </div>


          <div className="
            flex
            items-center
            gap-3
          ">

            <SaveStatus
              status={saveStatus}
            />

            <button
              onClick={() =>
                setCurrentUser(null)
              }
              className="
                press
                flex
                items-center
                gap-1.5
                border
                border-[#E4E1D8]
                bg-white
                rounded-xl
                px-3
                py-2
                text-xs
                text-[#6B6862]
              "
            >

              <i
                data-lucide="log-out"
                className="w-3.5 h-3.5"
              />

              <span className="hidden sm:inline">
                Çıkış
              </span>

            </button>

          </div>

        </header>


        {firebaseError && (

          <div className="
            mb-3

function AlisTab({
  stores,
  purchases,
  date,
  isAdmin,
  savePurchase,
  addStore,
  deleteStore
}) {

  const [activeStore, setActiveStore] =
    useState(null);

  const [newStore, setNewStore] =
    useState("");

  const [showAddStore, setShowAddStore] =
    useState(false);

  const [product, setProduct] =
    useState("");

  const [qty, setQty] =
    useState("1");

  const [price, setPrice] =
    useState("");

  const [confirm, setConfirm] =
    useState(false);


  const day =
    purchases[date] || {};


  function totalStore(store) {

    return (day[store] || [])
      .reduce(
        (sum, item) =>
          sum +
          Number(item.qty || 0) *
          Number(item.unitPrice || 0),
        0
      );
  }


  const dayTotal =
    stores.reduce(
      (sum, store) =>
        sum + totalStore(store),
      0
    );


  const items =
    activeStore
      ? (day[activeStore] || [])
      : [];


  const locked =
    activeStore
      ? !!(
          day[
            `${activeStore}_LOCK`
          ]
        )
      : false;


  async function addItem(e) {

    e.preventDefault();

    const p =
      product.trim();

    const q =
      Number(qty);

    const pr =
      Number(price);

    if (
      !p ||
      !q ||
      q <= 0 ||
      Number.isNaN(pr) ||
      pr < 0
    ) return;


    const next = [
      ...items,
      {
        id:
          `${Date.now()}_${Math.random()
            .toString(36)
            .slice(2, 7)}`,
        product: p,
        qty: q,
        unitPrice: pr,
        createdAt: Date.now()
      }
    ];


    await savePurchase(
      date,
      activeStore,
      next,
      locked
    );


    setProduct("");
    setQty("1");
    setPrice("");

  }


  async function removeItem(id) {

    if (locked && !isAdmin)
      return;

    const next =
      items.filter(
        x => x.id !== id
      );

    await savePurchase(
      date,
      activeStore,
      next,
      locked
    );
  }


  async function lockStore() {

    if (!confirm)
      return;

    await savePurchase(
      date,
      activeStore,
      items,
      true
    );

    setConfirm(false);

function SatisTab({
  sales,
  date,
  isAdmin,
  saveSales
}) {

  const current =
    sales[date] || {};

  const [confirm, setConfirm] =
    useState(false);


  const locked =
    !!current.__locked;


  const rows =
    SALE_PRODUCTS.map(product => {

      const r =
        current[product] || {
          qty: "",
          unitPrice: ""
        };

      const qty =
        Number(r.qty) || 0;

      const unitPrice =
        Number(r.unitPrice) || 0;

      return {
        product,
        qty: r.qty ?? "",
        unitPrice: r.unitPrice ?? "",
        total: qty * unitPrice
      };

    });


  const total =
    rows.reduce(
      (sum, r) =>
        sum + r.total,
      0
    );


  const hasEntry =
    rows.some(
      r => Number(r.qty) > 0
    );


  async function update(
    product,
    field,
    value
  ) {

    const next = {
      ...current,
      [product]: {
        ...(current[product] || {}),
        [field]: value
      }
    };

    await saveSales(
      date,
      next,
      locked
    );
  }


  async function lock() {

    if (!confirm)
      return;

    await saveSales(
      date,
      current,
      true
    );

    setConfirm(false);
  }


  async function unlock() {

    await saveSales(
      date,
      current,
      false
    );
  }


  return (
    <div>

      {/* TOPLAM */}

      <div className="
        bg-[#1C1B19]
        rounded-2xl
        p-5
        mb-4
        text-white
      ">

        <div className="
          flex
          justify-between
          items-end
        ">

          <div>

            <div className="
              text-xs
              text-[#9C9890]
            ">
              Günün satış toplamı
            </div>

            <div className="
              text-2xl
              font-black
              mt-1
            ">
              {formatTL(total)}
            </div>

          </div>

          {locked && (

            <div className="
              flex
              items-center
              gap-1
              text-[10px]
              bg-[#2A2926]
              px-2.5
              py-1.5
              rounded-lg
              text-[#C7C4BB]
            ">

              <i
                data-lucide="lock"
                className="w-3 h-3"
              />

              Onaylandı

            </div>

          )}

        </div>

      </div>


      {locked && isAdmin && (

        <button
          onClick={unlock}
          className="
            mb-3
            text-xs
            font-bold
            text-[#1C6B4E]
            bg-transparent
            border-none
          "
        >
          Kilidi kaldır
        </button>

      )}


      {/* MOBİL KARTLAR */}

      <div className="
        mobile-card
        space-y-2
      ">

        {rows.map(r => (

          <div
            key={r.product}
            className="
              bg-white
              border
              border-[#E4E1D8]
              rounded-2xl
              p-4
              shadow-sm
            "
          >

            <div className="
              flex
              items-center
              justify-between
              mb-3
            ">

              <div className="
                text-sm
                font-bold
              ">
                {r.product}
              </div>

              <div className="
                text-sm
                font-black
              ">
                {formatTL(r.total)}
              </div>

            </div>


            <div className="
              grid
              grid-cols-2
              gap-2
            ">

              <label>

                <span className="
                  block
                  text-[10px]
                  text-[#6B6862]
                  mb-1
                ">
                  Adet
                </span>

                <input

/* =========================================================
   KÂR / ZARAR
========================================================= */

function KarZararTab({
  purchases,
  sales
}) {

  const [month, setMonth] =
    useState(thisMonthISO());


  const stats =
    useMemo(() => {

      let purchaseTotal = 0;
      let salesTotal = 0;


      Object.entries(
        purchases
      ).forEach(([date, stores]) => {

        if (
          !date.startsWith(month)
        ) return;

        Object.entries(
          stores
        ).forEach(([store, items]) => {

          if (
            store.includes("_LOCK")
          ) return;

          (items || []).forEach(
            item => {

              purchaseTotal +=
                Number(item.qty || 0) *
                Number(item.unitPrice || 0);

            }
          );

        });

      });


      Object.entries(
        sales
      ).forEach(([date, rows]) => {

        if (
          !date.startsWith(month)
        ) return;

        Object.entries(
          rows
        ).forEach(([key, row]) => {

          if (
            key === "__locked"
          ) return;

          salesTotal +=
            Number(row.qty || 0) *
            Number(row.unitPrice || 0);

        });

      });


      return {
        salesTotal,
        purchaseTotal,
        net:
          salesTotal -
          purchaseTotal
      };

    }, [
      purchases,
      sales,
      month
    ]);


  return (
    <div>

      <div className="
        bg-white
        border
        border-[#E4E1D8]
        rounded-2xl
        p-3
        mb-3
        flex
        items-center
        gap-3
      ">

        <i
          data-lucide="calendar"
          className="
            w-4 h-4
            text-[#6B6862]
          "
        />

        <input
          type="month"
          value={month}
          onChange={e =>
            setMonth(e.target.value)
          }
          className="
            flex-1
            border-none
            outline-none
            bg-transparent
            text-sm
            font-bold
          "
        />

        <span className="
          hidden
          sm:block
          text-xs
          text-[#A8A49A]
        ">
          {formatMonthLabel(month)}
        </span>

      </div>


      <div className="
        grid
        grid-cols-1
        sm:grid-cols-3
        gap-2
      ">

        <StatCard
          title="Toplam satış"
          value={formatTL(
            stats.salesTotal
          )}
          icon="trending-up"
          positive
        />

        <StatCard
          title="Toplam alış"
          value={formatTL(
            stats.purchaseTotal
          )}
          icon="shopping-bag"
        />

        <StatCard
          title="Net fark"
          value={formatTL(
            stats.net
          )}
          icon="wallet"
          positive={
            stats.net >= 0
          }
        />

      </div>


      <div className="
        bg-white
        border
        border-[#E4E1D8]
        rounded-2xl
        p-5
        mt-3
      ">

        <div className="
          text-[10px]
          uppercase
          tracking-wide
          text-[#6B6862]
        ">
          Hesaplama
        </div>

        <div className="
          text-sm
          font-bold
          mt-2
        ">
          Satış − Alış
        </div>

        <div className="
          text-xs
          text-[#6B6862]
          mt-1
        ">
          Bu ekran mevcut kayıtlar üzerinden
          nakit farkını gösterir.
        </div>

      </div>

    </div>
  );
}

/* =========================================================
   YÖNETİCİ
========================================================= */

function YoneticiTab() {

  const [username, setUsername] =
    useState("");

  const [password, setPassword] =
    useState("");

  const [users, setUsers] =
    useState([]);

  const [message, setMessage] =
    useState("");


  useEffect(() => {

    const unsubscribe =
      FB.onSnapshot(
        refs.users(),
        snap => {

          setUsers(
            snap.docs.map(
              d => ({
                id: d.id,
                ...d.data()
              })
            )
          );

        }
      );

    return () =>
      unsubscribe();

  }, []);


  async function createUser(e) {

    e.preventDefault();

    const u =
      username.trim().toLowerCase();

    const p =
      password.trim();

    if (!u || !p)
      return;

    try {

      await FB.setDoc(
        refs.user(u),
        {
          username: u,
          password: p,
          role: "user",
          createdAt: Date.now()
        },
        { merge: false }
      );

      setUsername("");
      setPassword("");

      setMessage(
        "Kullanıcı başarıyla kaydedildi."
      );

      setTimeout(
        () => setMessage(""),
        2500
      );

    } catch (e) {

      console.error(e);

      setMessage(
        "Kullanıcı kaydedilemedi."
      );

    }
  }


  async function deleteUser(user) {

    if (
      !confirm(
        `"${user.username}" kullanıcısını silmek istediğine emin misin?`
      )
    ) return;

    try {

      await FB.deleteDoc(
        refs.user(user.username)
      );

    } catch (e) {

      console.error(e);

    }
  }


  return (
    <div>

      <div className="
        bg-white
        border
        border-[#E4E1D8]
        rounded-2xl
        p-4
        mb-3
      ">

        <div className="
          flex
          items-center
          gap-2
          mb-3
        ">

          <div className="
            w-9 h-9
            rounded-xl
            bg-[#F1EFE9]
            flex
            items-center
            justify-center
          ">

            <i
              data-lucide="user-plus"
              className="w-4 h-4"
            />

          </div>

          <div>

            <div className="
              text-sm
              font-black
            ">
              Yeni kullanıcı
            </div>

            <div className="
              text-[10px]
              text-[#6B6862]
            ">
              Personel hesabı oluştur
            </div>

          </div>

        </div>


        <form
          onSubmit={createUser}
          className="space-y-2"
        >

          <input
            type="text"
            placeholder="Kullanıcı adı"
            autoCapitalize="none"
            value={username}
            onChange={e =>
              setUsername(e.target.value)
            }
            className="
              w-full
              h-11
              px-3
              rounded-xl
              border
              border-[#E4E1D8]
              bg-[#FCFCFA]
              text-sm
              outline-none
            "
          />

          <input
            type="text"
            placeholder="Şifre"
            value={password}
            onChange={e =>
              setPassword(e.target.value)
            }
            className="
              w-full
              h-11
              px-3
              rounded-xl
              border
              border-[#E4E1D8]
              bg-[#FCFCFA]
              text-sm
              outline-none
            "
          />

          <button
            className="
              press
              w-full
              h-11
              rounded-xl
              bg-[#1C1B19]
              text-white
              text-xs
              font-bold
            "
          >
            Kullanıcı Oluştur
          </button>

        </form>


        {message && (

          <div className="
            mt-3
            text-xs
            text-[#1C6B4E]
            bg-[#EAF3EE]
            rounded-xl
            p-3
          ">
            {message}
          </div>

        )}

      </div>


      <div className="
        text-[10px]
        uppercase
        tracking-wide
        text-[#A8A49A]
        mb-2
      ">
        Kullanıcılar
      </div>


      <div className="
        bg-white
        border
        border-[#E4E1D8]
        rounded-2xl
        overflow-hidden
      ">

        {users.map(user => (

          <div
            key={user.id}
            className="
              flex
              items-center
              justify-between
              p-4
              border-b
              border-[#EFEDE6]
              last:border-none
            "
          >

            <div className="
              flex
              items-center
              gap-3
            ">

              <div className="
                w-9 h-9
                rounded-xl
                bg-[#F1EFE9]
                flex
                items-center
                justify-center
              ">

                <i
                  data-lucide={
                    user.role === "admin"
                      ? "shield"
                      : "user"
                  }
                  className="w-4 h-4"
                />

              </div>

              <div>

                <div className="
                  text-sm
                  font-bold
                ">
                  {user.username}
                </div>

                <div className="
                  text-[10px]
                  text-[#6B6862]
                ">
                  {user.role === "admin"
                    ? "Yönetici"
                    : "Personel"}
                </div>

              </div>

            </div>


            {user.role !== "admin" && (

              <button
                onClick={() =>
                  deleteUser(user)
                }
                className="
                  w-9 h-9
                  rounded-xl
                  bg-[#FFF1ED]
                  text-[#B4432E]
                  border-none
                  flex
                  items-center
                  justify-center
                "
              >

                <i
                  data-lucide="trash-2"
                  className="w-4 h-4"
                />

              </button>

            )}

          </div>

        ))}


        {users.length === 0 && (

          <div className="
            p-6
            text-center
            text-xs
            text-[#6B6862]
          ">
            Henüz kullanıcı yok.
          </div>

        )}

      </div>

    </div>
  );
}

    );

    setTimeout(() => {

      if (
        window.lucide &&
        window.lucide.createIcons

    document.getElementById("root").innerHTML = `

        min-height:100vh;
        background:#1C1B19;
        color:white;
        display:flex;
        align-items:center;
        justify-content:center;

        text-align:center;
        font-family:Arial,sans-serif;
      ">

      </div>
    `;

  }

}


startApp();

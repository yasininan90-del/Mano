   FIRESTORE OFFLINE CACHE
========================================================= */

/* =========================================================
   SABİTLER
========================================================= */

const DEFAULT_STORES = [
  "Metro Market",
  "File Market"
];

const ADMIN_USERNAME = "mathrew";
const ADMIN_PASSWORD = "01102022";

const SALE_PRODUCTS = [

];

const EMPTY_DATA = {
  stores: DEFAULT_STORES,

  purchaseEntries: {},
  purchaseLocks: {},

  salesEntries: {},
  salesLocks: {},

  costs: {},

  lastActiveStore: null,

  users: {

/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function todayISO() {
  return new Date().toLocaleDateString("en-CA");
}

function thisMonthISO() {
  return todayISO().slice(0, 7);
}

function formatTL(value) {
  const n = Number(value) || 0;

  return new Intl.NumberFormat("tr-TR", {
    style: "currency",
    currency: "TRY",
    maximumFractionDigits: 2
  }).format(n);
}

function formatDateLabel(iso) {
  if (!iso) return "";

  return new Date(
    iso + "T00:00:00"
  ).toLocaleDateString("tr-TR", {
    day: "numeric",
    month: "long",
    year: "numeric",
    weekday: "long"
  });
}

function formatMonthLabel(iso) {
  if (!iso) return "";

  return new Date(
    iso + "-01T00:00:00"
  ).toLocaleDateString("tr-TR", {
    month: "long",
    year: "numeric"
  });
}


/* =========================================================
   FIRESTORE VERİ OKUMA
========================================================= */

function normalizeData(raw) {

  const source = raw || {};

  return {
    stores:
      Array.isArray(source.stores) && source.stores.length
        ? source.stores
        : DEFAULT_STORES,

    purchaseEntries:
      source.purchaseEntries || {},

    purchaseLocks:
      source.purchaseLocks || {},

    salesEntries:
      source.salesEntries || {},

    salesLocks:
      source.salesLocks || {},

    costs:
      source.costs || {},

    lastActiveStore:
      source.lastActiveStore || null,

    users: {
      ...EMPTY_DATA.users,
      ...(source.users || {})
    }
  };
}


/* =========================================================
   FIRESTORE GÜVENLİ YAZMA
========================================================= */

/*
  ÖNEMLİ:

  Eski kodda:

  setDoc(DOC_REF, next)

  kullanılıyordu.

  Bu durumda telefon A eski veriyi alıp,
  telefon B yeni kullanıcı ekledikten sonra,
  telefon A başka bir kayıt yaparsa B'nin kullanıcı
  bilgisi tekrar silinebiliyordu.

  Burada transaction kullanıyoruz.

  Böylece Firebase'deki en güncel veri alınır,
  değişiklik onun üzerine uygulanır.
*/

async function updateFirestore(mutator) {

  return db.runTransaction(async (transaction) => {

    const snap = await transaction.get(DOC_REF);

    const current = normalizeData(
      snap.exists ? snap.data() : {}
    );

    const next = mutator(
      clone(current)
    );

    transaction.set(
      DOC_REF,
      next,
      { merge: true }
    );

    return next;
  });
}


/* =========================================================
   ICON
========================================================= */

function Icon({ name, size = 18, className = "" }) {

  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  return (
    <i
      data-lucide={name}
      className={className}
      style={{
        width: size,
        height: size
      }}
    />
  );
}


/* =========================================================
   ANA UYGULAMA
========================================================= */

function ManoPizza() {

  const [data, setData] = useState(EMPTY_DATA);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  const [currentUser, setCurrentUser] = useState(null);

  const [date, setDate] = useState(todayISO());

  const [tab, setTab] = useState("alis");

  const [online, setOnline] = useState(navigator.onLine);


  /* -------------------------------------------------------
     ONLINE DURUMU
  ------------------------------------------------------- */

  useEffect(() => {

    const onlineHandler = () => setOnline(true);
    const offlineHandler = () => setOnline(false);

    window.addEventListener(
      "online",
      onlineHandler
    );

    window.addEventListener(
      "offline",
      offlineHandler
    );

    return () => {

      window.removeEventListener(
        "online",
        onlineHandler
      );

      window.removeEventListener(
        "offline",
        offlineHandler
      );

    };

  }, []);


  /* -------------------------------------------------------
     FIREBASE REALTIME LISTENER
  ------------------------------------------------------- */

  useEffect(() => {

    setLoading(true);

    const unsubscribe = DOC_REF.onSnapshot(

      {
        includeMetadataChanges: true
      },

      (snap) => {

        if (snap.exists) {

          const normalized =
            normalizeData(snap.data());

          setData(normalized);

        } else {

          const initial =
            normalizeData(EMPTY_DATA);

          DOC_REF.set(
            initial,
            { merge: true }
          );

          setData(initial);
        }

        setLoading(false);
        setError("");
      },

      (err) => {

        console.error(err);

        setError(
          "Firebase bağlantısında sorun oluştu."
        );

        setLoading(false);
      }

    );

    return () => unsubscribe();

  }, []);


  /* -------------------------------------------------------
     GÜVENLİ PERSIST
  ------------------------------------------------------- */

  const persist = useCallback(
    async (mutator) => {

      try {

        setError("");

        await updateFirestore(
          mutator
        );

      } catch (err) {

        console.error(err);

        setError(
          "Kaydedilemedi. İnternet bağlantınızı kontrol edin."
        );

    []
  );

     LOADING
  ------------------------------------------------------- */

            Mano Pizza
          </div>

          <div className="text-[#9C9890] text-xs mt-1">
            İşletme paneli hazırlanıyor...

    );
  }


  /* -------------------------------------------------------
     LOGIN
  ------------------------------------------------------- */

      <LoginScreen
        users={data.users}
        onSuccess={setCurrentUser}
      />
    );
  }


  const isAdmin =
    currentUser.role === "admin";


  const tabs = isAdmin
    ? [
        {
          id: "alis",
          label: "Alış",
          icon: "shopping-bag"
        },
        {
          id: "satis",
          label: "Satış",
          icon: "trending-up"
        },
        {
          id: "maliyet",
          label: "Maliyet",
          icon: "percent"
        },
        {
          id: "karzarar",
          label: "Kâr / Zarar",
          icon: "bar-chart-3"
        },
        {
          id: "yonetici",
          label: "Yönetici",
          icon: "shield-check"
        }
      ]
    : [
        {
          id: "alis",
          label: "Alış",
          icon: "shopping-bag"
        },
        {
          id: "satis",
          label: "Satış",
          icon: "trending-up"
        }
      ];


  return (

    <div className="min-h-screen bg-[#F7F6F2] text-[#1C1B19]">

      <div className="max-w-[850px] mx-auto px-3 sm:px-6 py-4 sm:py-6">

        {/* HEADER */}

        <header className="flex items-center justify-between mb-4">

            <div>

                </span>

                <span>•</span>

                <span>
                  {isAdmin
                    ? "Yönetici"
                    : "Kullanıcı"}
                </span>

              </div>

            </div>

          </div>


          <div className="flex items-center gap-2">

            <div

                  : "İnternet bağlantısı yok"

              className="hidden sm:flex items-center gap-1.5 bg-white border border-[#E4E1D8] rounded-lg px-2.5 py-2 text-[10px] text-[#6B6862]"
            >

                className={`w-2 h-2 rounded-full ${
                  online
                    ? "bg-[#1C6B4E] pulse-dot"
                    : "bg-[#B4432E]"

              />

              {online

            <button
              onClick={() => setCurrentUser(null)}

            >

              <span className="hidden sm:inline">
                Çıkış
              </span>

            </button>

          </div>

        </header>


        {/* ERROR */}

        {error && (

                }

            >

          {tab === "maliyet" && isAdmin && (

            <KarZararTab

          )}

          {tab === "yonetici" && isAdmin && (

            <YoneticiTab
              data={data}
              persist={persist}
            />

          )}

        </div>

  );
}


/* =========================================================
   LOGIN
========================================================= */

function LoginScreen({
  users,
  onSuccess
}) {

  const [username, setUsername] =
    useState("");

    useState("");

  const [error, setError] =
    useState("");

  const [showPassword, setShowPassword] =
    useState(false);


  function submit(e) {

    e.preventDefault();

    const name =
      username.trim();

    const user =
      users[name];

    if (
      user &&
      user.password === password
    ) {

      onSuccess({
        username: name,
        role: user.role
      });

    } else {

      setError(
        "Kullanıcı adı veya şifre hatalı."
      );

      setPassword("");
    }

  return (

    <div className="min-h-screen bg-[#1C1B19] flex items-center justify-center p-5">

              />

              <button

                }

              >

          {error && (

                name="circle-alert"

          <button

          >

        <div className="text-center text-[10px] text-[#625F59] mt-5">
          Mano Pizza İşletme Sistemi
        </div>

      </div>

    </div>
  );
}


/* =========================================================
   ALIŞ
========================================================= */

function AlisTab({
  data,
  date,
  persist,
  isAdmin
}) {

  const [activeStore, setActiveStore] =
    useState(
      data.lastActiveStore &&
      data.stores.includes(
        data.lastActiveStore
      )
        ? data.lastActiveStore
        : null
    );

  const [newStoreName, setNewStoreName] =
    useState("");

  const [showAddStore, setShowAddStore] =
    useState(false);

  const [itemForm, setItemForm] =
    useState({
      product: "",
      qty: "1",
      unitPrice: ""
    });

  const [confirmChecked, setConfirmChecked] =
    useState(false);


  const dayEntries =
    data.purchaseEntries[date] || {};

  const dayLocks =
    data.purchaseLocks[date] || {};


  function storeTotal(store) {

    return (
      dayEntries[store] || []
    ).reduce(
      (sum, item) =>
        sum +
        (
          Number(item.qty) *
          Number(item.unitPrice)
        ),
      0
    );
  }


  const dayTotal = useMemo(
    () =>
      data.stores.reduce(
        (sum, store) =>
          sum + storeTotal(store),
        0
      ),
    [data, date]
  );


  function openStore(store) {

    setActiveStore(store);

    setConfirmChecked(false);

    persist((current) => {

      current.lastActiveStore =
        store;

      return current;
    });
  }


  function addStore() {

    const name =
      newStoreName.trim();

    if (!name) return;

    if (
      data.stores.some(
        s =>
          s.toLowerCase() ===
          name.toLowerCase()
      )
    ) {
      return;
    }

    persist((current) => {

      if (!current.stores.includes(name)) {

        current.stores.push(name);
      }

      return current;
    });

    setNewStoreName("");
    setShowAddStore(false);
  }


  function removeStore(name) {

    if (
      !confirm(
        `"${name}" mağazasını silmek istediğinize emin misiniz?`
      )
    ) return;

    persist((current) => {

      current.stores =
        current.stores.filter(
          s => s !== name
        );

      if (
        current.purchaseEntries[date]
      ) {

        delete current.purchaseEntries[
          date
        ][name];
      }

      if (
        current.purchaseLocks[date]
      ) {

        delete current.purchaseLocks[
          date
        ][name];
      }

      if (
        current.lastActiveStore === name
      ) {

        current.lastActiveStore = null;
      }

      return current;
    });

    setActiveStore(null);
  }


  function addItem(e) {

    e.preventDefault();

    if (!activeStore) return;

    const product =
      itemForm.product.trim();

    const qty =
      Number(itemForm.qty);

    const unitPrice =
      Number(itemForm.unitPrice);

    if (
      !product ||
      !qty ||
      qty <= 0 ||
      isNaN(unitPrice) ||
      unitPrice < 0
    ) {
      return;
    }


    const item = {
      id:
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2, 8),

      product,
      qty,
      unitPrice
    };


    persist((current) => {

      if (
        !current.purchaseEntries[date]
      ) {
        current.purchaseEntries[date] = {};
      }

      if (
        !current.purchaseEntries[
          date
        ][activeStore]
      ) {

        current.purchaseEntries[
          date
        ][activeStore] = [];
      }

      current.purchaseEntries[
        date
      ][activeStore].push(item);

      return current;
    });


    setItemForm({
      product: "",
      qty: "1",
      unitPrice: ""
    });
  }


  function removeItem(id) {

    if (!activeStore) return;

    persist((current) => {

      const items =
        current.purchaseEntries[
          date
        ]?.[activeStore] || [];

      current.purchaseEntries[
        date
      ][activeStore] =
        items.filter(
          item => item.id !== id
        );

      return current;
    });
  }


  function setLock(store, locked) {

    persist((current) => {

      if (
        !current.purchaseLocks[date]
      ) {

        current.purchaseLocks[date] = {};
      }

      current.purchaseLocks[
        date
      ][store] = locked;

      return current;
    });
  }


  /* =====================================================
     MAĞAZA DETAYI
  ===================================================== */

  if (
    activeStore &&
    data.stores.includes(activeStore)
  ) {

    const locked =
      !!dayLocks[activeStore];

    const storeItems =
      dayEntries[activeStore] || [];


    return (

      <div>

        <button

        <div className="flex items-center justify-between mb-3">

                  size={15}

            <div className="text-[11px] text-[#9C9890]">

          {isAdmin && (

            <div className="flex items-center gap-2">

              {locked && (

                <button

              <button

                Sil

            </div>

          )}

        </div>


        {locked && !isAdmin && (

          <div className="bg-[#F1EFE9] border border-[#E4E1D8] rounded-xl p-3 mb-3 flex gap-2">

            <Icon
              name="lock"
              size={16}
              className="text-[#6B6862] shrink-0"

            <div className="text-xs text-[#6B6862]">

              değiştirilemez.

        {/* ÜRÜN FORMU */}

        {(!locked || isAdmin) && (

function SatisTab({
  data,
  date,
  persist,
  isAdmin
}) {

  const [confirmChecked, setConfirmChecked] =
    useState(false);

  const dayRow =
    data.salesEntries[date] || {};

  const locked =
    !!data.salesLocks[date];

  const readOnly =
    locked && !isAdmin;


  function updateRow(
    product,
    field,
    value
  ) {

    persist((current) => {

      if (
        !current.salesEntries[date]
      ) {
        current.salesEntries[date] = {};
      }

      const currentRow =
        current.salesEntries[
          date
        ][product] || {
          qty: "",
          unitPrice: ""
        };

      current.salesEntries[
        date
      ][product] = {
        ...currentRow,
        [field]: value
      };

      return current;
    });
  }


  function setLock(value) {

    persist((current) => {

      current.salesLocks[date] =
        value;

      return current;
    });

  }


  const rows =
    SALE_PRODUCTS.map(product => {

      const row =
        dayRow[product] || {
          qty: "",
          unitPrice: ""
        };

      const qty =
        Number(row.qty) || 0;

      const price =
        Number(row.unitPrice) || 0;

      return {
        product,
        qty: row.qty ?? "",
        unitPrice:
          row.unitPrice ?? "",
        total:
          qty * price
      };

    });


  const grandTotal =
    rows.reduce(
      (sum, row) =>
        sum + row.total,
      0
    );


  const hasAnyEntry =
    rows.some(
      row =>
        Number(row.qty) > 0
    );


  return (

    <div>

      {/* TOPLAM */}

      <div className="bg-[#1C1B19] rounded-2xl p-4 mb-3 text-white flex justify-between items-center">

        <div>

          <div className="text-[10px] text-[#A8A49A]">
            {formatDateLabel(date)}
          </div>

          <div className="text-xs text-[#C7C4BB] mt-1">
            Günün Satış Toplamı
          </div>

        </div>

        <strong className="text-xl">
          {formatTL(grandTotal)}
        </strong>

      </div>


      {/* KİLİT */}

      {locked && isAdmin && (

        <button
          onClick={() => setLock(false)}
          className="mb-3 text-[#1C6B4E] text-xs font-black flex items-center gap-1"
        >

          <Icon
            name="unlock"
            size={15}
          />

          Satış Kilidini Kaldır

        </button>

      )}


      {readOnly && (

        <div className="bg-[#F1EFE9] border border-[#E4E1D8] rounded-xl p-3 mb-3 flex items-center gap-2">

          <Icon
            name="lock"
            size={16}
            className="text-[#6B6862]"
          />

          <span className="text-xs text-[#6B6862]">
            Bu günün satışları onaylandı.
          </span>

        </div>

      )}


      {/* SATIŞ KARTLARI */}

      <div className="space-y-2">

        {rows.map(row => (

          <div
            key={row.product}
            className="bg-white border border-[#E4E1D8] rounded-2xl p-3.5"
          >

            <div className="flex items-center justify-between mb-3">

              <div className="font-black text-sm">
                {row.product}
              </div>

              <div className="font-black text-sm">
                {formatTL(row.total)}
              </div>

            </div>


            <div className="grid grid-cols-2 gap-2.5">

              <label>

                <span className="block text-[10px] text-[#6B6862] font-semibold mb-1">
                  Adet
                </span>

                <input
                  type="number"
                  min="0"
                  placeholder="0"
                  value={row.qty}
                  disabled={readOnly}
                  onChange={(e) =>
                    updateRow(
                      row.product,
                      "qty",
                      e.target.value
                    )
                  }
                  className="mobile-input w-full p-3 rounded-xl border border-[#E4E1D8] bg-[#FCFCFA] outline-none text-right font-bold"
                />

              </label>


              <label>

                <span className="block text-[10px] text-[#6B6862] font-semibold mb-1">
                  Birim Fiyat
                </span>

                <input
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="0"
                  value={row.unitPrice}
                  disabled={readOnly}
                  onChange={(e) =>
                    updateRow(
                      row.product,
                      "unitPrice",
                      e.target.value
                    )
                  }
                  className="mobile-input w-full p-3 rounded-xl border border-[#E4E1D8] bg-[#FCFCFA] outline-none text-right font-bold"
                />

              </label>

            </div>

          </div>

        ))}

      </div>


      {/* ONAY */}

      {!readOnly &&
        !isAdmin &&
        hasAnyEntry && (

        <div className="bg-[#FFF9EC] border border-[#E9DDB8] rounded-2xl p-4 mt-3">

          <label className="flex gap-2 text-xs text-[#7A6A2E]">

            <input
              type="checkbox"
              checked={confirmChecked}
              onChange={(e) =>
                setConfirmChecked(
                  e.target.checked
                )
              }
              className="mt-0.5 w-4 h-4"
            />

            <span>
              Günlük satışları kontrol ettim.
              Onayladıktan sonra değişiklik
              yapılamaz.
            </span>

          </label>


          <button
            disabled={!confirmChecked}
            onClick={() =>
              setLock(true)
            }
            className={`
              w-full h-12 mt-3 rounded-xl
              text-sm font-black
              flex items-center justify-center gap-2
              ${
                confirmChecked
                  ? "bg-[#1C1B19] text-white"
                  : "bg-[#D8D4C8] text-[#99958C]"
              }
            `}
          >

            <Icon
              name="check-circle-2"
              size={17}
            />

            Kaydet ve Onayla

          </button>

        </div>

      )}

    </div>
  );
}

function MaliyetlerTab({
  data,
  persist
}) {

  const costs =
    data.costs || {};


  function updateCost(
    product,
    field,
    value
  ) {

    persist((current) => {

      if (
        !current.costs[product]
      ) {

        current.costs[product] = {
          cost: "",
          price: ""
        };
      }

      current.costs[
        product
      ][field] = value;

      return current;
    });

  }


  return (

    <div>

      <div className="bg-[#1C1B19] text-white rounded-2xl p-4 mb-3">

        <div className="font-black">
          Ürün Maliyetleri
        </div>

        <div className="text-[11px] text-[#9C9890] mt-1">
          Maliyet ve satış fiyatlarını
          buradan yönetebilirsiniz.
        </div>

      </div>


      <div className="space-y-2">

        {SALE_PRODUCTS.map(product => {

          const c =
            costs[product] || {
              cost: "",
              price: ""
            };

          const cost =
            Number(c.cost) || 0;

          const price =
            Number(c.price) || 0;

          const profit =
            price - cost;

          const margin =
            price > 0
              ? (profit / price) * 100
              : 0;


          return (

            <div
              key={product}
              className="bg-white border border-[#E4E1D8] rounded-2xl p-3.5"
            >

              <div className="flex justify-between items-center mb-3">

                <div className="font-black text-sm">
                  {product}
                </div>

                <div className="text-right">

                  <div className="text-sm font-black text-[#1C6B4E]">
                    {formatTL(profit)}
                  </div>

                  <div className="text-[10px] text-[#6B6862]">
                    Kâr · %{margin.toFixed(0)}
                  </div>

                </div>

              </div>


              <div className="grid grid-cols-2 gap-2.5">

                <label>

                  <span className="text-[10px] text-[#6B6862] font-semibold">
                    Maliyet
                  </span>

                  <input
                    type="number"
                    min="0"
                    step="0.01"
                    value={c.cost}
                    onChange={(e) =>
                      updateCost(
                        product,
                        "cost",
                        e.target.value
                      )
                    }
                    className="mobile-input w-full mt-1 p-3 rounded-xl border border-[#E4E1D8] bg-[#FCFCFA] outline-none text-right font-bold"
                  />

                </label>


                <label>

                  <span className="text-[10px] text-[#6B6862] font-semibold">
                    Satış Fiyatı
                  </span>

                  <input
                    type="number"
                    min="0"
                    step="0.01"
                    value={c.price}
                    onChange={(e) =>
                      updateCost(
                        product,
                        "price",
                        e.target.value
                      )
                    }
                    className="mobile-input w-full mt-1 p-3 rounded-xl border border-[#E4E1D8] bg-[#FCFCFA] outline-none text-right font-bold"
                  />

                </label>

              </div>

            </div>

          );

        })}

      </div>

    </div>
  );
}


/* =========================================================
   KAR / ZARAR
========================================================= */

function KarZararTab({
  data
}) {

  const [month, setMonth] =
    useState(thisMonthISO());


  const stats =
    useMemo(() => {

      let purchaseTotal = 0;

      Object.entries(
        data.purchaseEntries || {}
      ).forEach(
        ([date, stores]) => {

          if (
            !date.startsWith(month)
          ) return;

          Object.values(
            stores || {}
          ).forEach(items => {

            (items || []).forEach(
              item => {

                purchaseTotal +=
                  Number(item.qty) *
                  Number(item.unitPrice);
              }
            );

          });

        }
      );


      let salesTotal = 0;

      Object.entries(
        data.salesEntries || {}
      ).forEach(
        ([date, products]) => {

          if (
            !date.startsWith(month)
          ) return;

          Object.values(
            products || {}
          ).forEach(row => {

            salesTotal +=
              (Number(row.qty) || 0) *
              (Number(row.unitPrice) || 0);

          });

        }
      );


      return {
        purchaseTotal,
        salesTotal,
        net:
          salesTotal -
          purchaseTotal
      };

    }, [data, month]);


  return (

    <div>

      <div className="bg-white border border-[#E4E1D8] rounded-2xl p-3 mb-3 flex items-center gap-3">

        <div className="w-10 h-10 bg-[#F1EFE9] rounded-xl flex items-center justify-center">

          <Icon
            name="calendar"
            size={18}
          />

        </div>

        <div className="flex-1">

          <div className="text-[10px] text-[#6B6862]">
            Rapor dönemi
          </div>

          <input
            type="month"
            value={month}
            onChange={(e) =>
              setMonth(e.target.value)
            }
            className="border-0 bg-transparent outline-none font-black text-sm"
          />

        </div>

        <div className="hidden sm:block text-xs text-[#9C9890]">
          {formatMonthLabel(month)}
        </div>

      </div>


      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">

        <StatCard
          title="Toplam Satış"
          value={stats.salesTotal}
          icon="trending-up"
          positive
        />

        <StatCard
          title="Toplam Alış"
          value={stats.purchaseTotal}
          icon="shopping-bag"
        />

        <StatCard
          title="Net"
          value={stats.net}
          icon="wallet"
          positive={
            stats.net >= 0
          }
        />

      </div>


      <div className="bg-white border border-[#E4E1D8] rounded-2xl p-4 mt-3">

        <div className="text-xs font-black mb-3">
          Aylık Özet
        </div>

        <div className="space-y-3">

          <SummaryRow
            label="Satış Geliri"
            value={stats.salesTotal}
          />

          <SummaryRow
            label="Alış Gideri"
            value={-stats.purchaseTotal}
          />

          <div className="border-t border-[#E4E1D8] pt-3">

            <SummaryRow
              label="Net Kâr / Nakit Akışı"
              value={stats.net}
              bold
            />

          </div>

        </div>

      </div>

    </div>
  );
}


/* =========================================================
   STAT CARD
========================================================= */

function StatCard({
  title,
  value,
  icon,
  positive
}) {

  return (

    <div className="bg-white border border-[#E4E1D8] rounded-2xl p-4">

      <div className="w-9 h-9 rounded-lg bg-[#F1EFE9] flex items-center justify-center mb-3">

        <Icon
          name={icon}
          size={17}
          className={
            positive
              ? "text-[#1C6B4E]"
              : "text-[#B4432E]"
          }
        />

      </div>

      <div className="text-[10px] text-[#6B6862]">
        {title}
      </div>

      <div
        className={`text-lg font-black mt-1 ${
          positive
            ? "text-[#1C6B4E]"
            : "text-[#B4432E]"
        }`}
      >
        {formatTL(value)}
      </div>

    </div>

  );
}


/* =========================================================
   SUMMARY ROW
========================================================= */

function SummaryRow({
  label,
  value,
  bold
}) {

  return (

    <div className="flex justify-between items-center">

      <span
        className={
          bold
            ? "font-black text-sm"
            : "text-xs text-[#6B6862]"
        }
      >
        {label}
      </span>

      <span
        className={
          bold
            ? "font-black text-base"
            : "font-bold text-sm"
        }
      >
        {formatTL(value)}
      </span>

    </div>

  );
}


/* =========================================================
   YÖNETİCİ
========================================================= */

function YoneticiTab({
  data,
  persist
}) {

  const [form, setForm] =
    useState({
      username: "",
      password: ""
    });


  const users =
    data.users || {};


  function createUser(e) {

    e.preventDefault();

    const username =
      form.username.trim();

    const password =
      form.password.trim();

    if (
      !username ||
      !password
    ) return;


    persist((current) => {

      if (
        current.users[username]
      ) {
        return current;
      }

      current.users[username] = {
        password,
        role: "user"
      };

      return current;

    });


    setForm({
      username: "",
      password: ""
    });
  }


  function deleteUser(username) {

    if (
      !confirm(
        `"${username}" kullanıcısını silmek istediğinize emin misiniz?`
      )
    ) return;


    persist((current) => {

      if (
        current.users[username]
      ) {

        delete current.users[
          username
        ];
      }

      return current;
    });
  }


  return (

    <div>

      {/* BAŞLIK */}

      <div className="bg-[#1C1B19] text-white rounded-2xl p-4 mb-3">

        <div className="flex items-center gap-2">

          <Icon
            name="shield-check"
            size={19}
          />

          <div className="font-black">
            Yönetici Paneli
          </div>

        </div>

        <div className="text-[11px] text-[#9C9890] mt-1">
          Kullanıcı hesaplarını yönetin.
        </div>

      </div>


      {/* KULLANICI EKLE */}

      <form
        onSubmit={createUser}
        className="bg-white border border-[#E4E1D8] rounded-2xl p-4 mb-3"
      >

        <div className="font-black text-sm mb-3 flex items-center gap-2">

          <Icon
            name="user-plus"
            size={17}
          />

          Yeni Kullanıcı

        </div>


        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">

          <input
            type="text"
            placeholder="Kullanıcı adı"
            autoCapitalize="none"
            autoCorrect="off"
            value={form.username}
            onChange={(e) =>
              setForm(
                f => ({
                  ...f,
                  username:
                    e.target.value
                })
              )
            }
            className="mobile-input p-3 rounded-xl border border-[#E4E1D8] bg-[#FCFCFA] outline-none text-sm"
          />


          <input
            type="text"
            placeholder="Şifre"
            value={form.password}
            onChange={(e) =>
              setForm(
                f => ({
                  ...f,
                  password:
                    e.target.value
                })
              )
            }
            className="mobile-input p-3 rounded-xl border border-[#E4E1D8] bg-[#FCFCFA] outline-none text-sm"
          />

        </div>


        <button
          type="submit"
          className="w-full h-12 mt-3 rounded-xl bg-[#1C1B19] text-white font-black text-sm"
        >

          Kullanıcı Oluştur

        </button>

      </form>


      {/* KULLANICILAR */}

      <div className="space-y-2">

        {Object.entries(users).map(
          ([username, user]) => (

            <div
              key={username}
              className="bg-white border border-[#E4E1D8] rounded-2xl p-4 flex items-center justify-between"
            >

              <div className="flex items-center gap-3">

                <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${
                  user.role === "admin"
                    ? "bg-[#FFF1ED] text-[#B4432E]"
                    : "bg-[#EAF3EE] text-[#1C6B4E]"
                }`}>

                  <Icon
                    name={
                      user.role === "admin"
                        ? "shield"
                        : "user"
                    }
                    size={17}
                  />

                </div>


                <div>

                  <div className="font-black text-sm">
                    {username}
                  </div>

                  <div className="text-[10px] text-[#6B6862] mt-0.5">

                    {user.role === "admin"
                      ? "Yönetici"
                      : "Kullanıcı"}

                  </div>

                </div>

              </div>


              {user.role !== "admin" && (

                <button
                  onClick={() =>
                    deleteUser(
                      username
                    )
                  }
                  className="w-10 h-10 rounded-xl bg-[#F7F6F2] text-[#A8A49A] flex items-center justify-center"
                >

                  <Icon
                    name="trash-2"
                    size={16}
                  />

                </button>

              )}

            </div>

          )
        )}

      </div>


      {/* BİLGİ */}

      <div className="mt-4 bg-[#F1EFE9] rounded-xl p-3 text-[10px] text-[#6B6862] leading-relaxed">

        <strong>Veri güvenliği:</strong>{" "}
        Kullanıcı değişiklikleri Firebase
        üzerinde transaction yöntemiyle
        kaydedilir. Böylece başka bir
        cihazdan yapılan işlem eski verinin
        üzerine yanlışlıkla yazılmaz.

      </div>

    </div>
  );
}


/* =========================================================
   REACT BAŞLAT
========================================================= */

ReactDOM.createRoot(
  document.getElementById("root")
).render(
  <ManoPizza />
);

</script>

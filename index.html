/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function todayISO() {
  return new Date()
    .toISOString()
    .slice(0, 10);
}

function monthISO() {
  return new Date()
    .toISOString()
    .slice(0, 7);
}

function formatTL(value) {

  return new Intl.NumberFormat(
    "tr-TR",
    {
      style: "currency",
      currency: "TRY",
      maximumFractionDigits: 2
    }
  ).format(Number(value) || 0);

}

function formatNumber(value) {

  return new Intl.NumberFormat(
    "tr-TR",
    {
      maximumFractionDigits: 2
    }
  ).format(Number(value) || 0);

}

function formatDate(iso) {

  if (!iso) return "";

  return new Date(
    iso + "T00:00:00"
  ).toLocaleDateString(
    "tr-TR",
    {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );
}

function formatMonth(iso) {

  if (!iso) return "";

  return new Date(
    iso + "-01T00:00:00"
  ).toLocaleDateString(
    "tr-TR",
    {
      month: "long",
      year: "numeric"
    }
  );
}

function mergeData(remote) {

  return {
    ...DEFAULT_DATA,
    ...(remote || {}),

    stores:
      remote?.stores?.length
        ? remote.stores
        : DEFAULT_STORES,

    users: {
      ...DEFAULT_DATA.users,
      ...(remote?.users || {})
    },

    purchaseEntries:
      remote?.purchaseEntries || {},

    purchaseLocks:
      remote?.purchaseLocks || {},

    salesEntries:
      remote?.salesEntries || {},

    salesLocks:
      remote?.salesLocks || {},

    costs:
      remote?.costs || {},

    expenses:
      remote?.expenses || {}
  };
}

function Login({
  users,
  onLogin
}) {

  const [username, setUsername] =
    useState("");

  const [password, setPassword] =
    useState("");

  const [error, setError] =
    useState("");

  function submit(e) {

    e.preventDefault();

    const clean =
      username.trim();

    const user =
      users[clean];

    if (
      user &&
      user.password === password
    ) {

      onLogin({
        username: clean,
        role: user.role
      });

      return;
    }

    setError(
      "Kullanıcı adı veya şifre hatalı."
    );

    setPassword("");
  }

  return (

    <div className="min-h-screen bg-[#1C1B19] flex items-center justify-center p-5">

            Kullanıcı Adı

            autoFocus
            autoCapitalize="none"
            value={username}
            onChange={e =>
              setUsername(e.target.value)
            }
            className="mt-1 mb-4 w-full p-3.5 rounded-xl bg-[#1F1E1B] border border-[#45433D] text-white text-sm outline-none focus:border-[#B4432E]"
          />

          <label className="text-xs text-[#AAA69D]">

/* =========================================================
   DASHBOARD
========================================================= */

function Dashboard({
  data,
  month
}) {

  const stats = useMemo(() => {

    let sales = 0;
    let purchases = 0;
    let expenses = 0;

    const products = {};

    const stores = {};

    Object.entries(
      data.salesEntries || {}
    ).forEach(
      ([date, rows]) => {

        if (!date.startsWith(month))
          return;

        Object.entries(rows || {})
          .forEach(
            ([product, row]) => {

              const qty =
                Number(row.qty) || 0;

              const price =
                Number(row.unitPrice) || 0;

              const total =
                qty * price;

              sales += total;

              products[product] =
                (products[product] || 0)
                + total;

            }
          );

      }
    );

    Object.entries(
      data.purchaseEntries || {}
    ).forEach(
      ([date, storeRows]) => {

        if (!date.startsWith(month))
          return;

        Object.entries(
          storeRows || {}
        ).forEach(
          ([store, items]) => {

            let total = 0;

            (items || []).forEach(
              item => {

                total +=
                  (Number(item.qty) || 0)
                  *
                  (Number(item.unitPrice) || 0);

              }
            );

            purchases += total;

            stores[store] =
              (stores[store] || 0)
              + total;

          }
        );

      }
    );

    Object.entries(
      data.expenses || {}
    ).forEach(
      ([date, items]) => {

        if (!date.startsWith(month))
          return;

        (items || []).forEach(
          item => {

            expenses +=
              Number(item.amount) || 0;

          }
        );

      }
    );

    const ranking =
      Object.entries(products)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6);

    return {

      sales,
      purchases,
      expenses,

      gross:
        sales - purchases,

      net:
        sales - purchases - expenses,

      ranking,

      stores

    };

  }, [data, month]);


  const margin =
    stats.sales
      ? (
          stats.net /
          stats.sales
        ) * 100
      : 0;


  return (

    <div className="space-y-4 fade-in">

      <div className="grid grid-cols-2 xl:grid-cols-4 gap-3">

        <StatCard
          title="Aylık Ciro"
          value={formatTL(stats.sales)}
          subtitle={formatMonth(month)}
          icon="trending-up"
          tone="green"
        />

        <StatCard
          title="Toplam Alış"
          value={formatTL(stats.purchases)}
          icon="shopping-bag"
          tone="red"
        />

        <StatCard
          title="İşletme Giderleri"
          value={formatTL(stats.expenses)}
          icon="receipt"
          tone="yellow"
        />

        <StatCard
          title="Net Kâr"
          value={formatTL(stats.net)}
          subtitle={`Marj %${margin.toFixed(1)}`}
          icon="circle-dollar-sign"
          tone="dark"
        />

      </div>


      <div className="grid lg:grid-cols-2 gap-4">

        <section className="bg-white border border-[#E4E1D8] rounded-2xl p-4">

          <div className="flex justify-between items-center mb-5">

            <div>
              <h3 className="font-black text-sm">
                En Çok Ciro Getirenler
              </h3>

              <p className="text-[11px] text-[#77736B]">
                {formatMonth(month)}
              </p>
            </div>

            <Icon
              name="bar-chart-3"
              size={18}
              className="text-[#77736B]"
            />

          </div>

          {stats.ranking.length === 0 && (

            <div className="py-8 text-center text-xs text-[#77736B]">
              Bu ay satış verisi bulunmuyor.
            </div>

          )}

          <div className="space-y-4">

            {stats.ranking.map(
              ([name, value], index) => {

                const max =
                  stats.ranking[0]?.[1] || 1;

                const width =
                  Math.max(
                    8,
                    (value / max) * 100
                  );

                return (

                  <div key={name}>

                    <div className="flex justify-between text-xs mb-1.5">

                      <span className="font-semibold">
                        {index + 1}. {name}
                      </span>

                      <span className="font-bold">
                        {formatTL(value)}
                      </span>

                    </div>

                    <div className="h-2 bg-[#F0EEE8] rounded-full overflow-hidden">

                      <div
                        className="h-full bg-[#B4432E] rounded-full"
                        style={{
                          width: `${width}%`
                        }}
                      />

                    </div>

                  </div>

                );

              }
            )}

          </div>

        </section>


        <section className="bg-white border border-[#E4E1D8] rounded-2xl p-4">

          <h3 className="font-black text-sm mb-4">
            Finansal Özet
          </h3>

          <div className="space-y-1">

            <SummaryRow
              label="Toplam Satış"
              value={formatTL(stats.sales)}
              green
            />

            <SummaryRow
              label="Toplam Alış"
              value={formatTL(stats.purchases)}
              red
            />

            <SummaryRow
              label="Brüt Kâr"
              value={formatTL(stats.gross)}
            />

            <SummaryRow
              label="İşletme Giderleri"
              value={formatTL(stats.expenses)}
            />

            <div className="border-t border-[#EEEAE2] mt-3 pt-3">

              <SummaryRow
                label="Net Kâr"
                value={formatTL(stats.net)}
                bold
              />

            </div>

          </div>

        </section>

      </div>


      <section className="bg-white border border-[#E4E1D8] rounded-2xl p-4">

        <div className="flex items-center justify-between mb-4">

          <div>
            <h3 className="font-black text-sm">
              Mağaza Alış Dağılımı
            </h3>

            <p className="text-[11px] text-[#77736B]">
              Aylık alış tutarları
            </p>
          </div>

          <Icon
            name="store"
            size={18}
            className="text-[#77736B]"
          />

        </div>

        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">

          {Object.entries(stats.stores)
            .map(
              ([store, value]) => (

                <div
                  key={store}
                  className="bg-[#F8F7F3] rounded-xl p-3 flex justify-between"
                >

                  <span className="text-xs font-semibold">
                    {store}
                  </span>

                  <span className="text-xs font-black">
                    {formatTL(value)}
                  </span>

                </div>

              )
            )}

        </div>

      </section>

    </div>

  );
}


/* =========================================================
   SUMMARY ROW
========================================================= */

  label,
  value,
  green,
  red,
  bold
}) {

  return (

    <div className="flex justify-between items-center py-2 text-xs">

      <span className={bold ? "font-black" : ""}>
        {label}
      </span>

      <span
        className={
          "font-bold " +
          (green
            ? "text-[#185C42]"
            : red
            ? "text-[#9E3928]"
            : "")
        }
      >
        {value}
      </span>

    </div>

  );
}


/* =========================================================
   SALES
========================================================= */

function Sales({
  data,
  persist,
  date,
  isAdmin
}) {

  const rows =
    PRODUCTS.map(product => {

      const row =
        data.salesEntries?.[date]?.[product]
        || {
          qty: "",
          unitPrice: ""
        };

      const qty =
        Number(row.qty) || 0;

      const price =
        Number(row.unitPrice) || 0;

      return {

        product,

        qty:
          row.qty ?? "",

        unitPrice:
          row.unitPrice ?? "",

        total:
          qty * price

      };

    });


  const locked =
    !!data.salesLocks?.[date];


  const total =
    rows.reduce(
      (sum, row) =>
        sum + row.total,
      0
    );


  function update(
    product,
    field,
    value
  ) {

    if (
      locked &&
      !isAdmin
    ) return;

    const current =
      data.salesEntries?.[date]?.[product]
      || {};

    persist({

      ...data,

      salesEntries: {

        ...data.salesEntries,

        [date]: {

          ...(data.salesEntries?.[date] || {}),

          [product]: {

            ...current,

            [field]: value

          }

        }

      }

    });

  }


  function toggleLock() {

    persist({

      ...data,

      salesLocks: {

        ...data.salesLocks,

        [date]: !locked

      }

    });

  }


  return (

    <div className="fade-in">

      <div className="bg-[#1C1B19] text-white rounded-2xl p-4 mb-4 flex justify-between items-center">

        <div>

          <div className="text-[11px] text-[#A8A49A]">
            Günlük Satış
          </div>

          <div className="text-[10px] text-[#77736B] mt-1">
            {formatDate(date)}
          </div>

        </div>

        <div className="text-lg font-black">
          {formatTL(total)}
        </div>

      </div>


      {locked && (

        <div className="mb-3 bg-[#F1EFE9] border border-[#E4E1D8] rounded-xl p-3 flex items-center gap-2 text-xs">

          <Icon name="lock" size={15} />

          <span>
            Bu günün satışları onaylandı.
          </span>

          {isAdmin && (

            <button
              onClick={toggleLock}
              className="ml-auto text-[#185C42] font-bold"
            >
              Kilidi Aç
            </button>

          )}

        </div>

      )}


      <div className="bg-white border border-[#E4E1D8] rounded-2xl overflow-x-auto">

        <div className="min-w-[650px]">

          <div className="grid grid-cols-[2fr_1fr_1.2fr_1.2fr] bg-[#F1EFE9] p-3 text-[11px] text-[#6B6862] font-black">

            <span>Ürün</span>

            <span className="text-right">
              Adet
            </span>

            <span className="text-right">
              Birim Fiyat
            </span>

            <span className="text-right">
              Toplam
            </span>

          </div>


          {rows.map(
            (row, index) => (

              <div
                key={row.product}
                className={
                  "grid grid-cols-[2fr_1fr_1.2fr_1.2fr] gap-2 items-center p-2 border-t border-[#EFECE5] " +
                  (index % 2
                    ? "bg-[#FCFBF8]"
                    : "bg-white")
                }
              >

                <span className="text-xs font-semibold truncate">
                  {row.product}
                </span>

                <input
                  type="number"
                  min="0"
                  value={row.qty}
                  disabled={
                    locked && !isAdmin
                  }
                  onChange={e =>
                    update(
                      row.product,
                      "qty",
                      e.target.value
                    )
                  }
                  className="p-2 border border-[#E4E1D8] rounded-lg text-xs text-right bg-[#FCFCFA] outline-none"
                />

                <input
                  type="number"
                  min="0"
                  step="0.01"
                  value={row.unitPrice}
                  disabled={
                    locked && !isAdmin
                  }
                  onChange={e =>
                    update(
                      row.product,
                      "unitPrice",
                      e.target.value
                    )
                  }
                  className="p-2 border border-[#E4E1D8] rounded-lg text-xs text-right bg-[#FCFCFA] outline-none"
                />

                <span className="text-xs font-black text-right">
                  {formatTL(row.total)}
                </span>

              </div>

            )
          )}

        </div>

      </div>


      {!locked && !isAdmin && (

        <button
          onClick={toggleLock}
          className="mt-3 w-full py-3 bg-[#1C1B19] text-white rounded-xl text-xs font-black"
        >

          <Icon
            name="check-circle-2"
            size={15}
            className="inline mr-1"
          />

          Günlük Satışı Onayla

        </button>

      )}

    </div>

  );
}


/* =========================================================
   PURCHASES
========================================================= */

function Purchases({
  data,
  persist,
  date,
  isAdmin
}) {

  const [activeStore, setActiveStore] =
    useState(null);

  const [form, setForm] =
    useState({
      product: "",
      qty: "1",
      unitPrice: ""
    });


  const day =
    data.purchaseEntries?.[date] || {};

  const locks =
    data.purchaseLocks?.[date] || {};


  if (activeStore) {

    const items =
      day[activeStore] || [];

    const locked =
      !!locks[activeStore];


    const total =
      items.reduce(
        (sum, item) =>
          sum +
          Number(item.qty) *
          Number(item.unitPrice),
        0
      );


    function addItem(e) {

      e.preventDefault();

      if (
        locked &&
        !isAdmin
      ) return;

      if (
        !form.product.trim()
      ) return;

      const item = {

        id:
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .slice(2),

        product:
          form.product.trim(),

        qty:
          Number(form.qty) || 0,

        unitPrice:
          Number(form.unitPrice) || 0

      };


      persist({

        ...data,

        purchaseEntries: {

          ...data.purchaseEntries,

          [date]: {

            ...day,

            [activeStore]: [
              ...items,
              item
            ]

          }

        }

      });


      setForm({
        product: "",
        qty: "1",
        unitPrice: ""
      });

    }

/* =========================================================
   PROFIT LOSS
========================================================= */

function ProfitLoss({
  data,
  month
}) {

  const result =
    useMemo(() => {

      let sales = 0;
      let purchases = 0;
      let expenses = 0;


      Object.entries(
        data.salesEntries || {}
      ).forEach(
        ([date, rows]) => {

          if (
            !date.startsWith(month)
          ) return;

          Object.values(
            rows || {}
          ).forEach(
            row => {

              sales +=
                (Number(row.qty) || 0)
                *
                (Number(row.unitPrice) || 0);

            }
          );

        }
      );


      Object.entries(
        data.purchaseEntries || {}
      ).forEach(
        ([date, stores]) => {

          if (
            !date.startsWith(month)
          ) return;

          Object.values(
            stores || {}
          ).forEach(
            items => {

              (items || [])
                .forEach(
                  item => {

                    purchases +=
                      (Number(item.qty) || 0)
                      *
                      (Number(item.unitPrice) || 0);

                  }
                );

            }
          );

        }
      );


      Object.entries(
        data.expenses || {}
      ).forEach(
        ([date, items]) => {

          if (
            !date.startsWith(month)
          ) return;

          (items || [])
            .forEach(
              item => {

                expenses +=
                  Number(item.amount) || 0;

              }
            );

        }
      );


      const gross =
        sales - purchases;

      const net =
        gross - expenses;

      const margin =
        sales
          ? (net / sales) * 100
          : 0;


      return {
        sales,
        purchases,
        expenses,
        gross,
        net,
        margin
      };

    }, [data, month]);


  return (

    <div className="fade-in space-y-4">

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">

        <StatCard
          title="Ciro"
          value={formatTL(result.sales)}
          icon="trending-up"
          tone="green"
        />

        <StatCard
          title="Alış"
          value={formatTL(result.purchases)}
          icon="shopping-bag"
          tone="red"
        />

        <StatCard
          title="Brüt Kâr"
          value={formatTL(result.gross)}
          icon="percent"
          tone="yellow"
        />

        <StatCard
          title="Net Kâr"
          value={formatTL(result.net)}
          subtitle={`Marj %${result.margin.toFixed(1)}`}
          icon="circle-dollar-sign"
          tone="dark"
        />

      </div>


      <div className="bg-white border border-[#E4E1D8] rounded-2xl p-4">

        <h3 className="font-black text-sm mb-4">
          {formatMonth(month)} Kâr / Zarar
        </h3>

        <div className="space-y-1">

          <SummaryRow
            label="Toplam Ciro"
            value={formatTL(result.sales)}
            green
          />

          <SummaryRow
            label="Toplam Alış"
            value={formatTL(result.purchases)}
            red
          />

          <SummaryRow
            label="Brüt Kâr"
            value={formatTL(result.gross)}
          />

          <SummaryRow
            label="İşletme Giderleri"
            value={formatTL(result.expenses)}
          />

          <div className="border-t border-[#EEEAE2] mt-3 pt-3">

            <SummaryRow
              label="NET KÂR"
              value={formatTL(result.net)}
              bold
            />

          </div>

        </div>

      </div>

    </div>

  );
}

function Admin({
  data,
  persist
}) {

  const [form, setForm] =
    useState({
      username: "",
      password: ""
    });


  function addUser(e) {

    e.preventDefault();

    const username =
      form.username.trim();

    if (
      !username ||
      !form.password ||
      data.users[username]
    ) return;


    persist({

      ...data,

      users: {

        ...data.users,

        [username]: {

          password:
            form.password,

          role:
            "user"

        }

      }

    });


    setForm({
      username: "",
      password: ""
    });

  }


  function deleteUser(username) {

    if (
      data.users[username]?.role ===
      "admin"
    ) return;

    const users =
      { ...data.users };

    delete users[username];

    persist({
      ...data,
      users
    });

  }


  return (

    <div className="fade-in space-y-4">

      <form
        onSubmit={addUser}
        className="bg-white border border-[#E4E1D8] rounded-2xl p-4"
      >

        <h3 className="font-black text-sm flex items-center gap-2 mb-4">

            placeholder="Kullanıcı adı"

              setForm({
                ...form,
                username:
                  e.target.value
              })
            }
            className="p-2.5 border border-[#E4E1D8] rounded-xl text-xs bg-[#FCFCFA]"
          />

          <input
            type="password"
            placeholder="Şifre"
            value={form.password}
            onChange={e =>
              setForm({
                ...form,
                password:
                  e.target.value
              })
            }
            className="p-2.5 border border-[#E4E1D8] rounded-xl text-xs bg-[#FCFCFA]"
          />

        </div>


        <button
          className="mt-3 w-full py-2.5 bg-[#1C1B19] text-white rounded-xl text-xs font-black"

          Kullanıcı Oluştur
        </button>

      </form>


      <div className="bg-white border border-[#E4E1D8] rounded-2xl p-4">

        <h3 className="font-black text-sm mb-3">

        </h3>

        <div className="space-y-2">

          {Object.entries(

          ).map(
            ([username, user]) => (

              <div
                key={username}

                <div className="flex items-center gap-3">

                  <div className="w-8 h-8 rounded-lg bg-white flex items-center justify-center">

                    <Icon
                      name={
                        user.role === "admin"
                          ? "shield-check"
                          : "user"
                      }
                      size={15}
                    />

                  </div>

                  <div>

                    <b className="text-xs">
                      {username}
                    </b>

                    <div className="text-[10px] text-[#77736B]">
                      {user.role === "admin"

                {user.role !== "admin" && (

  {
    id: "gider",
    label: "Giderler",
    icon: "receipt"
  },

  {
    id: "karzarar",
    label: "Kâr / Zarar",
    icon: "trending-down"
  },

  {
    id: "yonetici",
    label: "Yönetici",
    icon: "shield-check"
  }

];


/* =========================================================
   APP
========================================================= */

function App() {

  const [data, setData] =
    useState(DEFAULT_DATA);

  const [loading, setLoading] =
    useState(true);

  const [error, setError] =
    useState("");

  const [user, setUser] =
    useState(null);

  const [page, setPage] =
    useState("dashboard");

  const [date, setDate] =
    useState(todayISO());

  const [month, setMonth] =
    useState(monthISO());

  const [mobileMenu, setMobileMenu] =
    useState(false);


  useEffect(() => {

    const unsubscribe =
      onSnapshot(
        DATA_REF,

        snapshot => {

          if (
            snapshot.exists()
          ) {

            setData(
              mergeData(
                snapshot.data()
              )
            );

          } else {

            setDoc(
              DATA_REF,
              DEFAULT_DATA
            );

            setData(
              DEFAULT_DATA
            );

          }

          setLoading(false);

        },

        err => {

          console.error(err);

          setError(
            "Firebase bağlantısında sorun oluştu."
          );

          setLoading(false);

        }
      );


    return unsubscribe;

  }, []);


  async function persist(next) {

    setData(next);

    try {

      await setDoc(
        DATA_REF,
        next
      );

      setError("");

    } catch (err) {

      console.error(err);

      setError(
        "Veri kaydedilemedi. İnternet bağlantısını kontrol edin."
      );

    }

  }


  if (loading) {

    return (

      <div className="min-h-screen bg-[#1C1B19] flex items-center justify-center">

        <div className="text-center">

          <div className="w-14 h-14 rounded-2xl bg-[#B4432E] text-white flex items-center justify-center mx-auto mb-4">

            <Icon
              name="pizza"
              size={28}
            />

          </div>

          <div className="text-white font-bold text-sm">
            Mano Pizza
          </div>

          <div className="text-[#77736B] text-xs mt-1">
            Sistem yükleniyor...
          </div>

        </div>

      </div>

    );

  }


  if (!user) {

    return (

      <Login
        users={data.users}
        onLogin={setUser}
      />

    );

  }


  const isAdmin =
    user.role === "admin";


  const visibleNav =
    isAdmin
      ? NAV_ITEMS
      : NAV_ITEMS.filter(
          item =>
            [
              "dashboard",
              "alis",
              "satis"
            ].includes(item.id)
        );


  const active =
    visibleNav.find(
      item =>
        item.id === page
    )
    || visibleNav[0];


  function navigate(id) {

    setPage(id);
    setMobileMenu(false);

  }


  return (

    <div className="min-h-screen bg-[#F7F6F2] text-[#1C1B19]">

      <div className="max-w-[1400px] mx-auto min-h-screen flex">


        {/* SIDEBAR */}

        <aside
          className={
            "fixed lg:sticky top-0 left-0 z-50 w-[250px] h-screen bg-[#1C1B19] text-white p-4 transition-transform " +
            (
              mobileMenu
                ? "translate-x-0"
                : "-translate-x-full lg:translate-x-0"
            )
          }
        >

          <div className="flex items-center gap-3 px-2 mb-8">

            <div className="w-10 h-10 rounded-xl bg-[#B4432E] flex items-center justify-center">

              <Icon
                name="pizza"
                size={21}
              />

            </div>

            <div>

              <div className="font-black">
                Mano Pizza
              </div>

              <div className="text-[10px] text-[#858078]">
                İşletme Yönetim Paneli
              </div>

            </div>

          </div>


          <div className="space-y-1">

            {visibleNav.map(
              item => (

                <button
                  key={item.id}
                  onClick={() =>
                    navigate(item.id)
                  }
                  className={
                    "w-full flex items-center gap-3 px-3 py-3 rounded-xl text-xs font-bold text-left transition " +
                    (
                      page === item.id
                        ? "bg-white text-[#1C1B19]"
                        : "text-[#AAA69D] hover:bg-[#2A2926]"
                    )
                  }
                >

                  <Icon
                    name={item.icon}
                    size={17}
                  />

                  {item.label}

                </button>

              )
            )}

          </div>


          <div className="absolute left-4 right-4 bottom-4 border-t border-[#383631] pt-3">

            <div className="flex justify-between items-center">

              <div>

                <div className="text-xs font-bold">
                  {user.username}
                </div>

                <div className="text-[10px] text-[#77736B]">
                  {isAdmin
                    ? "Yönetici"
                    : "Kullanıcı"}
                </div>

              </div>


              <button
                onClick={() =>
                  setUser(null)
                }
                className="text-[#969188]"
              >

                <Icon
                  name="log-out"
                  size={17}
                />

              </button>

            </div>

          </div>

        </aside>


        {mobileMenu && (

          <div
            onClick={() =>
              setMobileMenu(false)
            }
            className="fixed inset-0 bg-black/40 z-40 lg:hidden"
          />

        )}


        {/* MAIN */}

        <main className="flex-1 min-w-0">

          {/* HEADER */}

          <header className="sticky top-0 z-30 bg-[#F7F6F2]/95 backdrop-blur border-b border-[#E5E1D8]">

            <div className="px-4 sm:px-6 py-4 flex items-center justify-between gap-3">

              <div className="flex items-center gap-3">

                <button
                  onClick={() =>
                    setMobileMenu(true)
                  }
                  className="lg:hidden"
                >

                  <Icon
                    name="menu"
                    size={21}
                  />

                </button>


                <div>

                  <div className="flex items-center gap-2">

                    <Icon
                      name={active.icon}
                      size={18}
                    />

                    <h1 className="text-lg font-black">
                      {active.label}
                    </h1>

                  </div>

                  <div className="text-[10px] text-[#77736B] mt-0.5">
                    Mano Pizza · {user.username}
                  </div>

                </div>

              </div>


              {[
                "alis",
                "satis",
                "gider"
              ].includes(page) && (

                <input
                  type="date"
                  value={date}
                  onChange={e =>
                    setDate(e.target.value)
                  }
                  className="bg-white border border-[#E2DED5] rounded-xl px-2.5 py-2 text-xs outline-none"
                />

              )}


              {[
                "dashboard",
                "karzarar"
              ].includes(page) && (

                <input
                  type="month"
                  value={month}
                  onChange={e =>
                    setMonth(e.target.value)
                  }
                  className="bg-white border border-[#E2DED5] rounded-xl px-2.5 py-2 text-xs outline-none"
                />

              )}

            </div>

          </header>


          {/* CONTENT */}

          <div className="p-4 sm:p-6">

            {error && (

              <div className="mb-4 p-3 rounded-xl bg-[#FBEDEA] text-[#9E3928] text-xs flex items-center gap-2">

                <Icon
                  name="triangle-alert"
                  size={15}
                />

                {error}

              </div>

            )}


            {page === "dashboard" && (

              <Dashboard
                data={data}
                month={month}
              />

            )}


            {page === "alis" && (

              <Purchases
                data={data}
                persist={persist}
                date={date}
                isAdmin={isAdmin}
              />

            )}


            {page === "satis" && (

              <Sales
                data={data}
                persist={persist}
                date={date}
                isAdmin={isAdmin}
              />

            )}


            {page === "maliyet" &&
              isAdmin && (

                <Costs
                  data={data}
                  persist={persist}
                />

              )}


            {page === "gider" &&
              isAdmin && (

                <Expenses
                  data={data}
                  persist={persist}
                  date={date}
                />

              )}


            {page === "karzarar" &&
              isAdmin && (

                <ProfitLoss
                  data={data}
                  month={month}
                />

              )}


            {page === "yonetici" &&
              isAdmin && (

                <Admin
                  data={data}
                  persist={persist}
                />

              )}

          </div>

        </main>

      </div>

    </div>

  );

}


/* =========================================================
   START
========================================================= */

ReactDOM
  .createRoot(
    document.getElementById("root")
  )
  .render(
    <App />
  );

</script>

</body>
</html>

<script type="text/babel">

const {
  useState,
  useEffect,
  useMemo
} = React;


/* =========================================================

========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyBLXwi0r4QrMlpA7PxYEFwy5ADr_Q9nPqk",
  authDomain: "mano-pizza.firebaseapp.com",
  projectId: "mano-pizza",
  storageBucket: "mano-pizza.firebasestorage.app",

  appId: "1:558530166779:web:fe990140b59ad5dd1e155e"
};


/* =========================================================
   SABİTLER
========================================================= */

const ADMIN_USERNAME = "mathrew";
const ADMIN_PASSWORD = "01102022";

const DEFAULT_STORES = [
  "Metro Market",
  "File Market"
];

const PRODUCTS = [
  "Margarita Pizza",
  ...Array.from(
    {length:20},
    (_,i) => `Pizza No:${i+1}`
  )

/* =========================================================
   BOŞ VERİ
========================================================= */

function createEmptyData(){

  return {

    version: 3,

    stores: [...DEFAULT_STORES],

    purchases: {},

    purchaseLocks: {},

    sales: {},

    salesLocks: {},

    costs: {},

    users: {
      [ADMIN_USERNAME]: {
        password: ADMIN_PASSWORD,
        role: "admin"
      }
    }

  };

}


/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function today(){

  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");

}


function monthNow(){

  return today().slice(0,7);

}


function money(value){

  return new Intl.NumberFormat(
    "tr-TR",
    {
      style:"currency",
      currency:"TRY",
      maximumFractionDigits:2
    }
  ).format(Number(value)||0);

}


function dateText(value){

  if(!value) return "";

  return new Date(
    value+"T00:00:00"
  ).toLocaleDateString(
    "tr-TR",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}


function monthText(value){

  if(!value) return "";

  return new Date(
    value+"-01T00:00:00"
  ).toLocaleDateString(
    "tr-TR",
    {
      month:"long",
      year:"numeric"
    }
  );

}


/* =========================================================
   ANA UYGULAMA
========================================================= */

function App(){

  const [data,setData] = useState(createEmptyData());

  const [ready,setReady] = useState(false);

  const [firebaseError,setFirebaseError] = useState("");

  const [saving,setSaving] = useState(false);

  const [user,setUser] = useState(null);

  const [tab,setTab] = useState("alis");

  const [date,setDate] = useState(today());


  /* -------------------------------------------------------
     FIREBASE BAĞLANTISI
  ------------------------------------------------------- */

  useEffect(()=>{

    let unsubscribe;

    const start = async()=>{

      try{

        while(!window.firebaseReady){

          await new Promise(
            r=>setTimeout(r,100)
          );

        }

        const {
          initializeApp,
          getFirestore,
          doc,
          onSnapshot
        } = window.firebaseReady;

        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);

        const ref = doc(
          db,
          "mano_pizza",
          "veri"
        );

        unsubscribe = onSnapshot(
          ref,

          snap=>{

            if(snap.exists()){

              const remote = snap.data();

              const clean = {

                ...createEmptyData(),

                ...remote,

                stores:
                  Array.isArray(remote.stores)
                    ? remote.stores
                    : DEFAULT_STORES,

                users:
                  remote.users || createEmptyData().users,

                purchases:
                  remote.purchases || {},

                purchaseLocks:
                  remote.purchaseLocks || {},

                sales:
                  remote.sales || {},

                salesLocks:
                  remote.salesLocks || {},

                costs:
                  remote.costs || {}

              };

              setData(clean);

            }else{

              const initial = createEmptyData();

              setDoc(
                ref,
                initial,
                {merge:true}
              ).catch(console.error);

              setData(initial);

            }

            setFirebaseError("");

            setReady(true);

          },

          error=>{

            console.error(error);

            setFirebaseError(
              "Firebase bağlantısı kurulamadı."
            );

            setReady(true);

          }

        );

      }catch(error){

        console.error(error);

        setFirebaseError(
          "Firebase başlatılamadı."
        );

        setReady(true);

      }

    };

    start();

    return ()=>{

      if(unsubscribe){
        unsubscribe();
      }

    };

  },[]);


  /* -------------------------------------------------------
     KAYDET
  ------------------------------------------------------- */

  async function save(next){

    setData(next);

    setSaving(true);

    try{

      const {
        setDoc,
        doc,
        getFirestore
      } = window.firebaseReady;

      const app =
        initializeFirebaseAgain();

      const db =
        getFirestore(app);

      const ref =
        doc(
          db,
          "mano_pizza",
          "veri"
        );

      await setDoc(
        ref,
        next,
        {merge:false}
      );

      setFirebaseError("");

    }catch(error){

      console.error(error);

      setFirebaseError(
        "Kaydedilemedi. Firebase bağlantısını kontrol edin."
      );

    }finally{

      setSaving(false);

    }

  }


  function initializeFirebaseAgain(){

    if(!window.__manoFirebase){

      window.__manoFirebase =
        window.firebaseReady.initializeApp(
          firebaseConfig,
          "mano-secondary"
        );

    }

    return window.__manoFirebase;

  }


  if(!ready){

    return <Loading/>;

  }


  if(!user){

    return (
      <Login
        users={data.users}
        onLogin={setUser}
      />
    );

  }


  const admin =
    user.role === "admin";


  const tabs = admin
    ? [
        ["alis","Alış","🛒"],
        ["satis","Satış","📈"],
        ["maliyet","Maliyet","💰"],
        ["kar","Kâr / Zarar","📊"],
        ["yonetim","Yönetim","⚙️"]
      ]
    : [
        ["alis","Alış","🛒"],
        ["satis","Satış","📈"]
      ];


  return (

    <div className="min-h-screen bg-[#f6f4ef]">

      <div className="max-w-[900px] mx-auto px-3 sm:px-5 safe-bottom">


        {/* HEADER */}

        <header
          className="
            pt-4 pb-3
            flex items-center justify-between
          "
        >

          <div className="flex items-center gap-3">

            <div
              className="
                w-11 h-11
                rounded-2xl
                bg-[#b4432e]
                text-white
                flex items-center justify-center
                text-xl
                shadow-sm
              "
            >
              🍕
            </div>

            <div>

              <h1
                className="
                  text-[18px]
                  font-black
                  tracking-tight
                  m-0
                "
              >
                MANO PIZZA
              </h1>

              <p
                className="
                  text-[11px]
                  text-[#77736b]
                  m-0
                "
              >
                İşletme Paneli
              </p>

            </div>

          </div>


          <div className="flex items-center gap-2">

            <div
              className="
                hidden sm:block
                text-right
              "
            >

              <div className="text-xs font-bold">
                {user.username}
              </div>

              <div className="text-[10px] text-[#77736b]">
                {admin ? "Yönetici" : "Personel"}
              </div>

            </div>


            <button
              onClick={()=>setUser(null)}
              className="
                w-9 h-9
                rounded-xl
                bg-white
                border border-[#e2dfd7]
                text-[#77736b]
              "
            >
              ↪
            </button>

          </div>

        </header>


        {/* DURUM */}

        <div
          className="
            flex items-center justify-between
            mb-3
            px-3 py-2
            rounded-xl
            bg-white
            border border-[#e2dfd7]
          "
        >

          <div className="flex items-center gap-2">

            <span
              className={`
                w-2 h-2 rounded-full
                ${firebaseError
                  ? "bg-[#b4432e]"
                  : "bg-[#2d8a63]"
                }
              `}
            />

            <span
              className="
                text-[11px]
                text-[#77736b]
              "
            >
              {firebaseError
                ? firebaseError
                : saving
                  ? "Kaydediliyor..."
                  : "Veriler senkronize"}
            </span>

          </div>

          <span
            className="
              text-[10px]
              text-[#aaa69d]
            "
          >
            Firebase
          </span>

        </div>


        {/* TARİH */}

        {(tab==="alis" || tab==="satis") && (

          <div
            className="
              bg-white
              rounded-2xl
              border border-[#e2dfd7]
              p-3
              mb-3
            "
          >

            <div className="flex items-center gap-3">

              <div className="text-xl">
                📅
              </div>

              <div className="flex-1">

                <div
                  className="
                    text-[10px]
                    text-[#8b877e]
                    mb-1
                  "
                >
                  KAYIT TARİHİ
                </div>

                <input
                  type="date"
                  value={date}
                  onChange={
                    e=>setDate(e.target.value)
                  }
                  className="
                    w-full
                    bg-transparent
                    border-0
                    text-sm
                    font-bold
                    p-0
                  "
                />

              </div>

              <div
                className="
                  hidden sm:block
                  text-xs
                  text-[#8b877e]
                "
              >
                {dateText(date)}
              </div>

            </div>

          </div>

        )}


        {/* SEKME MENÜSÜ */}

        <div
          className="
            grid
            grid-cols-2
            sm:grid-cols-5
            gap-2
            mb-4
          "
        >

          {tabs.map(([id,label,icon])=>(

            <button
              key={id}
              onClick={()=>setTab(id)}
              className={`
                min-h-[52px]
                rounded-2xl
                border
                flex
                items-center
                justify-center
                gap-2
                text-xs
                font-bold
                transition
                ${
                  tab===id
                    ? "bg-[#1c1b19] text-white border-[#1c1b19]"
                    : "bg-white text-[#77736b] border-[#e2dfd7]"
                }
              `}
            >

              <span>
                {icon}
              </span>

              {label}

            </button>

          ))}

        </div>


        {/* İÇERİK */}

        {tab==="alis" && (

          <Purchases
            data={data}
            date={date}
            admin={admin}
            save={save}
          />

        )}


        {tab==="satis" && (

          <Sales
            data={data}
            date={date}
            admin={admin}
            save={save}
          />

        )}


        {tab==="maliyet" && admin && (

          <Costs
            data={data}
            save={save}
          />

        )}


        {tab==="kar" && admin && (

          <Profit
            data={data}
          />

        )}


        {tab==="yonetim" && admin && (

          <Management
            data={data}
            save={save}
          />

        )}

      </div>

    </div>

  );

}


/* =========================================================
   LOADING
========================================================= */

function Loading(){

  return (

    <div
      className="
        min-h-screen
        bg-[#1c1b19]
        flex
        items-center
        justify-center
        text-white
      "
    >

      <div className="text-center">

        <div className="text-5xl mb-4">
          🍕
        </div>

        <div className="font-black text-xl">
          MANO PIZZA
        </div>

        <div
          className="
            text-xs
            text-[#aaa69d]

          "
        >

/* =========================================================
   LOGIN
========================================================= */

function Login({users,onLogin}){

  const [username,setUsername] = useState("");

  const [password,setPassword] = useState("");

  const [error,setError] = useState("");


  function submit(e){

    e.preventDefault();

    const name =
      username.trim();

    const account =
      users[name];

    if(
      account &&
      account.password === password
    ){

      onLogin({
        username:name,
        role:account.role
      });

      return;

    }

    setError(
      "Kullanıcı adı veya şifre hatalı."
    );

    setPassword("");

  }


  return (

    <div
      className="
        min-h-screen
        bg-[#1c1b19]
        flex
        items-center
        justify-center
        p-5
      "
    >

      <div
        className="
          w-full
          max-w-[360px]
        "
      >

        <div className="text-center mb-8">

          <div
            className="
              w-20 h-20
              rounded-3xl
              bg-[#b4432e]
              mx-auto
              flex
              items-center
              justify-center
              text-4xl
              mb-4
            "
          >
            🍕
          </div>

          <h1
            className="
              text-white
              text-2xl
              font-black
              m-0
            "
          >
            MANO PIZZA
          </h1>

          <p
            className="
              text-[#99958d]
              text-xs
              mt-1
            "
          >
            İşletme Yönetim Paneli
          </p>

        </div>


        <form
          onSubmit={submit}
          className="
            bg-[#292825]
            rounded-3xl
            p-5
          "
        >

          <label
            className="
              block
              text-[11px]
              text-[#aaa69d]
              mb-1.5
            "
          >
            Kullanıcı adı
          </label>

          <input
            value={username}
            autoCapitalize="none"
            onChange={
              e=>setUsername(e.target.value)
            }
            className="
              w-full
              bg-[#1e1d1b]
              border border-[#403e38]
              text-white
              rounded-xl
              p-3.5
              text-sm
              mb-4
            "
          />


          <label
            className="
              block
              text-[11px]
              text-[#aaa69d]
              mb-1.5
            "
          >
            Şifre
          </label>

          <input
            type="password"
            value={password}
            onChange={
              e=>setPassword(e.target.value)
            }
            className="
              w-full
              bg-[#1e1d1b]
              border border-[#403e38]
              text-white
              rounded-xl
              p-3.5
              text-sm
            "
          />


          {error && (

            <div
              className="
                text-[#e08a75]
                text-xs
                mt-3
              "
            >
              {error}
            </div>

          )}


          <button
            type="submit"
            className="
              w-full
              bg-white
              text-[#1c1b19]
              rounded-xl
              py-3.5
              mt-5
              font-black
              text-sm
            "
          >
            Giriş Yap
          </button>

        </form>

      </div>

    </div>

  );

}


/* =========================================================
   ALIŞ
========================================================= */

function Purchases({
  data,
  date,
  admin,
  save
}){

  const [store,setStore] = useState(null);

  const [newStore,setNewStore] = useState("");

  const [showStore,setShowStore] = useState(false);

  const [form,setForm] = useState({
    product:"",
    qty:"1",
    price:""
  });


  const day =
    data.purchases[date] || {};

  const locks =
    data.purchaseLocks[date] || {};


  function totalStore(name){

    return (
      day[name] || []
    ).reduce(
      (sum,item)=>
        sum +
        Number(item.qty)*Number(item.price),
      0
    );

  }


  const totalDay =
    data.stores.reduce(
      (s,x)=>s+totalStore(x),
      0
    );


  function addStore(){

    const name =
      newStore.trim();

    if(
      !name ||
      data.stores.includes(name)
    ) return;

    save({

      ...data,

      stores:[
        ...data.stores,
        name
      ]

    });

    setNewStore("");

    setShowStore(false);

  }


  function addItem(e){

    e.preventDefault();

    if(!store) return;

    const product =
      form.product.trim();

    const qty =
      Number(form.qty);

    const price =
      Number(form.price);

    if(
      !product ||
      qty<=0 ||
      price<0 ||
      !Number.isFinite(qty) ||
      !Number.isFinite(price)
    ) return;


    const item = {

      id:
        Date.now()+"-"+Math.random(),

      product,

      qty,

      price

    };


    const nextDay = {

      ...day,

      [store]:[
        ...(day[store]||[]),
        item
      ]

    };


    save({

      ...data,

      purchases:{
        ...data.purchases,
        [date]:nextDay
      }

    });


    setForm({
      product:"",
      qty:"1",
      price:""
    });

  }


  function removeItem(id){

    if(!store) return;

    const items =
      (day[store]||[])
      .filter(x=>x.id!==id);


    save({

      ...data,

      purchases:{
        ...data.purchases,
        [date]:{
          ...day,
          [store]:items
        }
      }

    });

  }


  function lockStore(){

    save({

      ...data,

      purchaseLocks:{
        ...data.purchaseLocks,
        [date]:{
          ...locks,
          [store]:true
        }
      }

    });

  }


  function unlockStore(){

    save({

      ...data,

      purchaseLocks:{
        ...data.purchaseLocks,
        [date]:{
          ...locks,
          [store]:false
        }
      }

    });

  }


  /* MAĞAZA DETAY */

  if(store){

    const items =
      day[store] || [];

    const locked =
      !!locks[store];


    return (

      <div>

        <button
          onClick={()=>setStore(null)}
          className="
            mb-3
            border-0
            bg-transparent
            text-[#77736b]
            text-xs
            font-bold
          "
        >
          ← Mağazalara dön
        </button>


        <div
          className="
            bg-white
            rounded-2xl
            border border-[#e2dfd7]
            p-4
            mb-3
            flex
            items-center
            justify-between
          "
        >

          <div>

            <div className="font-black">
              {store}
            </div>

            <div
              className="
                text-[11px]
                text-[#77736b]
              "
            >
              {items.length} ürün
            </div>

          </div>


          {locked && (

            <span
              className="
                bg-[#f1efe9]
                rounded-lg
                px-2.5 py-1
                text-[10px]
                font-bold
                text-[#77736b]
              "
            >
              🔒 Onaylandı
            </span>

          )}

        </div>


        {!locked && (

          <form
            onSubmit={addItem}
            className="
              bg-white
              border border-[#e2dfd7]
              rounded-2xl
              p-4
              mb-3
            "
          >

            <div
              className="
                grid
                grid-cols-1
                sm:grid-cols-3
                gap-2
                mb-2
              "
            >

              <input
                placeholder="Ürün adı"
                value={form.product}
                onChange={
                  e=>setForm({
                    ...form,
                    product:e.target.value
                  })
                }
                className="
                  p-3
                  rounded-xl
                  border border-[#e2dfd7]
                  bg-[#faf9f6]
                  text-sm
                "
              />

              <input
                type="number"
                min="0"
                step="0.01"
                placeholder="Miktar"
                value={form.qty}
                onChange={
                  e=>setForm({
                    ...form,
                    qty:e.target.value
                  })
                }
                className="
                  p-3
                  rounded-xl
                  border border-[#e2dfd7]
                  bg-[#faf9f6]
                  text-sm
                "
              />

              <input
                type="number"
                min="0"
                step="0.01"
                placeholder="Birim fiyat"
                value={form.price}
                onChange={
                  e=>setForm({
                    ...form,
                    price:e.target.value
                  })
                }
                className="
                  p-3
                  rounded-xl
                  border border-[#e2dfd7]
                  bg-[#faf9f6]
                  text-sm
                "
              />

            </div>


            <button
              className="
                w-full
                bg-[#1c1b19]
                text-white
                rounded-xl
                py-3
                font-bold
                text-xs
              "
            >
              + Ürün Ekle
            </button>

          </form>

        )}


        <div className="space-y-2">

          {items.map(item=>(

            <div
              key={item.id}
              className="
                bg-white
                border border-[#e2dfd7]
                rounded-2xl
                p-3.5
                flex
                items-center
                justify-between
              "
            >

              <div>

                <div className="text-sm font-bold">
                  {item.product}
                </div>

                <div
                  className="
                    text-[11px]
                    text-[#77736b]
                    mt-1
                  "
                >

/* =========================================================
   SATIŞ
========================================================= */

function Sales({
  data,
  date,
  admin,
  save
}){

  const rows =
    data.sales[date] || {};

  const locked =
    !!data.salesLocks[date];


  const total =
    PRODUCTS.reduce(
      (sum,p)=>{

        const r =
          rows[p] || {};

        return sum +
          (Number(r.qty)||0) *
          (Number(r.price)||0);

      },
      0
    );


  function update(product,field,value){

    if(locked && !admin) return;


    const old =
      rows[product] || {
        qty:"",
        price:""
      };


    save({

      ...data,

      sales:{
        ...data.sales,

        [date]:{

          ...rows,

          [product]:{
            ...old,
            [field]:value
          }

        }

      }

    });

  }


  function lock(){

    save({

      ...data,

      salesLocks:{
        ...data.salesLocks,
        [date]:true
      }

    });

  }


  function unlock(){

    save({

      ...data,

      salesLocks:{
        ...data.salesLocks,
        [date]:false
      }

    });

  }


  const hasData =
    PRODUCTS.some(
      p=>Number(rows[p]?.qty)>0
    );


  return (

    <div>

      <div
        className="
          bg-[#1c1b19]
          text-white
          rounded-2xl
          p-4
          mb-3
          flex
          justify-between
        "
      >

        <span className="text-xs text-[#aaa69d]">
          Günün Satışı
        </span>

        <strong>
          {money(total)}
        </strong>

      </div>


      {locked && (

        <div
          className="
            bg-[#f0eee8]
            border border-[#ddd9cf]
            rounded-2xl
            p-3
            mb-3
            text-xs
            font-bold
            text-[#77736b]
          "
        >
          🔒 Bu günün satışları onaylandı.
        </div>

      )}


      <div
        className="
          bg-white
          border border-[#e2dfd7]
          rounded-2xl
          overflow-hidden
        "
      >

        {PRODUCTS.map((product,index)=>{

          const r =
            rows[product] || {
              qty:"",
              price:""
            };

          const line =
            (Number(r.qty)||0) *
            (Number(r.price)||0);


          return (

            <div
              key={product}
              className="
                p-3
                border-b border-[#eeeae2]
              "
            >

              <div
                className="
                  flex
                  items-center
                  justify-between
                  mb-2
                "
              >

                <div
                  className="
                    text-xs
                    font-bold
                    truncate
                    pr-2
                  "
                >
                  {product}
                </div>

                <div
                  className="
                    text-xs
                    font-black
                  "
                >
                  {money(line)}
                </div>

              </div>


              <div
                className="
                  grid
                  grid-cols-2
                  gap-2
                "
              >

                <div>

                  <div
                    className="
                      text-[9px]
                      text-[#99958d]
                      mb-1
                    "
                  >
                    ADET
                  </div>

                  <input
                    type="number"
                    min="0"
                    value={r.qty}
                    disabled={locked && !admin}
                    onChange={
                      e=>update(
                        product,
                        "qty",
                        e.target.value
                      )
                    }
                    placeholder="0"
                    className="
                      w-full
                      p-2.5
                      rounded-xl
                      border border-[#e2dfd7]
                      bg-[#faf9f6]
                      text-sm
                      text-right
                    "
                  />

                </div>


                <div>

                  <div
                    className="
                      text-[9px]
                      text-[#99958d]
                      mb-1
                    "
                  >
                    BİRİM FİYAT
                  </div>

                  <input
                    type="number"
                    min="0"
                    step="0.01"
                    value={r.price}
                    disabled={locked && !admin}
                    onChange={
                      e=>update(
                        product,
                        "price",
                        e.target.value
                      )
                    }
                    placeholder="₺"
                    className="
                      w-full
                      p-2.5
                      rounded-xl
                      border border-[#e2dfd7]
                      bg-[#faf9f6]
                      text-sm
                      text-right
                    "
                  />

                </div>

              </div>

            </div>

          );

        })}

      </div>


      {locked && admin && (

        <button
          onClick={unlock}
          className="
            w-full
            mt-3
            bg-white
            border border-[#e2dfd7]
            rounded-2xl
            py-3
            font-bold
            text-sm
          "
        >
          🔓 Kilidi Kaldır
        </button>

      )}


      {!locked && !admin && hasData && (

        <button
          onClick={lock}
          className="
            w-full
            mt-3
            bg-[#b4432e]
            text-white
            border-0
            rounded-2xl
            py-3.5
            font-black
            text-sm
          "
        >
          ✓ Satışları Kaydet ve Onayla
        </button>

      )}

    </div>

  );

}


/* =========================================================
   MALİYET
========================================================= */

function Costs({
  data,
  save
}){

  const costs =
    data.costs || {};


  function update(
    product,
    field,
    value
  ){

    const old =
      costs[product] || {};

    save({

      ...data,

      costs:{
        ...costs,

        [product]:{
          ...old,
          [field]:value
        }

      }

    });

  }


  return (

    <div className="space-y-2">

      {PRODUCTS.map(product=>{

        const c =
          costs[product] || {
            cost:"",
            price:""
          };

        const cost =
          Number(c.cost)||0;

        const price =
          Number(c.price)||0;

        const profit =
          price-cost;

        const margin =
          price>0
            ? profit/price*100
            : 0;


        return (

          <div
            key={product}
            className="
              bg-white
              border border-[#e2dfd7]
              rounded-2xl
              p-3
            "
          >

            <div
              className="
                font-bold
                text-xs
                mb-3
              "
            >
              {product}
            </div>


            <div
              className="
                grid
                grid-cols-2
                gap-2
              "
            >

              <div>

                <div
                  className="
                    text-[9px]
                    text-[#99958d]
                    mb-1
                  "
                >
                  MALİYET
                </div>

                <input
                  type="number"
                  min="0"
                  step="0.01"
                  value={c.cost}
                  onChange={
                    e=>update(
                      product,
                      "cost",
                      e.target.value
                    )
                  }
                  className="
                    w-full
                    p-2.5
                    border border-[#e2dfd7]
                    rounded-xl
                    bg-[#faf9f6]
                    text-sm
                    text-right
                  "
                />

              </div>


              <div>

                <div
                  className="
                    text-[9px]
                    text-[#99958d]
                    mb-1
                  "
                >
                  SATIŞ
                </div>

                <input
                  type="number"
                  min="0"
                  step="0.01"
                  value={c.price}
                  onChange={
                    e=>update(
                      product,
                      "price",
                      e.target.value
                    )
                  }
                  className="
                    w-full
                    p-2.5
                    border border-[#e2dfd7]
                    rounded-xl
                    bg-[#faf9f6]
                    text-sm
                    text-right
                  "
                />

              </div>

            </div>


            <div
              className="
                mt-3
                flex
                justify-between
                text-xs
              "
            >

              <span className="text-[#77736b]">
                Birim kâr
              </span>

              <strong>
                {money(profit)}
                {" "}
                ({margin.toFixed(0)}%)
              </strong>

            </div>

          </div>

        );

      })}

    </div>

  );

}


/* =========================================================
   KAR ZARAR
========================================================= */

function Profit({
  data
}){

  const [month,setMonth] =
    useState(monthNow());


  const stats =
    useMemo(()=>{

      let sales=0;

      let purchases=0;


      Object.entries(
        data.sales || {}
      ).forEach(([date,rows])=>{

        if(!date.startsWith(month))
          return;

        Object.values(rows)
          .forEach(r=>{

            sales +=
              (Number(r.qty)||0) *
              (Number(r.price)||0);

          });

      });


      Object.entries(
        data.purchases || {}
      ).forEach(([date,stores])=>{

        if(!date.startsWith(month))
          return;

        Object.values(stores)
          .forEach(items=>{

            items.forEach(item=>{

              purchases +=
                (Number(item.qty)||0) *
                (Number(item.price)||0);

            });

          });

      });


      return {

        sales,

        purchases,

        net:
          sales-purchases

      };

    },[data,month]);


  return (

    <div>

      <div
        className="
          bg-white
          border border-[#e2dfd7]
          rounded-2xl
          p-3
          mb-3
        "
      >

        <div
          className="
            text-[10px]
            text-[#99958d]
            mb-1
          "
        >
          RAPOR DÖNEMİ
        </div>

        <input
          type="month"
          value={month}
          onChange={
            e=>setMonth(e.target.value)
          }
          className="
            border-0
            text-sm
            font-black
            w-full
          "
        />

      </div>


      <div
        className="
          grid
          grid-cols-1
          sm:grid-cols-3
          gap-2
          mb-3
        "
      >

        <Card
          title="Toplam Satış"
          value={money(stats.sales)}
          icon="📈"
        />

        <Card
          title="Toplam Alış"
          value={money(stats.purchases)}
          icon="🛒"
        />

        <Card
          title="Net"
          value={money(stats.net)}
          icon="💰"
        />

      </div>


      <div
        className="
          bg-[#1c1b19]
          text-white
          rounded-2xl
          p-5
        "
      >

        <div
          className="
            text-[10px]
            text-[#aaa69d]
            mb-2
          "
        >
          {monthText(month)}
        </div>

        <div
          className="
            text-2xl
            font-black
          "
        >
          {money(stats.net)}
        </div>

        <div
          className="
            text-xs
            text-[#aaa69d]
            mt-1
          "
        >
          Satış − Alış
        </div>

      </div>

    </div>

  );

}

/* =========================================================
   YÖNETİM
========================================================= */

function Management({
  data,
  save
}){

  const [username,setUsername] =
    useState("");

  const [password,setPassword] =
    useState("");

  const users =
    data.users || {};


  function addUser(e){

    e.preventDefault();

    const name =
      username.trim();

    const pass =
      password.trim();

    if(
      !name ||
      !pass ||
      users[name]
    ) return;


    save({

      ...data,

      users:{

        ...users,

        [name]:{
          password:pass,
          role:"user"
        }

      }

    });


    setUsername("");

    setPassword("");

  }


  function removeUser(name){

    if(name===ADMIN_USERNAME)
      return;


    const copy =
      {...users};

    delete copy[name];


    save({

      ...data,

      users:copy

    });

  }


  return (

    <div>

      <form
        onSubmit={addUser}
        className="
          bg-white
          border border-[#e2dfd7]
          rounded-2xl
          p-4
          mb-3
        "
      >

        <div
          className="
            font-black
            text-sm
            mb-3
          "
        >
          👤 Yeni Kullanıcı
        </div>


        <div
          className="
            grid
            grid-cols-1
            sm:grid-cols-2
            gap-2
          "
        >

          <input
            placeholder="Kullanıcı adı"
            value={username}
            autoCapitalize="none"
            onChange={
              e=>setUsername(e.target.value)
            }
            className="
              p-3
              rounded-xl
              border border-[#e2dfd7]
              bg-[#faf9f6]
            "
          />

          <input
            placeholder="Şifre"
            value={password}
            onChange={
              e=>setPassword(e.target.value)
            }
            className="
              p-3
              rounded-xl
              border border-[#e2dfd7]
              bg-[#faf9f6]
            "
          />

        </div>


        <button
          className="
            w-full
            mt-2
            bg-[#1c1b19]
            text-white
            border-0
            rounded-xl
            py-3
            font-bold
            text-xs
          "
        >
          + Kullanıcı Oluştur
        </button>

      </form>


      <div className="space-y-2">

        {Object.entries(users).map(
          ([name,u])=>(

            <div
              key={name}
              className="
                bg-white
                border border-[#e2dfd7]
                rounded-2xl
                p-4
                flex
                justify-between
                items-center
              "
            >

              <div>

                <div className="font-bold text-sm">
                  {name}
                </div>

                <div
                  className="
                    text-[10px]
                    text-[#77736b]
                    mt-1
                  "
                >
                  {u.role==="admin"
                    ? "Yönetici"
                    : "Personel"}
                </div>

              </div>


              {u.role!=="admin" && (

                <button
                  onClick={()=>
                    removeUser(name)
                  }
                  className="
                    w-9 h-9
                    rounded-xl
                    border-0
                    bg-[#f5f3ee]
                  "
                >
                  🗑
                </button>

              )}

            </div>

          )
        )}

      </div>

    </div>

  );

}
